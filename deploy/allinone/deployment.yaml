# 平台主进程 Deployment（P6.2 形态 A：同端口提供 /api/v1 + Chat SSE + 内嵌 SPA）。
#
# 为什么要显式单副本（replicas: 1）：
#   登录会话态 platform.auth.session_store 本期固定内存态，且 Agent 审批提案、
#   SSE 订阅都是进程内状态，多副本会把会话和审批打断在两个进程上。扩副本前要先
#   满足 ADR-030 前置条件（持久化会话态 + 跨进程审批/订阅），不能只改这个数字。
# 更新策略用 Recreate：数据卷可能是 RWO，滚动更新会让新 Pod 抢不到同一个卷而卡住。
#
# 探针语义（P6.1，不得写成同义空壳）：
#   /healthz 进程级存活，不碰外部依赖；/readyz = Store 连通 + schema 迁移到位。
#   迁移没做完时 /readyz 非 200，流量不会进来，但 Pod 不会被反复重启。
#
# 镜像档位（P6.3 / D-33 / ADR-044 v1.1）：默认交付镜像（仓库根 Dockerfile）内置 bash、jq
# 与 kubectl，容器内排障能力与本地 CLI 对齐。安全不靠"镜像里没有解释器"：含 shell 构造的
# 命令一律经真人审批且不被 --skip-permissions 免除，写操作经人工审批，Secret 值与 --raw 硬拒，
# 真实权限由集群 RBAC 决定。安全基线禁止容器内 shell 的现场改用 Dockerfile.distroless 构建
# 无 shell 变体，同时把 ConfigMap 里 platform.exec.shell_enabled 置为 false。
#
# 只读根文件系统 + 非 root 65532（与镜像 USER 一致）：/tmp 与 /home/k8sai 必须是可写卷，
# 后者是 kubectl 服务发现缓存（$HOME/.kube）的落点，缺了会在首次 kubectl 调用时写失败。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-ai-server
  namespace: k8s-ai
  labels:
    app: k8s-ai
    component: server
    app.kubernetes.io/component: server
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: k8s-ai
      component: server
  template:
    metadata:
      labels:
        app: k8s-ai
        component: server
    spec:
      serviceAccountName: k8s-ai
      # 平台要用自身身份访问本集群 API（集群端点默认走 in-cluster 配置）。
      automountServiceAccountToken: true
      containers:
        - name: k8s-ai
          # 镜像地址由部署方提供（deploy/install.sh 的 IMAGE/TAG 参数）；
          # 清单里不写私有仓库地址这类环境专有值。
          image: k8s-ai:latest
          args: ["server", "--config", "/etc/k8s-ai/config.yaml", "--addr", ":8080"]
          ports:
            - name: http
              containerPort: 8080
          env:
            # 存储 DSN（含数据库口令）：只走 Secret，ConfigMap 里的 dsn 恒为空。
            - name: K8S_AI_PLATFORM_STORE_DSN
              valueFrom:
                secretKeyRef: { name: k8s-ai-store, key: dsn }
            # 凭据加密密钥：kubeconfig / 配置中心敏感键的落库加密主密钥。
            - name: K8S_AI_ENC_KEY
              valueFrom:
                secretKeyRef: { name: k8s-ai-enc, key: key }
            # 首启管理员口令：仅空库首启必需，初始化完成后可以摘掉。
            - name: K8S_AI_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: { name: k8s-ai-admin, key: password, optional: true }
            # 模型密钥（密钥态，env 恒优先）。其余动态键（模型地址/模型名/审批策略等）
            # 一律由配置中心页面写入 DB settings，不在清单里注入；
            # 非敏感部署期种子值见 deploy/example/env-overrides.example.yaml。
            - name: K8S_AI_LLM_API_KEY
              valueFrom:
                secretKeyRef: { name: k8s-ai-llm, key: api_key, optional: true }
          volumeMounts:
            - name: config
              mountPath: /etc/k8s-ai
              readOnly: true
            # 可写区：/data 会话与审计落盘、/reports 报告导出。业务数据的权威存储是
            # MySQL，这几个卷都是临时卷；要持久保留就 apply
            # deploy/example/deployment-reports-pvc.yaml 换成 PVC。
            - name: data
              mountPath: /data
            - name: reports
              mountPath: /reports
            - name: tmp
              mountPath: /tmp
            # 镜像 ENV HOME=/home/k8sai：kubectl 把服务发现缓存写在 $HOME/.kube。
            # 只读根文件系统下这个目录不挂可写卷，kubectl 会在运行期报缓存写入失败。
            - name: home
              mountPath: /home/k8sai
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            capabilities:
              drop: ["ALL"]
            seccompProfile: { type: RuntimeDefault }
      volumes:
        - name: config
          configMap:
            name: k8s-ai-config
            defaultMode: 0444
        - name: data
          emptyDir: {}
        - name: reports
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: home
          emptyDir: {}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
