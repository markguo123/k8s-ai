# 持久卷（P6.2 / P6.5 / D-31）：默认建议创建（install.sh 会建，PERSIST_REPORTS=false 才不建）。
# 下面两种情况必须创建：
#   1) 报告与导出需要跨重启保留（不挂 PVC 时 /reports 是 emptyDir，重启即清）；
#   2) 用 SQLite 兜底存储（platform.store.driver=sqlite）——此时库文件所在的
#      /data 必须落 PVC，禁止写在容器可写层。MySQL 主口径下 PVC 不承载业务数据。
#
# 挂载方式：先 apply 本文件，再 apply deploy/example/deployment-reports-pvc.yaml
# 把后端 Deployment 的 emptyDir 换成 Claim。
# 容量与访问模式按现场存储能力调整（install.sh 用 REPORT_STORAGE_SIZE 渲染，默认 5Gi）；
# 单副本 RWO 足够，扩副本前改 RWX。
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: k8s-ai-data
  namespace: k8s-ai
  labels:
    app: k8s-ai
    app.kubernetes.io/component: storage
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
  # 保持注释 = 用集群默认存储类（install.sh 的 STORAGE_CLASS 留空就是这个语义）。
  # 现场要指定就取消注释并改成 kubectl get storageclass 里的名字；
  # 取消注释却仍保留下面这行的模板占位值，会让 PVC 一直卡在 Pending。
  # storageClassName: REPLACE_WITH_STORAGE_CLASS
