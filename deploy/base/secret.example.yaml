# 平台密钥示例（P6.2 / D-21：敏感值只走环境变量 + Secret）。
#
# 用法：复制成 deploy/secret.yaml（已在 .gitignore 之外的请自行排除）或直接用
# kubectl create secret，替换所有 REPLACE_ME 后 apply。绝不把真实值提交进仓库，
# 也绝不写进 ConfigMap。deploy/install.sh 走的是 kubectl create secret 幂等路径，
# 本文件是给「手工 YAML」路径当模板用的。
#
# 四个 Secret 各自独立，便于分别轮换：
#   k8s-ai-store  存储 DSN（含数据库口令）——必填（platform.store.driver=mysql）
#   k8s-ai-enc    凭据加密密钥——必填；缺失时集群端点返回 501、配置中心敏感键被拒
#   k8s-ai-admin  首启管理员口令——只在空库首启必需（重启不再要求）
#   k8s-ai-llm    模型接口密钥——可选（也可只在配置中心页面填写）
apiVersion: v1
kind: Secret
metadata:
  name: k8s-ai-store
  namespace: k8s-ai
  labels:
    app: k8s-ai
    app.kubernetes.io/component: secret
type: Opaque
stringData:
  # 必须是 go-sql-driver 连接串且带 parseTime=true（TIMESTAMP 要扫成 time.Time），
  # 例：k8sai:REPLACE_ME@tcp(mysql-host:3306)/k8s_ai?charset=utf8mb4&parseTime=true&loc=Local
  # 库与账号由 DBA 预建（产品不执行 CREATE DATABASE），建议 utf8mb4。
  dsn: "REPLACE_ME"
---
apiVersion: v1
kind: Secret
metadata:
  name: k8s-ai-enc
  namespace: k8s-ai
  labels:
    app: k8s-ai
    app.kubernetes.io/component: secret
type: Opaque
stringData:
  # 32 字节密钥，64 位 hex 或 base64；生成：openssl rand -hex 32
  # 轮换风险：换密钥后既有密文（集群凭据、配置中心敏感键）全部不可解，
  # 轮换前必须已备份旧密钥并完成重加密，详见部署手册 §4.10。
  key: "REPLACE_ME"
---
apiVersion: v1
kind: Secret
metadata:
  name: k8s-ai-admin
  namespace: k8s-ai
  labels:
    app: k8s-ai
    app.kubernetes.io/component: secret
type: Opaque
stringData:
  # 仅空库首启用它创建内置管理员（用户名见 platform.auth.admin_username）。
  # 初始化完成后可以从 Deployment 移除这个环境变量引用。
  password: "REPLACE_ME"
---
apiVersion: v1
kind: Secret
metadata:
  name: k8s-ai-llm
  namespace: k8s-ai
  labels:
    app: k8s-ai
    app.kubernetes.io/component: secret
type: Opaque
stringData:
  # 密钥态：env 恒优先于配置中心页面值（D-29 两档语义）。注入后页面里
  # model.api_key 会标注「由部署密钥提供，页面值暂不生效」。
  api_key: "REPLACE_ME"
