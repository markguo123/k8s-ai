# 平台工作负载共用的 ServiceAccount（P6.2）。
# 默认不自动挂载 Token：只有需要访问本集群 API 的 Pod（server）在 Pod 规格里
# 显式打开 automountServiceAccountToken: true；迁移 Job、前端 Nginx 都不需要。
# token_ttl 见 platform.auth.token_ttl（平台自身的登录态，与 SA Token 无关）。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-ai
  namespace: k8s-ai
  labels:
    app: k8s-ai
    app.kubernetes.io/component: identity
automountServiceAccountToken: false
