# k8s-ai 只读 RBAC：get/list/watch + pods/log get + secrets 元数据/键级读取（get/list/watch）。
# 不授任何写动词；不含 pods/exec、pods/portforward、pods/attach、metrics（ADR-009 / SECURITY.md）。
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8s-ai-readonly
  labels:
    app: k8s-ai
rules:
  - apiGroups: [""]
    resources: [namespaces, pods, nodes, services, endpoints, events, configmaps]
    verbs: [get, list, watch]
  - apiGroups: [""]
    # secrets 仅用于元数据/键级读取（ListSecretMeta），内容值永不出采集边界
    resources: [secrets]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [apps]
    resources: [deployments, replicasets, statefulsets, daemonsets]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch]
  - apiGroups: [storage.k8s.io]
    resources: [persistentvolumes, persistentvolumeclaims, storageclasses, volumeattachments]
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, networkpolicies]
    verbs: [get, list, watch]