# 部署期环境变量覆盖示例（P6.12 ⑩⑪ / D-29 两档语义）：示例口径，默认清单不含这些。
#
# 本文件是 strategic merge patch，不是可 apply 的清单（刻意不写 apiVersion/kind）：
# 只能用 kubectl patch --patch-file，`kubectl apply -R -f deploy/` 会在它这里报校验错误。
#
# 一句话口径：页面配过的以页面为准，页面没配过的用部署变量兜底，密钥永远以 Secret 为准。
#
#   密钥态（K8S_AI_LLM_API_KEY、K8S_AI_PLATFORM_STORE_DSN）：env/Secret 恒优先，
#     页面值暂不生效，但页面会标注来源、保存时给显式提示。已由 deployment.yaml 注入。
#   种子态 seed-once（K8S_AI_LLM_{PROVIDER,ENDPOINT,MODEL} +
#     K8S_AI_{KUBECONFIG,KUBE_CONTEXT,NAMESPACE,KUBECTL_PATH}）：只在配置库该键为空时
#     提供首启种子值；管理员在页面保存过一次之后，环境变量永久让位给页面。
#   白名单之外一律不认（temperature / max_tokens / timeout 刻意不纳入，见 v1.51 ⑨）。
#
# 应用方式（给后端 Deployment 追加环境变量，按 name 合并，不动其他字段）：
#   kubectl -n k8s-ai patch deploy k8s-ai-server --type=strategic \
#     --patch-file deploy/example/env-overrides.example.yaml
# 撤销：kubectl -n k8s-ai set env deploy/k8s-ai-server K8S_AI_LLM_ENDPOINT-
#
# 注意：KUBECONFIG / KUBECTL_PATH 在容器里没有意义（镜像内无 kubectl、集群内用
# in-cluster 身份），列在这里只为口径完整，形态 A/B 都不要设。
spec:
  template:
    spec:
      containers:
        - name: k8s-ai
          env:
            # 首启把模型服务地址与模型名「播种」进配置库，之后由配置中心页面接管。
            - name: K8S_AI_LLM_ENDPOINT
              value: "http://llm-gateway.example.net:8000/v1"
            - name: K8S_AI_LLM_MODEL
              value: "qwen-plus"
            # 空值等于「不注入」：可以先占位，后由 CI/CD 填值。
            - name: K8S_AI_LLM_PROVIDER
              value: ""
            # Chat 默认工作命名空间（种子态；页面上保存过就以页面为准）。
            - name: K8S_AI_NAMESPACE
              value: ""
