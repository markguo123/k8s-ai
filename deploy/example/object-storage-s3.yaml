# 对象存储接 S3 兼容桶（P8.8 / 方案 15 §10.1、§14）：示例口径，默认清单不含现场地址。
#
# 本文件是 strategic merge patch，不是可 apply 的清单（刻意不写 apiVersion/kind）：
# 只能用 kubectl patch --patch-file，`kubectl apply -R -f deploy/` 会在它这里报校验错误。
#
# 前置一：先建凭据（AK/SK 只进 Secret，不进 ConfigMap、不进仓库），见
# deploy/base/secret.example.yaml 里的 aegisops-blobs 段。
#
# 前置二：桶由平台组预建，运行账号只给对象读写权限。清单里 create_bucket 恒为 false，
# 因为启动期建桶会把「桶名写错 / 凭据没权限」变成 Pod 起不来——那样聊天、审批、审计
# 都会跟着停，而它们本来一个字节都不需要对象存储。桶不存在或不可达时，对象类 API 回 503
# 并在 /api/v1/storage/health 里点名原因，/readyz 不受影响。
#
# 换后端之前必须先迁对象（重要）：server 只按配置装配一个内容后端。已经跑过 db 或 dir
# 后端的实例，直接把 driver 改成 s3，会让 objects 表里仍写着旧 driver 的历史对象读不到
# （下载返回 409 待迁移，历史报告打不开）。正确顺序：
# 容器内必须带 --config /etc/aegisops/config.yaml：不带就回落默认 sqlite（空库），只会报 schema 0
#   aegisops --config /etc/aegisops/config.yaml blobs migrate --to s3 --dry-run   # 先看清单，零改动
#   aegisops --config /etc/aegisops/config.yaml blobs migrate --to s3               # 内容先落桶、按 sha256 核对，才翻元数据
#   aegisops --config /etc/aegisops/config.yaml blobs verify --strict            # 退出码 0 才算迁完
#   然后再打本补丁并切 driver
# deploy/install.sh 在 apply 之前会挡这一步（ALLOW_DRIVER_MISMATCH 是显式绕行，不是推荐路径）。
#
# PVC 三态（决定打完补丁还要不要卷）：
#   platform.store.driver=sqlite          → PVC 必需（库文件本身在 /data）
#   platform.blobs.driver=dir             → PVC 必需（对象只有 /data/blobs 这一份副本）
#   platform.blobs.driver=s3（本文件）    → 报告 PVC 可选，对象不需要卷；上传中转走 /tmp
# 报告导出仍会写一份 report.directory 兼容副本，要不要跨重启保留见 deployment-reports-pvc.yaml。
#
# 应用方式（给后端 Deployment 追加环境变量，按 name 合并，不动其他字段）：
#   kubectl -n aegisops patch deploy aegisops-server --type=strategic \
#     --patch-file deploy/example/object-storage-s3.yaml
# 撤销对象后端：kubectl -n aegisops set env deploy/aegisops-server \
#   AEGISOPS_PLATFORM_BLOBS_DRIVER- AEGISOPS_PLATFORM_BLOBS_ENDPOINT- \
#   AEGISOPS_PLATFORM_BLOBS_BUCKET- AEGISOPS_PLATFORM_BLOBS_TMP_DIR-
spec:
  template:
    spec:
      containers:
        - name: aegisops
          env:
            - name: AEGISOPS_PLATFORM_BLOBS_DRIVER
              value: "s3"
            # host:port，不带 scheme；TLS 用下面的 use_tls 表达。
            - name: AEGISOPS_PLATFORM_BLOBS_ENDPOINT
              value: "REPLACE_WITH_S3_HOST_PORT"
            - name: AEGISOPS_PLATFORM_BLOBS_BUCKET
              value: "REPLACE_WITH_BUCKET_NAME"
            # 签名区域。MinIO 等自建填 us-east-1 即可。
            - name: AEGISOPS_PLATFORM_BLOBS_REGION
              value: "us-east-1"
            # 集群内经 Service 访问自建 MinIO 常见 false；走公网对象存储必须 true。
            - name: AEGISOPS_PLATFORM_BLOBS_USE_TLS
              value: "false"
            # 自建 MinIO/Ceph 必须路径式寻址；AWS 官方端点可置 false。
            - name: AEGISOPS_PLATFORM_BLOBS_PATH_STYLE
              value: "true"
            # 生产口径：桶预建，运行账号无建桶权限。
            - name: AEGISOPS_PLATFORM_BLOBS_CREATE_BUCKET
              value: "false"
            # 上传中转目录：镜像根文件系统只读，这里落在 /tmp 空卷上，不落根文件系统。
            - name: AEGISOPS_PLATFORM_BLOBS_TMP_DIR
              value: "/tmp/aegisops-blobs"
            - name: AEGISOPS_PLATFORM_BLOBS_ACCESS_KEY
              valueFrom:
                secretKeyRef: { name: aegisops-blobs, key: access_key }
            - name: AEGISOPS_PLATFORM_BLOBS_SECRET_KEY
              valueFrom:
                secretKeyRef: { name: aegisops-blobs, key: secret_key }
