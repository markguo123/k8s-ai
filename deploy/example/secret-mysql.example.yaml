# MySQL 接入示例（P6.5 / v1.49）：占位值，示例口径，不是产品默认配置。
#
# 默认清单 platform.store.driver 已经是 mysql，本文件只演示「DSN 怎么填」。
# 口令永远不进 ConfigMap、不进仓库，只进 Secret。
#
# 前置（产品不执行 CREATE DATABASE，库和账号由 DBA 预建）：
#   CREATE DATABASE k8s_ai DEFAULT CHARACTER SET utf8mb4 COLLATE utf8mb4_general_ci;
#   CREATE USER 'k8s_ai'@'%' IDENTIFIED BY '<口令>';
#   -- 表级 DDL 已显式 utf8mb4，不依赖库默认字符集；账号需要建表/改表权限（迁移用），
#   -- 不需要 DCL 级别的库权限。
#   GRANT SELECT,INSERT,UPDATE,DELETE,CREATE,ALTER,INDEX,REFERENCES ON `k8s_ai`.* TO 'k8s_ai'@'%';
#
# DSN 硬性要求：go-sql-driver 连接串且参数段必须带 parseTime=true，否则配置校验直接
# 拒绝启动（TIMESTAMP 需要扫成 time.Time）。缺 parseTime 的报错见 config validate。
apiVersion: v1
kind: Secret
metadata:
  name: k8s-ai-store
  namespace: k8s-ai
  labels:
    app: k8s-ai
    app.kubernetes.io/component: secret
type: Opaque
stringData:
  # 场景一：MySQL 与被部署应用在同一个集群 —— 用 Service 域名，别写 Pod IP。
  dsn: "k8s_ai:REPLACE_ME@tcp(mysql.k8s-ai.svc.cluster.local:3306)/k8s_ai?charset=utf8mb4&parseTime=true&loc=Local"
  # 场景二：MySQL 在集群外（RDS / 物理机）——换掉主机与端口即可：
  # dsn: "k8s_ai:REPLACE_ME@tcp(mysql.example.net:3306)/k8s_ai?charset=utf8mb4&parseTime=true&loc=Local"
  # 场景三：走已有 Secrets 管理（External Secrets / SOPS 等）时，只要最终渲染出
  # 同名 Secret、同名字段 dsn 即可，本清单不参与同步。
