# AegisOps 二/三期：Agent 写操作与资源创建权限示例（RBAC）
#
# ⚠️ 说明：
#   - 默认 deploy/base/clusterrole.yaml 保持只读（scan 巡检 + chat 只读调查）。
#   - 仅当需要 aegisops chat 执行"修复操作"（patch/scale/restart/delete）时，
#     才按需授予以下写权限；LLM 永远不是权限主体，真实边界来自 RBAC。
#   - 三期创建通道（create_resource）用 Server-Side Apply 提交，需要 create + patch
#     （覆盖已有对象时还需 update）；server dry run 同样按 create/patch 鉴权。
#   - metrics/kubectl top 等只读能力由 deploy/base/clusterrole.yaml 提供；本文件只增加写能力，
#     但仍保留 Agent 常用资源的只读权限，便于单独裁掉默认只读角色时仍能完成审批前检查。
#   - secrets 只授 create/patch/update：aegisops 不会读取 Secret 内容值
#     （创建时只写 stringData 的 $GENERATE 占位符，由执行器生成随机值），
#     因此这里刻意不给 secrets 的 get/list/watch，也不给 delete。
#   - 建议按最小权限裁剪 resources/verbs（如不需要 delete 就删除）。
#   - 使用方法：kubectl apply -f deploy/rbac-write.example.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: aegisops-write
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["get", "list", "watch", "create", "patch", "update"]
  - apiGroups: ["apps"]
    # kubectl scale / autoscale 会读写 scale 子资源，不能只给父资源授权。
    resources: ["deployments/scale", "statefulsets/scale", "replicasets/scale"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods", "configmaps", "services", "endpoints", "events", "namespaces", "nodes", "serviceaccounts", "limitranges", "resourcequotas", "persistentvolumeclaims", "persistentvolumes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods", "configmaps", "services", "namespaces", "serviceaccounts", "limitranges", "resourcequotas", "persistentvolumeclaims"]
    # create/patch/update 供三期创建通道（SSA）使用；delete 仅供二期修复操作
    verbs: ["create", "patch", "update"]
  - apiGroups: [""]
    resources: ["pods", "configmaps", "services"]
    verbs: ["patch", "update", "delete"]
  - apiGroups: [""]
    # 仅非交互 exec；客户端/服务端仍硬拒 -i/-t、attach 与 port-forward。
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: [""]
    # kubectl cordon/uncordon/taint 修改 Node 的 spec，不走子资源。
    resources: ["nodes"]
    verbs: ["patch", "update"]
  - apiGroups: [""]
    # Secret 只创建/覆盖，永不读取内容值（AGENTS.md LLM Safety / SECURITY.md §3）
    resources: ["secrets"]
    verbs: ["create", "patch", "update"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["create", "patch", "update"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["create", "patch", "update"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    # namespaced RBAC 可随 create_resource / kubectl 修复走审批；cluster-scoped RBAC
    # 刻意不在此默认示例中开放，避免一次误批直接产生提权链。
    resources: ["roles", "rolebindings"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: aegisops-write
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: aegisops-write
subjects:
  - kind: ServiceAccount
    name: aegisops
    namespace: aegisops
