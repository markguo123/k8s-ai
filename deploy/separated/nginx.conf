# k8s-ai 前端 Nginx 站点配置（P6.2 形态 B，随 deploy/separated/web.Dockerfile 打进镜像）。
#
# 监听 8080：nginx-unprivileged 以 uid 101 运行，绑不了 80，由 Service 做 80→8080。
# 三条语义缺一不可：index.html 不缓存（否则发版后拿旧壳）、assets 强缓存
# （文件名带 hash）、SPA history fallback（刷新子路由不 404）。

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 容器内健康检查（也供 Ingress 探活使用；不命中磁盘文件）。
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 发版即时生效：入口壳永远回源校验。
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # 带 hash 的构建产物：一年强缓存。
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA history fallback：只覆盖前端路由。未知 /api/v1/* 由后端返回 JSON 404，
    # 绝不能被这里吞成 index.html（前端拿到 HTML 就无法定位错误）。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 仅当由本 Nginx 直接反代后端 API（不经 Ingress 同域分流，例如前端独立子域）
    # 时才需要。同域路径分流场景请走 deploy/separated/ingress.yaml，本段不参与匹配。
    location /api/v1/ {
        proxy_pass http://k8s-ai-server:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Chat SSE：后端已自带 X-Accel-Buffering: no，这里再显式关一次缓冲。
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
