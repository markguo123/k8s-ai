<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" style="background:#fff" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Arial,sans-serif">
  <defs>
    <filter id="ao-shadow" x="-8%" y="-8%" width="116%" height="122%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <marker id="ao-arr" markerWidth="11" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L11,4 L0,8 Z" fill="#475569"/>
    </marker>
    <marker id="ao-arrrev" markerWidth="11" markerHeight="8" refX="2.5" refY="4" orient="auto">
      <path d="M11,0 L0,4 L11,8 Z" fill="#475569"/>
    </marker>
    <marker id="ao-arrw" markerWidth="11" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L11,4 L0,8 Z" fill="#e11d48" opacity="0.8"/>
    </marker>
  </defs>

  <text x="500" y="32" font-size="24" font-weight="bold" text-anchor="middle" fill="#0f172a">k8s-ai 企业级 Kubernetes AI 智能运维 Agent 全景架构</text>

  <!-- ============ 用户交互层（双入口） ============ -->
  <rect x="40" y="52" width="920" height="92" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="60" y="74" font-size="13" font-weight="bold" fill="#334155">用户交互层 · 双入口 · 同一 Agent 平台</text>
  <rect x="80" y="88" width="170" height="48" rx="8" fill="#1e293b" filter="url(#ao-shadow)"/>
  <text x="165" y="111" font-size="15" font-weight="bold" text-anchor="middle" fill="#ffffff">k8s-ai chat</text>
  <text x="165" y="129" font-size="11" text-anchor="middle" fill="#cbd5e1">终端 / 命令行 · 脚本友好</text>
  <rect x="280" y="88" width="170" height="48" rx="8" fill="#0f766e" filter="url(#ao-shadow)"/>
  <text x="365" y="111" font-size="15" font-weight="bold" text-anchor="middle" fill="#ffffff">k8s-ai web</text>
  <text x="365" y="129" font-size="11" text-anchor="middle" fill="#99f6e4">浏览器 Web UI · 可视化</text>
  <rect x="560" y="88" width="380" height="48" rx="8" fill="#eef2ff" stroke="#6366f1" filter="url(#ao-shadow)"/>
  <text x="750" y="111" font-size="14" font-weight="bold" text-anchor="middle" fill="#312e81">统一服务接入</text>
  <text x="750" y="129" font-size="11" text-anchor="middle" fill="#4338ca">HTTP / 流式 SSE · 会话语义一致</text>
  <line x1="250" y1="112" x2="560" y2="112" stroke="#475569" stroke-width="2" marker-end="url(#ao-arr)"/>
  <line x1="450" y1="112" x2="560" y2="112" stroke="#475569" stroke-width="2" marker-end="url(#ao-arr)"/>

  <!-- ============ 接入与会话层 ============ -->
  <rect x="40" y="164" width="920" height="92" rx="14" fill="#f0f9ff" stroke="#7dd3fc"/>
  <text x="60" y="186" font-size="13" font-weight="bold" fill="#0369a1">接入与会话层 · Access and Session</text>
  <rect x="70" y="200" width="200" height="48" rx="8" fill="#0369a1" filter="url(#ao-shadow)"/>
  <text x="170" y="223" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">ChatService</text>
  <text x="170" y="241" font-size="11" text-anchor="middle" fill="#bae6fd">意图分发 · 对话编排</text>
  <rect x="290" y="200" width="200" height="48" rx="8" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="390" y="223" font-size="13" font-weight="bold" text-anchor="middle" fill="#075985">Session 会话</text>
  <text x="390" y="241" font-size="11" text-anchor="middle" fill="#0c4a6e">持久化 · 上下文恢复</text>
  <rect x="510" y="200" width="200" height="48" rx="8" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="610" y="223" font-size="13" font-weight="bold" text-anchor="middle" fill="#075985">Audit 审计</text>
  <text x="610" y="241" font-size="11" text-anchor="middle" fill="#0c4a6e">全流程脱敏留痕</text>
  <rect x="730" y="200" width="200" height="48" rx="8" fill="#0284c7" filter="url(#ao-shadow)"/>
  <text x="830" y="223" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">Report 报告</text>
  <text x="830" y="241" font-size="11" text-anchor="middle" fill="#bae6fd">MD / JSON / 终端摘要</text>

  <!-- ============ Agent 核心层 ============ -->
  <rect x="40" y="276" width="920" height="230" rx="14" fill="#eef2ff" stroke="#a5b4fc"/>
  <text x="60" y="298" font-size="13" font-weight="bold" fill="#3730a3">Agent 核心层 · 统一智能编排 · Agent Core</text>
  <!-- LLM -->
  <rect x="80" y="312" width="250" height="118" rx="10" fill="#7c3aed" filter="url(#ao-shadow)"/>
  <text x="205" y="340" font-size="15" font-weight="bold" text-anchor="middle" fill="#ffffff">LLM 引擎</text>
  <text x="205" y="361" font-size="11" text-anchor="middle" fill="#ddd6fe">OpenAI 兼容 · 流式 / 思考型</text>
  <text x="205" y="379" font-size="11" text-anchor="middle" fill="#ddd6fe">私有模型 · 内网部署</text>
  <text x="205" y="397" font-size="11" text-anchor="middle" fill="#ddd6fe">结果脱敏后进入模型</text>
  <!-- Agent Loop -->
  <rect x="360" y="312" width="280" height="118" rx="10" fill="#4f46e5" filter="url(#ao-shadow)"/>
  <text x="500" y="337" font-size="16" font-weight="bold" text-anchor="middle" fill="#ffffff">Agent Loop</text>
  <text x="500" y="357" font-size="12" text-anchor="middle" fill="#c7d2fe">理解 → 规划 → 执行 → 校验</text>
  <text x="500" y="377" font-size="11" text-anchor="middle" fill="#a5b4fc">四层意图决策 · 计划生成</text>
  <text x="500" y="395" font-size="11" text-anchor="middle" fill="#a5b4fc">工具编排 · 结果整合 · 流式上报</text>
  <text x="500" y="413" font-size="11" text-anchor="middle" fill="#a5b4fc">思考过程可视化</text>
  <!-- Tools -->
  <rect x="670" y="312" width="250" height="118" rx="10" fill="#0ea5e9" filter="url(#ao-shadow)"/>
  <text x="795" y="340" font-size="15" font-weight="bold" text-anchor="middle" fill="#ffffff">工具注册表 Tools（29）</text>
  <text x="795" y="361" font-size="11" text-anchor="middle" fill="#e0f2fe">22 只读 · 5 诊断 · 1 写 · 1 创建</text>
  <text x="795" y="379" font-size="11" text-anchor="middle" fill="#e0f2fe">结构化读工具为主路径</text>
  <text x="795" y="397" font-size="11" text-anchor="middle" fill="#e0f2fe">kubectl / create_resource</text>
  <line x1="330" y1="371" x2="360" y2="371" stroke="#475569" stroke-width="2" marker-start="url(#ao-arrrev)" marker-end="url(#ao-arr)"/>
  <line x1="640" y1="371" x2="670" y2="371" stroke="#475569" stroke-width="2" marker-start="url(#ao-arrrev)" marker-end="url(#ao-arr)"/>

  <!-- 变更安全闭环（带内） -->
  <rect x="70" y="442" width="860" height="54" rx="10" fill="#fff7ed" stroke="#fbbf24"/>
  <text x="90" y="474" font-size="12" font-weight="bold" fill="#92400e">变更安全闭环（仅写 / 创建触发）</text>
  <rect x="250" y="452" width="130" height="34" rx="6" fill="#f59e0b"/>
  <text x="315" y="473" font-size="11" font-weight="bold" text-anchor="middle" fill="#7c2d12">工具选择</text>
  <line x1="380" y1="469" x2="398" y2="469" stroke="#92400e" stroke-width="2" marker-end="url(#ao-arr)"/>
  <rect x="400" y="452" width="190" height="34" rx="6" fill="#f59e0b"/>
  <text x="495" y="473" font-size="11" font-weight="bold" text-anchor="middle" fill="#7c2d12">审批层 · 人工确认</text>
  <line x1="590" y1="469" x2="608" y2="469" stroke="#92400e" stroke-width="2" marker-end="url(#ao-arr)"/>
  <rect x="610" y="452" width="320" height="34" rx="6" fill="#dc2626"/>
  <text x="770" y="473" font-size="11" font-weight="bold" text-anchor="middle" fill="#ffffff">执行层 · kubectl / client-go / SSA</text>
  <line x1="500" y1="430" x2="500" y2="442" stroke="#475569" stroke-width="2" marker-end="url(#ao-arr)"/>

  <!-- ============ 巡检诊断能力底座 ============ -->
  <rect x="40" y="526" width="920" height="108" rx="14" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="60" y="546" font-size="13" font-weight="bold" fill="#047857">巡检诊断能力底座 · Inspection and Diagnosis</text>
  <rect x="70" y="562" width="170" height="60" rx="8" fill="#059669" filter="url(#ao-shadow)"/>
  <text x="155" y="586" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">扫描引擎</text>
  <text x="155" y="605" font-size="10" text-anchor="middle" fill="#a7f3d0">7 大维度并发采集</text>
  <rect x="260" y="562" width="170" height="60" rx="8" fill="#d1fae5" stroke="#059669"/>
  <text x="345" y="586" font-size="13" font-weight="bold" text-anchor="middle" fill="#065f46">规则引擎</text>
  <text x="345" y="605" font-size="10" text-anchor="middle" fill="#15803d">35 条 A / B / C 规则</text>
  <rect x="450" y="562" width="170" height="60" rx="8" fill="#059669" filter="url(#ao-shadow)"/>
  <text x="535" y="586" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">证据链 Evidence</text>
  <text x="535" y="605" font-size="10" text-anchor="middle" fill="#a7f3d0">状态/Events/日志 · 脱敏</text>
  <rect x="640" y="562" width="160" height="60" rx="8" fill="#d1fae5" stroke="#059669"/>
  <text x="720" y="586" font-size="13" font-weight="bold" text-anchor="middle" fill="#065f46">诊断 Diagnosis</text>
  <text x="720" y="605" font-size="10" text-anchor="middle" fill="#15803d">根因分析 · 修复建议</text>
  <rect x="820" y="562" width="120" height="60" rx="8" fill="#059669" filter="url(#ao-shadow)"/>
  <text x="880" y="586" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">报告输出</text>
  <text x="880" y="605" font-size="10" text-anchor="middle" fill="#a7f3d0">健康评分</text>

  <!-- ============ Kubernetes 集群 ============ -->
  <rect x="40" y="654" width="920" height="84" rx="14" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="60" y="674" font-size="13" font-weight="bold" fill="#1e40af">Kubernetes 集群 · 受控访问</text>
  <rect x="60" y="688" width="340" height="40" rx="8" fill="#326ce5" filter="url(#ao-shadow)"/>
  <text x="230" y="705" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">Kubernetes API Server</text>
  <text x="230" y="721" font-size="10" text-anchor="middle" fill="#bfdbfe">client-go · kubectl · dynamic + SSA</text>
  <rect x="420" y="688" width="520" height="40" rx="8" fill="#ffffff" stroke="#326ce5"/>
  <text x="680" y="705" font-size="12" font-weight="bold" text-anchor="middle" fill="#1e3a8a">受管对象：工作负载 / 配置与存储 / 网络 / 权限与自定义资源</text>
  <text x="680" y="721" font-size="10" text-anchor="middle" fill="#2563eb">Secret 仅键名/类型元数据读取 · 内容值拒读 · 边界来自 Kubernetes RBAC</text>

  <!-- 写路径（虚线，绕过能力底座直达集群） -->
  <path d="M930,469 L972,469 L972,706 L940,706" fill="none" stroke="#e11d48" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ao-arrw)"/>
  <text x="972" y="600" font-size="10" font-weight="bold" text-anchor="middle" fill="#be123c" transform="rotate(-90 972 600)">变更写路径（SSA）</text>

  <!-- ============ 安全红线 ============ -->
  <rect x="40" y="748" width="920" height="34" rx="8" fill="#dc2626"/>
  <text x="500" y="770" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">安全红线贯穿：只读自动 | 写必须审批 | Secret 内容值拒读 | 双重脱敏 | LLM 无执行能力 | Prompt 注入防护 | 全链路可审计</text>
</svg>
