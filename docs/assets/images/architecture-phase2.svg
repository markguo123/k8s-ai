<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" style="background:#fff">
  <defs>
    <linearGradient id="p2-g1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="p2-g2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#f5576c;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="p2-g3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:1"/>
    </linearGradient>
    <filter id="p2-shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.14"/>
    </filter>
  </defs>

  <text x="500" y="40" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" fill="#222">二期架构：自然语言 Agent 闭环 + 读写操作 + Web UI</text>

  <!-- User Interaction Layer -->
  <rect x="40" y="70" width="920" height="62" rx="12" fill="#EEF2FF" stroke="#6366F1" stroke-width="2" filter="url(#p2-shadow)"/>
  <text x="500" y="106" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#4338CA">用户交互层（三端入口 / 复用同源 Service）</text>
  <text x="180" y="124" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#6366F1">k8s-ai chat（终端）</text>
  <text x="500" y="124" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#6366F1">k8s-ai web（浏览器）</text>
  <text x="820" y="124" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#6366F1">k8s-ai scan（继承一期）</text>

  <line x1="500" y1="132" x2="500" y2="152" stroke="#555" stroke-width="2" marker-end="url(#p2-arr)"/>

  <!-- Service Layer -->
  <rect x="40" y="152" width="920" height="74" rx="12" fill="#FDF6EC" stroke="#F5A623" stroke-width="2" filter="url(#p2-shadow)"/>
  <text x="60" y="176" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#B45309">服务层 Service</text>
  <rect x="70" y="186" width="420" height="32" rx="8" fill="#F5A623"/>
  <text x="280" y="207" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#fff">ChatService（CLI/Web 复用 Agent 闭环）</text>
  <rect x="510" y="186" width="430" height="32" rx="8" fill="#F5A623"/>
  <text x="725" y="207" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#fff">ScanService（一期能力复用）</text>

  <line x1="500" y1="226" x2="500" y2="248" stroke="#555" stroke-width="2" marker-end="url(#p2-arr)"/>

  <!-- Agent Core Layer -->
  <rect x="40" y="248" width="920" height="150" rx="12" fill="#FFF1F2" stroke="#EF4444" stroke-width="2" filter="url(#p2-shadow)"/>
  <text x="60" y="272" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#B91C1C">Agent 核心层</text>
  <rect x="360" y="286" width="280" height="54" rx="10" fill="#EF4444"/>
  <text x="500" y="309" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#fff">Agent Loop</text>
  <text x="500" y="329" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#FECACA">消息循环 · 四层意图决策树 · 流式 SSE</text>

  <rect x="70" y="286" width="260" height="54" rx="8" fill="#FB7185"/>
  <text x="200" y="308" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#fff">工具集 Tools（28 个）</text>
  <text x="200" y="328" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#FFE4E6">22 只读 + 5 诊断 + 1 写（kubectl）</text>

  <rect x="670" y="286" width="260" height="54" rx="8" fill="#FB7185"/>
  <text x="800" y="308" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#fff">LLM 引擎</text>
  <text x="800" y="328" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#FFE4E6">OpenAI 兼容 · 流式/思考型</text>

  <rect x="70" y="352" width="410" height="40" rx="8" fill="#FDA4AF"/>
  <text x="275" y="377" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#7F1D1D">审批层 Approver · 风险分级 · 拒绝闸门</text>
  <rect x="500" y="352" width="430" height="40" rx="8" fill="#FDA4AF"/>
  <text x="715" y="377" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#7F1D1D">执行层 Executor · kubectl argv · client-go 写</text>

  <line x1="500" y1="398" x2="500" y2="422" stroke="#555" stroke-width="2" marker-end="url(#p2-arr)"/>

  <!-- Phase 1 Inherited Layer -->
  <rect x="40" y="422" width="920" height="120" rx="12" fill="#ECFDF5" stroke="#10B981" stroke-width="2" filter="url(#p2-shadow)"/>
  <text x="60" y="448" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#047857">巡检诊断层（一期能力继承：读自动）</text>
  <rect x="70" y="462" width="170" height="66" rx="8" fill="#10B981"/>
  <text x="155" y="486" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#fff">扫描引擎</text>
  <text x="155" y="508" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#A7F3D0">7 大维度并发采集</text>
  <rect x="260" y="462" width="170" height="66" rx="8" fill="#10B981"/>
  <text x="345" y="486" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#fff">规则引擎</text>
  <text x="345" y="508" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#A7F3D0">35 条 A/B/C 规则</text>
  <rect x="450" y="462" width="170" height="66" rx="8" fill="#10B981"/>
  <text x="535" y="486" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#fff">证据链</text>
  <text x="535" y="508" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#A7F3D0">状态/Events/日志</text>
  <rect x="640" y="462" width="140" height="66" rx="8" fill="#10B981"/>
  <text x="710" y="486" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#fff">LLM 诊断</text>
  <text x="710" y="508" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#A7F3D0">根因 + 修复建议</text>
  <rect x="800" y="462" width="140" height="66" rx="8" fill="#10B981"/>
  <text x="870" y="486" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#fff">报告/历史</text>
  <text x="870" y="508" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#A7F3D0">MD/JSON/对比</text>

  <line x1="500" y1="542" x2="500" y2="566" stroke="#555" stroke-width="2" marker-end="url(#p2-arr)"/>

  <!-- Kubernetes -->
  <rect x="300" y="566" width="400" height="52" rx="12" fill="#326CE5" filter="url(#p2-shadow)"/>
  <text x="500" y="592" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#fff">Kubernetes API Server</text>
  <text x="500" y="610" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#BFDBFE">client-go · kubectl binary · 只读 RBAC（默认）</text>

  <!-- Security + MCP planned -->
  <rect x="40" y="636" width="452" height="70" rx="10" fill="#6c5ce7" opacity="0.92"/>
  <text x="266" y="662" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">安全闭环（已交付）</text>
  <text x="266" y="686" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#E0E0FF">写审批 · shell 审批 · Secret 拒读 · 脱敏</text>

  <rect x="512" y="636" width="448" height="70" rx="10" fill="#EDE9FE" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.9"/>
  <text x="736" y="662" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#5B21B6">MCP 外部工具（四期规划）</text>
  <text x="736" y="686" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#6D28D9">Client 接口 + 注册表适配器（未交付）</text>

  <defs>
    <marker id="p2-arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
  </defs>
</svg>
