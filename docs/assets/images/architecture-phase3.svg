<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" style="background:#fff">
  <defs>
    <marker id="p3-arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
    <filter id="p3-shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.14"/>
    </filter>
  </defs>

  <text x="500" y="40" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" fill="#222">三期架构：create_resource 两阶段创建协议（v3.0.0）</text>

  <!-- Agent Layer -->
  <rect x="70" y="80" width="860" height="70" rx="12" fill="#FFF1F2" stroke="#EF4444" stroke-width="2" filter="url(#p3-shadow)"/>
  <text x="500" y="108" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#B91C1C">Agent 决策：四层意图树 → 命中「创建资源」→ create_resource 工具</text>
  <text x="500" y="132" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#7F1D1D">不按资源类型堆工具：单一入口统一创建（manifest + dry-run/apply）</text>

  <line x1="500" y1="150" x2="500" y2="176" stroke="#555" stroke-width="2" marker-end="url(#p3-arr)"/>

  <!-- Stage 1: Dry-run Proposal -->
  <rect x="40" y="176" width="920" height="180" rx="14" fill="#ECFDF5" stroke="#10B981" stroke-width="2" filter="url(#p3-shadow)"/>
  <text x="60" y="204" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#047857">阶段 1 · dry_run（服务端只读校验，不落盘）</text>
  <rect x="70" y="220" width="280" height="120" rx="10" fill="#10B981" opacity="0.9"/>
  <text x="210" y="250" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">校验与门禁</text>
  <text x="210" y="278" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#A7F3D0">kind 黑白名单</text>
  <text x="210" y="300" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#A7F3D0">cluster 授权闸门</text>
  <text x="210" y="322" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#A7F3D0">命名空间存在性 / 未知 Kind</text>

  <rect x="380" y="220" width="250" height="120" rx="10" fill="#00b894" opacity="0.9"/>
  <text x="505" y="250" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">产出创建提案（Proposal）</text>
  <text x="505" y="278" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#A7F3D0">• 生效 manifest 内容</text>
  <text x="505" y="300" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#A7F3D0">• 风险分级 + 风险原因</text>
  <text x="505" y="322" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#A7F3D0">• 内置 Skill findings</text>

  <rect x="660" y="220" width="280" height="120" rx="10" fill="#ffeaa7" opacity="0.95"/>
  <text x="800" y="250" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#6b5b3e">proposal_id</text>
  <text x="800" y="278" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#6b5b3e">提案指纹唯一 ID</text>
  <text x="800" y="300" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#6b5b3e">未 dry-run 不允许 apply</text>
  <text x="800" y="322" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#6b5b3e">内容变更 → 拒绝</text>

  <line x1="500" y1="356" x2="500" y2="382" stroke="#555" stroke-width="2" marker-end="url(#p3-arr)"/>

  <!-- Stage 2: Approval -->
  <rect x="40" y="382" width="920" height="96" rx="14" fill="#FFF7ED" stroke="#F97316" stroke-width="2" filter="url(#p3-shadow)"/>
  <text x="60" y="410" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#C2410C">阶段 2 · 人工审批（唯一写安全门）</text>
  <text x="120" y="440" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#9A3412">Agent 展示：等效 kubectl 命令 · 变更说明 · 风险等级</text>
  <text x="500" y="465" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#9A3412">Secret 值：$GENERATE 由执行器生成 / $ASK 由审批时用户输入</text>

  <line x1="500" y1="478" x2="500" y2="504" stroke="#555" stroke-width="2" marker-end="url(#p3-arr)"/>

  <!-- Stage 3: Apply -->
  <rect x="40" y="504" width="920" height="150" rx="14" fill="#EEF2FF" stroke="#6366F1" stroke-width="2" filter="url(#p3-shadow)"/>
  <text x="60" y="532" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#4338CA">阶段 3 · apply（dry-run 通过 + 审批通过后）</text>
  <rect x="70" y="546" width="280" height="96" rx="10" fill="#6366F1" opacity="0.9"/>
  <text x="210" y="574" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">Server-Side Apply</text>
  <text x="210" y="600" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#C7D2FE">client-go dynamic + SSA</text>
  <text x="210" y="620" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#C7D2FE">fieldManager=k8s-ai</text>

  <rect x="390" y="546" width="240" height="96" rx="10" fill="#5a55c0" opacity="0.92"/>
  <text x="510" y="574" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">一致性校验</text>
  <text x="510" y="600" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#E0E0FF">apply 内容 == dry_run 提案</text>
  <text x="510" y="620" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#E0E0FF">不一致 → 重新 dry_run</text>

  <rect x="660" y="546" width="280" height="96" rx="10" fill="#00cec9" opacity="0.9"/>
  <text x="800" y="574" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">验证 Verify</text>
  <text x="800" y="600" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#fff">对象就绪（Deployment 可用副本</text>
  <text x="800" y="620" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#fff">Pod Running 等）+ 最近事件</text>

  <line x1="500" y1="654" x2="500" y2="680" stroke="#555" stroke-width="2" marker-end="url(#p3-arr)"/>

  <!-- K8s + Security band -->
  <rect x="300" y="680" width="400" height="50" rx="12" fill="#326CE5" filter="url(#p3-shadow)"/>
  <text x="500" y="706" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#fff">Kubernetes API Server</text>
  <text x="500" y="724" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#BFDBFE">dry-run 校验 · SSA apply · watch 验证</text>

  <rect x="40" y="742" width="920" height="26" rx="8" fill="#d63031" opacity="0.9"/>
  <text x="500" y="759" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#fff">安全红线：明文 Secret 值永不进入 LLM / 会话 / 审计 | 创建放开但值读写仍限 create_only</text>
</svg>
