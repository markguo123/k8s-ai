<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 780" style="background:#fff">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="480" y="36" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#222">k8s-ai 整体架构（四层设计）</text>

  <!-- ========== Layer 1: User Interface ========== -->
  <rect x="40" y="60" width="880" height="110" rx="14" fill="#EEF2FF" stroke="#6366F1" stroke-width="2" filter="url(#shadow)"/>
  <text x="60" y="86" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#4338CA">第一层：用户交互层</text>

  <rect x="70" y="100" width="240" height="54" rx="10" fill="#6366F1"/>
  <text x="190" y="123" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">k8s-ai chat</text>
  <text x="190" y="142" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#C7D2FE">终端交互模式</text>

  <rect x="350" y="100" width="240" height="54" rx="10" fill="#6366F1"/>
  <text x="470" y="123" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">k8s-ai web</text>
  <text x="470" y="142" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#C7D2FE">浏览器 Web UI</text>

  <rect x="630" y="100" width="240" height="54" rx="10" fill="#6366F1"/>
  <text x="750" y="123" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">k8s-ai scan</text>
  <text x="750" y="142" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#C7D2FE">一键巡检（继承一期）</text>

  <!-- Arrow 1→2 -->
  <line x1="480" y1="170" x2="480" y2="195" stroke="#555" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ========== Layer 2: Core Capabilities (Agent) ========== -->
  <rect x="40" y="195" width="880" height="200" rx="14" fill="#FFF7ED" stroke="#F97316" stroke-width="2" filter="url(#shadow)"/>
  <text x="60" y="222" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#C2410C">第二层：核心能力层（二期 Agent）</text>

  <!-- Agent Loop - center piece -->
  <rect x="330" y="240" width="300" height="60" rx="12" fill="#F97316"/>
  <text x="480" y="267" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#fff">Agent Loop</text>
  <text x="480" y="287" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#FED7AA">消息循环 + 四层意图决策树</text>

  <!-- Tools -->
  <rect x="70" y="240" width="220" height="60" rx="10" fill="#FB923C"/>
  <text x="180" y="263" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#fff">工具集 (20+1+5)</text>
  <text x="180" y="283" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#FED7AA">20只读 + 1写 + 5诊断</text>

  <!-- LLM -->
  <rect x="670" y="240" width="220" height="60" rx="10" fill="#FB923C"/>
  <text x="780" y="263" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#fff">LLM 引擎</text>
  <text x="780" y="283" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#FED7AA">OpenAI兼容 / 流式输出</text>

  <!-- Approval + Executor row -->
  <rect x="70" y="320" width="280" height="56" rx="10" fill="#FDBA74"/>
  <text x="210" y="345" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#7C2D12">审批层 (Approver)</text>
  <text x="210" y="363" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#9A3412">风险分级 | 拒绝闸门 | 批量审批</text>

  <rect x="380" y="320" width="220" height="56" rx="10" fill="#FDBA74"/>
  <text x="490" y="345" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#7C2D12">执行层 (Executor)</text>
  <text x="490" y="363" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#9A3412">kubectl argv | client-go</text>

  <rect x="630" y="320" width="260" height="56" rx="10" fill="#FDBA74"/>
  <text x="760" y="345" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#7C2D12">会话 &amp; 审计</text>
  <text x="760" y="363" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#9A3412">Session 持久化 | Audit 脱敏落盘</text>

  <!-- Arrows inside layer 2 -->
  <line x1="290" y1="270" x2="330" y2="270" stroke="#C2410C" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="630" y1="270" x2="670" y2="270" stroke="#C2410C" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="480" y1="300" x2="480" y2="320" stroke="#C2410C" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Arrow 2→3 -->
  <line x1="480" y1="395" x2="480" y2="420" stroke="#555" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ========== Layer 3: Phase 1 Inherited ========== -->
  <rect x="40" y="420" width="880" height="140" rx="14" fill="#ECFDF5" stroke="#10B981" stroke-width="2" filter="url(#shadow)"/>
  <text x="60" y="448" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#047857">第三层：巡检诊断层（一期能力）</text>

  <rect x="70" y="462" width="160" height="50" rx="10" fill="#10B981"/>
  <text x="150" y="484" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#fff">扫描引擎</text>
  <text x="150" y="502" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#A7F3D0">Scanner + Reader</text>

  <rect x="250" y="462" width="160" height="50" rx="10" fill="#10B981"/>
  <text x="330" y="484" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#fff">规则引擎</text>
  <text x="330" y="502" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#A7F3D0">35条规则 A/B/C</text>

  <rect x="430" y="462" width="160" height="50" rx="10" fill="#10B981"/>
  <text x="510" y="484" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#fff">证据链</text>
  <text x="510" y="502" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#A7F3D0">状态/Events/日志</text>

  <rect x="610" y="462" width="140" height="50" rx="10" fill="#10B981"/>
  <text x="680" y="484" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#fff">LLM 诊断</text>
  <text x="680" y="502" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#A7F3D0">根因+修复建议</text>

  <rect x="770" y="462" width="130" height="50" rx="10" fill="#10B981"/>
  <text x="835" y="484" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#fff">报告输出</text>
  <text x="835" y="502" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#A7F3D0">MD/JSON/摘要</text>

  <!-- Flow arrows inside layer 3 -->
  <line x1="230" y1="487" x2="250" y2="487" stroke="#047857" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="410" y1="487" x2="430" y2="487" stroke="#047857" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="590" y1="487" x2="610" y2="487" stroke="#047857" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="750" y1="487" x2="770" y2="487" stroke="#047857" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Arrow 3→K8s -->
  <line x1="480" y1="560" x2="480" y2="590" stroke="#555" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ========== Kubernetes ========== -->
  <rect x="280" y="590" width="400" height="50" rx="12" fill="#326CE5" filter="url(#shadow)"/>
  <text x="480" y="618" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#fff">Kubernetes API Server</text>
  <text x="480" y="635" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#BFDBFE">client-go typed client + kubectl binary</text>

  <!-- ========== Layer 4: Security (side bar spanning all layers) ========== -->
  <rect x="40" y="660" width="880" height="100" rx="14" fill="#FEF2F2" stroke="#EF4444" stroke-width="2" filter="url(#shadow)"/>
  <text x="60" y="688" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#B91C1C">第四层：安全层（贯穿全链路）</text>

  <rect x="70" y="700" width="180" height="44" rx="8" fill="#EF4444"/>
  <text x="160" y="719" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#fff">Secret 内容值拒读</text>
  <text x="160" y="735" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#FECACA">仅允许元数据/键名</text>

  <rect x="270" y="700" width="180" height="44" rx="8" fill="#EF4444"/>
  <text x="360" y="719" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#fff">双重脱敏</text>
  <text x="360" y="735" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#FECACA">采集边界 + 报告渲染</text>

  <rect x="470" y="700" width="180" height="44" rx="8" fill="#EF4444"/>
  <text x="560" y="719" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#fff">写操作必须审批</text>
  <text x="560" y="735" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#FECACA">LLM 不是权限主体</text>

  <rect x="670" y="700" width="230" height="44" rx="8" fill="#EF4444"/>
  <text x="785" y="719" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#fff">Prompt 注入防护</text>
  <text x="785" y="735" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#FECACA">Logs/Events/ConfigMap 视为不可信</text>

  <!-- Security side bracket -->
  <rect x="935" y="60" width="6" height="700" rx="3" fill="#EF4444" opacity="0.6"/>
  <text x="950" y="410" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#EF4444" text-anchor="middle" transform="rotate(90 950 410)">安全贯穿全链路</text>
</svg>