<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" style="background:#fff">
  <defs>
    <linearGradient id="p2-grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="p2-grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5576c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="p2-grad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="p2-grad4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#43e97b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#38f9d7;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="500" y="40" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#333">二期架构：自然语言 Agent + 读写操作 + Web UI</text>

  <!-- User Interface Layer -->
  <rect x="50" y="80" width="900" height="60" rx="10" fill="#f8f9fa" stroke="#dee2e6" stroke-width="2"/>
  <text x="500" y="105" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#495057">用户交互层</text>
  <text x="200" y="125" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#6c757d">k8s-ai chat (终端)</text>
  <text x="500" y="125" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#6c757d">k8s-ai web (浏览器)</text>
  <text x="800" y="125" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#6c757d">k8s-ai scan (继承一期)</text>

  <!-- Service Layer -->
  <rect x="50" y="170" width="420" height="80" rx="10" fill="url(#p2-grad1)" opacity="0.9"/>
  <text x="260" y="200" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#fff">服务层 (Service)</text>
  <text x="260" y="225" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#fff">ChatService (CLI/Web 复用)</text>
  <text x="260" y="242" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#fff">ScanService (一期能力)</text>

  <!-- Session & Audit -->
  <rect x="530" y="170" width="420" height="80" rx="10" fill="#6c5ce7" opacity="0.9"/>
  <text x="740" y="200" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#fff">会话与审计</text>
  <text x="740" y="225" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#fff">Session (持久化)</text>
  <text x="740" y="242" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#fff">Audit (脱敏落盘)</text>

  <!-- Agent Layer -->
  <rect x="50" y="280" width="900" height="100" rx="10" fill="url(#p2-grad2)" opacity="0.9"/>
  <text x="500" y="310" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#fff">Agent 核心层</text>
  <text x="200" y="340" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#fff">Agent Loop (消息循环)</text>
  <text x="500" y="340" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#fff">四层意图决策树</text>
  <text x="800" y="340" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#fff">流式输出 (SSE)</text>
  <text x="500" y="365" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#fff">诊断/浏览/ns级/集群全景</text>

  <!-- Tools Layer -->
  <rect x="50" y="410" width="280" height="120" rx="10" fill="#a29bfe" opacity="0.9"/>
  <text x="190" y="440" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#fff">工具集 (Tools)</text>
  <text x="190" y="465" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#fff">20 只读工具 (get_pod/get_events...)</text>
  <text x="190" y="485" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#fff">5 诊断工具 (scan_cluster/diagnose_*)</text>
  <text x="190" y="505" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#fff">1 写工具 (kubectl)</text>
  <text x="190" y="525" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#fff">工具注册表</text>

  <!-- Approval Layer -->
  <rect x="360" y="410" width="280" height="120" rx="10" fill="#fd79a8" opacity="0.9"/>
  <text x="500" y="440" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#fff">审批层 (Approval)</text>
  <text x="500" y="465" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#fff">Approver 接口</text>
  <text x="500" y="485" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#fff">风险分级 (SAFE→CRITICAL)</text>
  <text x="500" y="505" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#fff">批量审批面板</text>
  <text x="500" y="525" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#fff">拒绝闸门 (2次硬拦截)</text>

  <!-- Executor Layer -->
  <rect x="670" y="410" width="280" height="120" rx="10" fill="#fdcb6e" opacity="0.9"/>
  <text x="810" y="440" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">执行层 (Executor)</text>
  <text x="810" y="465" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#333">kubectl argv 直调 (默认)</text>
  <text x="810" y="485" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#333">policy-gated shell (审批后)</text>
  <text x="810" y="505" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#333">client-go 写操作</text>
  <text x="810" y="525" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#333">执行后验证 (Verify)</text>

  <!-- LLM Layer -->
  <rect x="50" y="560" width="280" height="80" rx="10" fill="#ff6b6b" opacity="0.9"/>
  <text x="190" y="590" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#fff">LLM 层</text>
  <text x="190" y="615" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#fff">OpenAI 兼容接口</text>
  <text x="190" y="632" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#fff">流式/非流式 | 思考型模型</text>

  <!-- Phase 1 Inheritance -->
  <rect x="360" y="560" width="280" height="80" rx="10" fill="#4ecdc4" opacity="0.9"/>
  <text x="500" y="590" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#fff">一期能力继承</text>
  <text x="500" y="615" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#fff">Scanner / Rule Engine / Evidence</text>
  <text x="500" y="632" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#fff">Diagnosis / Report / History</text>

  <!-- MCP -->
  <rect x="670" y="560" width="280" height="80" rx="10" fill="#6c5ce7" opacity="0.9"/>
  <text x="810" y="590" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#fff">MCP 预留</text>
  <text x="810" y="615" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#fff">Client 接口</text>
  <text x="810" y="632" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#fff">注册表适配器 (Phase 3)</text>

  <!-- Kubernetes -->
  <rect x="350" y="670" width="300" height="50" rx="10" fill="#326ce5" opacity="0.9"/>
  <text x="500" y="695" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#fff">Kubernetes API Server</text>
  <text x="500" y="712" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#fff">client-go + kubectl binary</text>

  <!-- Arrows -->
  <g stroke="#666" stroke-width="2" fill="none" marker-end="url(#p2-arrow)">
    <defs>
      <marker id="p2-arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
      </marker>
    </defs>
    <!-- UI to Service -->
    <line x1="260" y1="140" x2="260" y2="170"/>
    <line x1="500" y1="140" x2="260" y2="170"/>
    <line x1="800" y1="140" x2="260" y2="170"/>
    <!-- Service to Agent -->
    <line x1="260" y1="250" x2="260" y2="280"/>
    <!-- Agent to Tools -->
    <line x1="190" y1="380" x2="190" y2="410"/>
    <!-- Agent to Approval -->
    <line x1="500" y1="380" x2="500" y2="410"/>
    <!-- Agent to Executor -->
    <line x1="810" y1="380" x2="810" y2="410"/>
    <!-- Tools to Approval -->
    <line x1="330" y1="470" x2="360" y2="470"/>
    <!-- Approval to Executor -->
    <line x1="640" y1="470" x2="670" y2="470"/>
    <!-- Executor to K8s -->
    <line x1="810" y1="530" x2="650" y2="670"/>
    <!-- Agent to LLM -->
    <line x1="190" y1="380" x2="190" y2="560"/>
  </g>

  <!-- Security Badge -->
  <rect x="50" y="670" width="280" height="50" rx="10" fill="#d63031" opacity="0.9"/>
  <text x="190" y="695" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">安全闭环</text>
  <text x="190" y="712" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#fff">审批唯一安全门 | 脱敏 | Secret 拒读</text>
</svg>