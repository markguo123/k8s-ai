<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" style="background:#1e1e1e">
  <defs>
    <style>
      .terminal-text { font-family: 'Consolas', 'Monaco', monospace; font-size: 13px; }
      .success { fill: #4ec9b0; }
      .warning { fill: #dcdcaa; }
      .error { fill: #f48771; }
      .info { fill: #569cd6; }
      .normal { fill: #d4d4d4; }
      .header { fill: #c586c0; font-weight: bold; }
    </style>
  </defs>

  <!-- Terminal Window Frame -->
  <rect x="0" y="0" width="900" height="30" fill="#2d2d30"/>
  <circle cx="15" cy="15" r="6" fill="#ff5f56"/>
  <circle cx="35" cy="15" r="6" fill="#ffbd2e"/>
  <circle cx="55" cy="15" r="6" fill="#27c93f"/>
  <text x="450" y="20" font-family="Arial" font-size="13" fill="#cccccc" text-anchor="middle">Terminal - k8s-ai scan</text>

  <!-- Terminal Content -->
  <text x="20" y="55" class="terminal-text info">$ k8s-ai scan</text>

  <text x="20" y="80" class="terminal-text header">═══════════════════════════════════════════════════════════════</text>
  <text x="20" y="100" class="terminal-text header">  Kubernetes 集群巡检报告</text>
  <text x="20" y="120" class="terminal-text header">═══════════════════════════════════════════════════════════════</text>

  <text x="20" y="145" class="terminal-text normal">集群: production-cluster</text>
  <text x="20" y="165" class="terminal-text normal">扫描时间: 2026-09-21 14:30:25</text>
  <text x="20" y="185" class="terminal-text normal">耗时: 45.2s</text>

  <text x="20" y="215" class="terminal-text header">┌─────────────────────────────────────────────────────────────┐</text>
  <text x="20" y="235" class="terminal-text header">│  健康评分: 72/100                                            │</text>
  <text x="20" y="255" class="terminal-text header">└─────────────────────────────────────────────────────────────┘</text>

  <text x="20" y="285" class="terminal-text warning">⚠ 发现 3 个 HIGH 级别问题，5 个 MEDIUM 级别问题</text>

  <text x="20" y="315" class="terminal-text header">━━━ HIGH 级别问题 ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</text>

  <text x="20" y="340" class="terminal-text error">[HIGH] Pod CrashLoopBackOff: payment-api-7f9b5c8d-2kq4p</text>
  <text x="40" y="360" class="terminal-text normal">命名空间: production</text>
  <text x="40" y="380" class="terminal-text normal">现象: 容器重启 15 次，Last State: OOMKilled</text>
  <text x="40" y="400" class="terminal-text normal">根因: 内存限制 256Mi 不足，实际使用 312Mi</text>
  <text x="40" y="420" class="terminal-text success">建议: kubectl set resources deployment/payment-api --limits=memory=512Mi</text>

  <text x="20" y="450" class="terminal-text error">[HIGH] Deployment 副本不匹配: order-service</text>
  <text x="40" y="470" class="terminal-text normal">命名空间: production</text>
  <text x="40" y="490" class="terminal-text normal">现象: 期望 3 副本，实际 2 个 Ready</text>
  <text x="40" y="510" class="terminal-text normal">根因: 节点资源不足，1 个 Pod Pending</text>
  <text x="40" y="530" class="terminal-text success">建议: 扩容节点或调整资源请求</text>

  <text x="20" y="560" class="terminal-text info">完整报告: reports/latest.md | reports/latest.json</text>
  <text x="20" y="580" class="terminal-text info">═══════════════════════════════════════════════════════════════</text>
</svg>