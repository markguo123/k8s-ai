<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" style="background:#f5f5f5">
  <defs>
    <style>
      .ui-text { font-family: 'Segoe UI', Arial, sans-serif; }
      .header-text { font-size: 14px; font-weight: bold; fill: #333; }
      .body-text { font-size: 12px; fill: #666; }
      .button { fill: #0078d4; }
      .button-text { fill: white; font-size: 12px; }
    </style>
  </defs>

  <!-- Browser Window Frame -->
  <rect x="0" y="0" width="1200" height="40" fill="#e8e8e8"/>
  <circle cx="20" cy="20" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="20" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="20" r="6" fill="#27c93f"/>
  <rect x="100" y="10" width="1000" height="20" rx="10" fill="white"/>
  <text x="600" y="25" class="ui-text" font-size="11" fill="#999" text-anchor="middle">http://localhost:8081</text>

  <!-- Main Container -->
  <rect x="0" y="40" width="1200" height="760" fill="#ffffff"/>

  <!-- Left Sidebar - Session List -->
  <rect x="0" y="40" width="280" height="760" fill="#f8f9fa"/>
  <text x="20" y="70" class="ui-text header-text">会话列表</text>
  <rect x="220" y="55" width="40" height="25" rx="4" class="button"/>
  <text x="240" y="72" class="ui-text button-text" text-anchor="middle">+ 新建</text>

  <!-- Session Items -->
  <rect x="10" y="90" width="260" height="60" rx="6" fill="#e3f2fd" stroke="#2196f3" stroke-width="2"/>
  <text x="20" y="110" class="ui-text" font-size="13" fill="#1976d2" font-weight="bold">Payment API 故障诊断</text>
  <text x="20" y="130" class="ui-text body-text">2026-09-21 14:30 | 5 条消息</text>
  <text x="20" y="145" class="ui-text body-text">为什么 payment-api 一直重启？</text>

  <rect x="10" y="160" width="260" height="60" rx="6" fill="white" stroke="#ddd" stroke-width="1"/>
  <text x="20" y="180" class="ui-text" font-size="13" fill="#333">集群健康检查</text>
  <text x="20" y="200" class="ui-text body-text">2026-09-21 10:15 | 3 条消息</text>
  <text x="20" y="215" class="ui-text body-text">检查下集群健康状态</text>

  <rect x="10" y="230" width="260" height="60" rx="6" fill="white" stroke="#ddd" stroke-width="1"/>
  <text x="20" y="250" class="ui-text" font-size="13" fill="#333">Order Service 扩容</text>
  <text x="20" y="270" class="ui-text body-text">2026-09-20 16:45 | 8 条消息</text>
  <text x="20" y="285" class="ui-text body-text">帮我扩容 order-service 到 5 个副本</text>

  <!-- Main Chat Area -->
  <rect x="280" y="40" width="920" height="760" fill="white"/>

  <!-- Chat Header -->
  <rect x="280" y="40" width="920" height="60" fill="#fafafa" stroke="#eee" stroke-width="1"/>
  <text x="300" y="70" class="ui-text" font-size="16" font-weight="bold" fill="#333">Payment API 故障诊断</text>
  <text x="300" y="90" class="ui-text" font-size="11" fill="#999">Connected to: production-cluster | Session ID: abc123</text>

  <!-- Chat Messages -->
  <!-- User Message -->
  <rect x="850" y="120" width="330" height="50" rx="8" fill="#0078d4"/>
  <text x="860" y="145" class="ui-text" font-size="13" fill="white">为什么 payment-api 一直重启？</text>

  <!-- AI Response - Thinking -->
  <rect x="300" y="180" width="700" height="40" rx="8" fill="#f0f0f0"/>
  <text x="320" y="205" class="ui-text" font-size="12" fill="#666" font-style="italic">💭 正在分析...需要检查 Pod 状态、日志和事件</text>

  <!-- Tool Calls Timeline -->
  <rect x="300" y="230" width="700" height="180" rx="8" fill="#fafafa" stroke="#e0e0e0" stroke-width="1"/>
  <text x="320" y="255" class="ui-text" font-size="13" font-weight="bold" fill="#333">🔧 工具执行过程</text>

  <!-- Tool 1 -->
  <circle cx="330" cy="280" r="6" fill="#4caf50"/>
  <text x="350" y="285" class="ui-text" font-size="12" fill="#333">get_pod</text>
  <text x="450" y="285" class="ui-text" font-size="11" fill="#666">payment-api-7f9b5c8d-2kq4p</text>
  <text x="650" y="285" class="ui-text" font-size="11" fill="#999">✓ 0.2s</text>

  <!-- Tool 2 -->
  <circle cx="330" cy="310" r="6" fill="#4caf50"/>
  <text x="350" y="315" class="ui-text" font-size="12" fill="#333">get_previous_logs</text>
  <text x="450" y="315" class="ui-text" font-size="11" fill="#666">Last 50 lines</text>
  <text x="650" y="315" class="ui-text" font-size="11" fill="#999">✓ 0.3s</text>

  <!-- Tool 3 -->
  <circle cx="330" cy="340" r="6" fill="#4caf50"/>
  <text x="350" y="345" class="ui-text" font-size="12" fill="#333">get_events</text>
  <text x="450" y="345" class="ui-text" font-size="11" fill="#666">Warning events</text>
  <text x="650" y="345" class="ui-text" font-size="11" fill="#999">✓ 0.1s</text>

  <!-- Tool 4 -->
  <circle cx="330" cy="370" r="6" fill="#4caf50"/>
  <text x="350" y="375" class="ui-text" font-size="12" fill="#333">get_deployment</text>
  <text x="450" y="375" class="ui-text" font-size="11" fill="#666">payment-api deployment</text>
  <text x="650" y="375" class="ui-text" font-size="11" fill="#999">✓ 0.2s</text>

  <text x="320" y="400" class="ui-text" font-size="11" fill="#999">总耗时: 0.8s | 4 个工具调用</text>

  <!-- AI Final Response -->
  <rect x="300" y="420" width="700" height="280" rx="8" fill="#e8f5e9" stroke="#4caf50" stroke-width="1"/>
  <text x="320" y="445" class="ui-text" font-size="14" font-weight="bold" fill="#2e7d32">🤖 诊断结果</text>

  <text x="320" y="470" class="ui-text" font-size="12" fill="#333" font-weight="bold">现象:</text>
  <text x="320" y="490" class="ui-text" font-size="12" fill="#555">payment-api Pod 处于 CrashLoopBackOff 状态，已重启 15 次</text>

  <text x="320" y="515" class="ui-text" font-size="12" fill="#333" font-weight="bold">根因:</text>
  <text x="320" y="535" class="ui-text" font-size="12" fill="#555">应用代码存在空指针引用（panic: runtime error: invalid memory address）</text>

  <text x="320" y="560" class="ui-text" font-size="12" fill="#333" font-weight="bold">影响:</text>
  <text x="320" y="580" class="ui-text" font-size="12" fill="#555">服务不可用，用户无法完成支付</text>

  <text x="320" y="605" class="ui-text" font-size="12" fill="#333" font-weight="bold">建议修复步骤:</text>
  <text x="320" y="625" class="ui-text" font-size="12" fill="#555">1. 检查代码中 payment-api 的空指针处理逻辑</text>
  <text x="320" y="645" class="ui-text" font-size="12" fill="#555">2. 修复后重新部署: kubectl rollout restart deployment/payment-api</text>
  <text x="320" y="665" class="ui-text" font-size="12" fill="#555">3. 验证: kubectl get pods -l app=payment-api</text>

  <text x="320" y="690" class="ui-text" font-size="12" fill="#1976d2" font-weight="bold">需要我帮你执行修复吗？</text>

  <!-- Input Area -->
  <rect x="280" y="740" width="920" height="60" fill="#fafafa" stroke="#eee" stroke-width="1"/>
  <rect x="300" y="755" width="800" height="30" rx="15" fill="white" stroke="#ddd" stroke-width="1"/>
  <text x="320" y="775" class="ui-text" font-size="12" fill="#999">输入消息...</text>
  <rect x="1110" y="755" width="70" height="30" rx="15" class="button"/>
  <text x="1145" y="775" class="ui-text button-text" text-anchor="middle">发送</text>
</svg>