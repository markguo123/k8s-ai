<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>k8s-ai · Kubernetes AI 诊断助手</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════
   Design System — 运维诊断流程可视化
   ═══════════════════════════════════════════════════════ */
:root {
  /* 色彩 */
  --bg: #f5f6f8;
  --panel: #ffffff;
  --sidebar: #1a1f2e;
  --sidebar-hover: rgba(255,255,255,.06);
  --sidebar-active: rgba(99,102,241,.22);
  --sidebar-text: #c9cdd4;
  --sidebar-muted: #6b7280;
  --text: #111827;
  --text-secondary: #374151;
  --muted: #6b7280;
  --accent: #4f46e5;
  --accent-light: #eef2ff;
  --border: #e5e7eb;
  --border-light: #f3f4f6;
  --code-bg: #f8f9fb;
  --ok: #059669;
  --ok-light: #ecfdf5;
  --warn: #d97706;
  --warn-light: #fffbeb;
  --danger: #dc2626;
  --danger-light: #fef2f2;
  /* 字体 */
  --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', 'Cascadia Code', Consolas, monospace;
  /* 间距 */
  --space-xs: 4px;
  --space-sm: 8px;
  --space-md: 16px;
  --space-lg: 24px;
  --space-xl: 32px;
  /* 圆角 */
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 14px;
  /* 阴影 */
  --shadow-sm: 0 1px 2px rgba(0,0,0,.04);
  --shadow-md: 0 4px 12px rgba(0,0,0,.06);
  --shadow-lg: 0 8px 24px rgba(0,0,0,.08);
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1117;
    --panel: #1a1d27;
    --sidebar: #12141c;
    --sidebar-hover: rgba(255,255,255,.04);
    --sidebar-active: rgba(99,102,241,.18);
    --text: #e5e7eb;
    --text-secondary: #d1d5db;
    --muted: #9ca3af;
    --accent: #818cf8;
    --accent-light: rgba(129,140,248,.1);
    --border: #2a2d3a;
    --border-light: #1f2230;
    --code-bg: #15171f;
    --ok-light: rgba(5,150,105,.1);
    --warn-light: rgba(217,119,6,.1);
    --danger-light: rgba(220,38,38,.1);
    --shadow-sm: 0 1px 2px rgba(0,0,0,.2);
    --shadow-md: 0 4px 12px rgba(0,0,0,.3);
    --shadow-lg: 0 8px 24px rgba(0,0,0,.4);
  }
}

/* ═══════════════════════════════════════════════════════
   Reset & Base
   ═══════════════════════════════════════════════════════ */
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-sans);
  font-size: 15px;
  line-height: 1.7;
  display: flex;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* ═══════════════════════════════════════════════════════
   Sidebar
   ═══════════════════════════════════════════════════════ */
#sidebar {
  width: 260px;
  background: var(--sidebar);
  color: var(--sidebar-text);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  z-index: 100;
}
#sidebar header {
  padding: 20px 18px 16px;
  border-bottom: 1px solid rgba(255,255,255,.06);
}
#sidebar h1 {
  font-size: 18px;
  font-weight: 700;
  letter-spacing: -.3px;
  color: #fff;
}
#sidebar .sub {
  color: var(--sidebar-muted);
  font-size: 12px;
  margin-top: 4px;
  font-weight: 500;
}
#sessionList {
  flex: 1;
  overflow-y: auto;
  padding: 12px 10px;
}
.session-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 12px;
  border-radius: var(--radius-md);
  cursor: pointer;
  margin-bottom: 2px;
  transition: background .15s;
}
.session-item:hover { background: var(--sidebar-hover); }
.session-item.active { background: var(--sidebar-active); }
.session-item .name-row {
  display: flex;
  align-items: center;
  gap: 6px;
  flex: 1;
  min-width: 0;
}
.session-item .name {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 13px;
  font-weight: 500;
}
.session-item .del, .session-item .ren {
  color: var(--sidebar-muted);
  border: none;
  background: none;
  cursor: pointer;
  font-size: 12px;
  padding: 2px 4px;
  border-radius: 4px;
  opacity: 0;
  transition: opacity .15s, color .15s;
}
.session-item:hover .del, .session-item:hover .ren { opacity: 1; }
.session-item .del:hover { color: #f87171; }
.session-item .ren:hover { color: #60a5fa; }
.session-item .time {
  color: var(--sidebar-muted);
  font-size: 11px;
  margin-top: 2px;
}
#newSession {
  margin: 12px;
  padding: 11px;
  border: none;
  border-radius: var(--radius-md);
  background: var(--accent);
  color: #fff;
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
  transition: opacity .15s;
}
#newSession:hover { opacity: .9; }

/* ═══════════════════════════════════════════════════════
   Main Layout
   ═══════════════════════════════════════════════════════ */
#main {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
  position: relative;
}
#chat {
  flex: 1;
  overflow-y: auto;
  padding: var(--space-lg) var(--space-lg);
  scroll-behavior: smooth;
}
.inner {
  max-width: 880px;
  margin: 0 auto;
}

/* ═══════════════════════════════════════════════════════
   Messages
   ═══════════════════════════════════════════════════════ */
.msg {
  margin-bottom: var(--space-lg);
  animation: slideUp .25s ease-out;
}
@keyframes slideUp {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}
.msg .who {
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 6px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .5px;
}
.msg.user { text-align: right; }
.msg.user .content {
  display: inline-block;
  text-align: left;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 12px 16px;
  max-width: 85%;
  box-shadow: var(--shadow-sm);
}
.msg.agent .content { width: 100%; }
.msg.error .content {
  background: var(--danger-light);
  border: 1px solid var(--danger);
  border-radius: var(--radius-md);
  padding: 12px 16px;
  color: var(--danger);
  font-size: 14px;
}
.msg.progress-message .who { color: var(--muted); font-size: 11px; }
.msg.progress-message .content {
  color: var(--muted);
  font-size: 13px;
  opacity: .7;
}

/* ═══════════════════════════════════════════════════════
   诊断报告卡片 — 最终 answer 视觉强调
   ═══════════════════════════════════════════════════════ */
.msg.report {
  margin-top: var(--space-xl);
  margin-bottom: var(--space-xl);
}
.msg.report .content {
  background: var(--panel);
  border: 1px solid var(--border);
  border-left: 4px solid var(--accent);
  border-radius: var(--radius-lg);
  padding: var(--space-lg) var(--space-xl);
  box-shadow: var(--shadow-md);
  font-size: 15.5px;
  line-height: 1.8;
}
.msg.report .who {
  color: var(--accent);
  font-size: 11px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.msg.report .who::before {
  content: "📋";
  font-size: 14px;
}

/* ═══════════════════════════════════════════════════════
   分析过程时间线
   ═══════════════════════════════════════════════════════ */
.phase-progress {
  margin: var(--space-md) 0;
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  background: var(--panel);
  overflow: hidden;
}
.phase-progress summary {
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
  list-style: none;
  padding: 12px 16px;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-secondary);
  transition: background .15s;
}
.phase-progress summary:hover { background: var(--border-light); }
.phase-progress summary::-webkit-details-marker { display: none; }
.phase-progress summary::after {
  content: "⌄";
  margin-left: auto;
  color: var(--muted);
  transition: transform .2s;
  font-size: 14px;
}
.phase-progress[open] summary::after { transform: rotate(180deg); }
.phase-progress .mark {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--accent);
  flex-shrink: 0;
}
.phase-progress .phase-count {
  color: var(--muted);
  font-weight: 400;
  font-size: 12px;
  margin-left: 4px;
}
.phase-progress .progress-list {
  border-top: 1px solid var(--border);
  padding: 8px 16px 12px;
}
.phase-progress .progress-item {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 6px 0;
  font-size: 13px;
  color: var(--text-secondary);
  line-height: 1.5;
}
.phase-progress .progress-item::before {
  content: "✓";
  color: var(--ok);
  font-weight: 700;
  font-size: 11px;
  margin-top: 3px;
  flex-shrink: 0;
}
.phase-progress .progress-item.active::before {
  content: "●";
  color: var(--accent);
  animation: pulse 1.2s ease-in-out infinite;
}

/* ═══════════════════════════════════════════════════════
   工具卡片
   ═══════════════════════════════════════════════════════ */
.tool-summary-bar {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 8px 14px;
  margin: 8px 0;
  background: var(--code-bg);
  border-radius: var(--radius-sm);
  font-size: 12px;
  color: var(--muted);
  font-weight: 500;
}
.tool-summary-bar .count { color: var(--text); font-weight: 600; }
.tool-summary-bar .sep { color: var(--border); }

.tool-card {
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  background: var(--panel);
  margin: 8px 0;
  overflow: hidden;
  transition: border-color .2s, box-shadow .2s;
}
.tool-card.executing {
  border-color: var(--accent);
  box-shadow: 0 0 0 1px var(--accent-light);
}
.tool-card.completed { border-color: var(--ok); }
.tool-card.error { border-color: var(--danger); }
.tool-head {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  flex-wrap: wrap;
}
.tool-status {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 12px;
  font-weight: 600;
  min-width: 80px;
}
.tool-status .dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  flex-shrink: 0;
}
.tool-card.executing .tool-status { color: var(--accent); }
.tool-card.executing .dot { background: var(--accent); animation: pulse 1.2s ease-in-out infinite; }
.tool-card.completed .tool-status { color: var(--ok); }
.tool-card.completed .dot { background: var(--ok); }
.tool-card.error .tool-status { color: var(--danger); }
.tool-card.error .dot { background: var(--danger); }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }

.tool-command {
  flex: 1;
  min-width: 180px;
  font-family: var(--font-mono);
  font-size: 12.5px;
  background: var(--code-bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 6px 10px;
  overflow-x: auto;
  white-space: nowrap;
  color: var(--text-secondary);
}
.tool-time {
  color: var(--muted);
  font-size: 11px;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
.tool-toggle {
  display: flex;
  align-items: center;
  gap: 4px;
  border: none;
  background: none;
  color: var(--muted);
  cursor: pointer;
  font-size: 12px;
  white-space: nowrap;
  padding: 4px 8px;
  border-radius: var(--radius-sm);
  transition: color .15s, background .15s;
}
.tool-toggle:hover { color: var(--text); background: var(--border-light); }
.tool-toggle svg { width: 12px; height: 12px; transition: transform .2s; }
.tool-toggle.open svg { transform: rotate(180deg); }
.tool-copy {
  border: 1px solid var(--border);
  background: none;
  color: var(--muted);
  cursor: pointer;
  font-size: 11px;
  padding: 3px 10px;
  border-radius: var(--radius-sm);
  white-space: nowrap;
  transition: color .15s, border-color .15s;
}
.tool-copy:hover { color: var(--text); border-color: var(--muted); }
.tool-output {
  display: none;
  border-top: 1px solid var(--border);
  margin: 0;
  padding: 14px 16px;
  font-family: var(--font-mono);
  font-size: 12px;
  line-height: 1.6;
  white-space: pre-wrap;
  word-break: break-word;
  max-height: 400px;
  overflow: auto;
  background: var(--code-bg);
  color: var(--text-secondary);
}
.tool-card.open .tool-output { display: block; }

/* ═══════════════════════════════════════════════════════
   审批卡片
   ═══════════════════════════════════════════════════════ */
.approval {
  border: 1px solid var(--accent);
  border-radius: var(--radius-lg);
  background: var(--panel);
  padding: var(--space-lg);
  margin: var(--space-md) 0;
  box-shadow: var(--shadow-md);
}
.approval .prompt {
  font-size: 14px;
  white-space: pre-wrap;
  margin-bottom: 16px;
  line-height: 1.7;
  color: var(--text-secondary);
}
.approval .btns { display: flex; gap: 10px; flex-wrap: wrap; }
.approval button {
  padding: 10px 20px;
  border: none;
  border-radius: var(--radius-md);
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
  transition: opacity .15s, transform .1s;
}
.approval button:active { transform: scale(.97); }
.approval .yes { background: var(--ok); color: #fff; }
.approval .always { background: var(--accent); color: #fff; }
.approval .no { background: var(--code-bg); color: var(--text); border: 1px solid var(--border); }

/* ═══════════════════════════════════════════════════════
   输入区域
   ═══════════════════════════════════════════════════════ */
#inputBar {
  border-top: 1px solid var(--border);
  padding: 16px var(--space-lg) 20px;
  background: var(--panel);
}
#inputRow {
  max-width: 880px;
  margin: 0 auto;
  display: flex;
  gap: 12px;
  align-items: flex-end;
}
#input {
  flex: 1;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  color: var(--text);
  padding: 12px 16px;
  font-size: 14px;
  font-family: var(--font-sans);
  resize: none;
  height: 48px;
  max-height: 180px;
  line-height: 1.5;
  transition: border-color .15s, box-shadow .15s;
}
#input:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-light);
}
#input:disabled { opacity: .5; cursor: not-allowed; }
#input:disabled:focus { outline: none; box-shadow: none; }
#send {
  width: 80px;
  height: 48px;
  border: none;
  border-radius: var(--radius-md);
  background: var(--accent);
  color: #fff;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: opacity .15s;
}
#send:hover { opacity: .9; }
#send:disabled { opacity: .4; cursor: not-allowed; }
.hint {
  max-width: 880px;
  margin: 8px auto 0;
  text-align: center;
  color: var(--muted);
  font-size: 12px;
}
#status {
  display: none;
  max-width: 880px;
  margin: 8px auto 0;
  text-align: center;
  color: var(--accent);
  font-size: 12px;
  font-weight: 600;
}
#status.on { display: flex; align-items: center; justify-content: center; gap: 8px; animation: pulse 1.4s ease-in-out infinite; }

/* ═══════════════════════════════════════════════════════
   Markdown 渲染
   ═══════════════════════════════════════════════════════ */
.markdown h1, .markdown h2, .markdown h3 {
  margin: 20px 0 10px;
  line-height: 1.3;
  font-weight: 700;
  color: var(--text);
}
.markdown h1 { font-size: 22px; }
.markdown h2 { font-size: 18px; }
.markdown h3 { font-size: 16px; }
.markdown p { margin: 10px 0; }
.markdown ul, .markdown ol { padding-left: 24px; margin: 10px 0; }
.markdown li { margin: 4px 0; }
.markdown a { color: var(--accent); text-decoration: none; }
.markdown a:hover { text-decoration: underline; }
.markdown table {
  border-collapse: collapse;
  margin: 14px 0;
  width: 100%;
  font-size: 13px;
  border-radius: var(--radius-sm);
  overflow: hidden;
}
.markdown th, .markdown td {
  border: 1px solid var(--border);
  padding: 8px 12px;
  text-align: left;
}
.markdown th { background: var(--code-bg); font-weight: 600; }
.markdown blockquote {
  border-left: 3px solid var(--accent);
  padding-left: 14px;
  color: var(--muted);
  margin: 12px 0;
  font-style: italic;
}
pre {
  background: var(--code-bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 14px 16px;
  overflow-x: auto;
  font-size: 12.5px;
  line-height: 1.6;
  margin: 12px 0;
}
code {
  background: var(--code-bg);
  padding: 2px 6px;
  border-radius: 4px;
  font-family: var(--font-mono);
  font-size: 13px;
  color: var(--accent);
}
pre code { background: none; padding: 0; color: inherit; }

/* ═══════════════════════════════════════════════════════
   欢迎页
   ═══════════════════════════════════════════════════════ */
.welcome {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  text-align: center;
  gap: 24px;
  padding: 40px 20px;
  animation: fadeIn .4s ease-out;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.welcome .logo {
  width: 80px;
  height: 80px;
  border-radius: 20px;
  background: linear-gradient(135deg, var(--accent), #7c3aed);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 40px;
  box-shadow: var(--shadow-lg);
}
.welcome h2 {
  font-size: 28px;
  font-weight: 700;
  letter-spacing: -.5px;
}
.welcome .tagline {
  color: var(--muted);
  font-size: 15px;
  max-width: 440px;
  line-height: 1.6;
}
.welcome-cards {
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
  justify-content: center;
  margin-top: 16px;
  max-width: 740px;
}
.welcome-card {
  width: 210px;
  padding: 22px 18px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  background: var(--panel);
  cursor: pointer;
  transition: transform .15s, border-color .15s, box-shadow .15s;
  text-align: left;
}
.welcome-card:hover {
  transform: translateY(-3px);
  border-color: var(--accent);
  box-shadow: var(--shadow-md);
}
.welcome-card .icon { font-size: 28px; margin-bottom: 12px; }
.welcome-card .title { font-size: 15px; font-weight: 600; margin-bottom: 6px; }
.welcome-card .desc { font-size: 12px; color: var(--muted); line-height: 1.5; }

/* ═══════════════════════════════════════════════════════
   Typing Indicator — 细分等待状态
   ═══════════════════════════════════════════════════════ */
.typing {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 16px;
  margin-bottom: 16px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  width: fit-content;
}
.typing .dots { display: flex; gap: 4px; }
.typing .dots span {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--accent);
  animation: typingDot 1.3s ease-in-out infinite;
}
.typing .dots span:nth-child(2) { animation-delay: .2s; }
.typing .dots span:nth-child(3) { animation-delay: .4s; }
@keyframes typingDot {
  0%,60%,100% { opacity: .3; transform: translateY(0); }
  30% { opacity: 1; transform: translateY(-3px); }
}
.typing .label { font-size: 13px; color: var(--muted); font-weight: 500; }
.typing.approval-wait { border-color: var(--warn); background: var(--warn-light); }
.typing.approval-wait .dots span { background: var(--warn); }
.typing.approval-wait .label { color: var(--warn); }

/* ═══════════════════════════════════════════════════════
   移动端侧栏抽屉
   ═══════════════════════════════════════════════════════ */
#sidebarToggle {
  display: none;
  position: fixed;
  top: 12px;
  left: 12px;
  z-index: 200;
  width: 40px;
  height: 40px;
  border: none;
  border-radius: var(--radius-md);
  background: var(--panel);
  box-shadow: var(--shadow-md);
  cursor: pointer;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  color: var(--text);
}
#sidebarOverlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.4);
  z-index: 90;
}

@media (max-width: 960px) {
  #sidebarToggle { display: flex; }
  #sidebar {
    position: fixed;
    left: -280px;
    top: 0;
    bottom: 0;
    transition: left .25s ease;
    box-shadow: var(--shadow-lg);
  }
  #sidebar.open { left: 0; }
  #sidebarOverlay.open { display: block; }
  #chat { padding: 16px; }
  .inner { max-width: 100%; }
  .tool-command { min-width: 120px; word-break: break-all; white-space: normal; }
  .welcome-cards { flex-direction: column; align-items: center; }
  .welcome-card { width: 100%; max-width: 300px; }
}

/* ═══════════════════════════════════════════════════════
   Spinner
   ═══════════════════════════════════════════════════════ */
.send-spinner {
  display: inline-block;
  width: 18px;
  height: 18px;
  border: 2px solid rgba(255,255,255,.3);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin .6s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ═══════════════════════════════════════════════════════
   Reduced Motion
   ═══════════════════════════════════════════════════════ */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}
</style>
</head>
<body>

<button id="sidebarToggle" aria-label="切换侧栏">☰</button>
<div id="sidebarOverlay"></div>

<aside id="sidebar">
  <header>
    <h1>k8s-ai</h1>
    <div class="sub">Kubernetes 智能诊断助手</div>
  </header>
  <div id="sessionList"></div>
  <button id="newSession">＋ 新会话</button>
</aside>

<main id="main">
  <div id="chat"><div class="inner"></div></div>
  <div id="inputBar">
    <div id="inputRow">
      <textarea id="input" placeholder="例如：检查下集群健康状态，或 为什么 payment-api 一直重启？" rows="1"></textarea>
      <button id="send">发送</button>
      <span id="sendSpinner" class="send-spinner" style="display:none;"></span>
    </div>
    <div id="status"><span class="status-dot"></span><span class="status-text">正在执行…</span></div>
    <div class="hint">写操作会弹出确认卡片 · 点击工具卡片查看执行过程与输出 · Enter 发送 / Shift+Enter 换行</div>
  </div>
</main>

<script>
"use strict";
let currentSession = null;
let eventSource = null;
let chatBusy = false;
let pendingTools = [];
let toolCallCount = 0; // 工具调用计数（用于摘要栏）

const $ = (id) => document.getElementById(id);
const inner = () => document.querySelector("#chat .inner");

/* ═══════════════════════════════════════════════════════
   API & Session Management
   ═══════════════════════════════════════════════════════ */
async function api(path, options) {
  const resp = await fetch(path, Object.assign({ headers: { "Content-Type": "application/json" } }, options));
  const data = await resp.json().catch(() => ({}));
  if (!resp.ok) throw new Error(data.error || ("HTTP " + resp.status));
  return data;
}

async function loadSessions() {
  const list = await api("/api/sessions");
  const box = $("sessionList");
  box.innerHTML = "";
  list.forEach((s) => {
    const item = document.createElement("div");
    item.className = "session-item" + (s.id === currentSession ? " active" : "");
    const nameRow = document.createElement("div");
    nameRow.className = "name-row";
    const name = document.createElement("span");
    name.className = "name";
    name.textContent = s.name || s.id;
    name.title = s.id;
    const del = document.createElement("button");
    del.className = "del";
    del.textContent = "✕";
    del.onclick = async (e) => {
      e.stopPropagation();
      if (!confirm("确定删除会话「" + (s.name || s.id) + "」？")) return;
      if (s.id === currentSession) closeStream();
      await api("/api/sessions/" + encodeURIComponent(s.id), { method: "DELETE" });
      loadSessions();
    };
    const ren = document.createElement("button");
    ren.className = "ren";
    ren.textContent = "✎";
    ren.title = "重命名";
    ren.onclick = async (e) => {
      e.stopPropagation();
      const newName = window.prompt("重命名会话", s.name || s.id);
      if (newName === null) return;
      const trimmed = newName.trim();
      if (!trimmed || trimmed === (s.name || s.id)) return;
      try {
        await api("/api/sessions/" + encodeURIComponent(s.id) + "/rename", {
          method: "POST", body: JSON.stringify({ name: trimmed }),
        });
        loadSessions();
      } catch (err) {
        addMsg("error", "重命名失败: " + err.message);
      }
    };
    item.onclick = () => openSession(s.id);
    nameRow.appendChild(name);
    nameRow.appendChild(ren);
    nameRow.appendChild(del);
    item.appendChild(nameRow);
    if (s.lastModified) {
      const time = document.createElement("div");
      time.className = "time";
      time.textContent = formatTime(s.lastModified);
      item.appendChild(time);
    }
    box.appendChild(item);
  });
  if (!currentSession) {
    if (list.length > 0) {
      openSession(list[0].id);
    } else {
      try {
        const d = await api("/api/sessions", { method: "POST", body: JSON.stringify({}) });
        openSession(d.id);
      } catch (e) {
        addMsg("error", "创建会话失败: " + e.message);
      }
    }
  }
}

function closeStream() {
  if (eventSource) { eventSource.close(); eventSource = null; }
}

function openSession(id) {
  closeStream();
  currentSession = id;
  pendingTools = [];
  toolCallCount = 0;
  inner().innerHTML = "";
  hideTyping();
  setBusy(false);
  showWelcome();
  loadSessions();
  closeSidebar();
  if (!id) return;
  eventSource = new EventSource("/api/sessions/" + encodeURIComponent(id) + "/stream");
  eventSource.onmessage = (ev) => handleEvent(JSON.parse(ev.data));
  eventSource.onerror = () => { chatBusy = false; setBusy(false); };
}

/* ═══════════════════════════════════════════════════════
   Event Handling
   ═══════════════════════════════════════════════════════ */
function handleEvent(ev) {
  switch (ev.type) {
    case "history":
      setStatus(false);
      inner().innerHTML = "";
      pendingTools = [];
      toolCallCount = 0;
      hideTyping();
      if (!ev.messages || ev.messages.length === 0) { showWelcome(); setBusy(false); break; }
      hideWelcome();
      (ev.messages || []).forEach((m) => {
        if (m.role === "user") addMsg("user", m.content);
        else if (m.role === "tool") addToolFromHistory(m);
        else addReport(m.content); // 历史 assistant 消息都是最终回答
      });
      scroll();
      chatBusy = false;
      setBusy(false);
      break;
    case "delta":
    case "answer-delta":
      hideWelcome();
      hideTyping();
      if (ev.text) appendDelta(ev.text);
      break;
    case "progress":
      hideWelcome();
      hideTyping();
      if (ev.text) showProgress(ev.text);
      break;
    case "text":
      hideWelcome();
      hideTyping();
      if (ev.text) addMsg("agent", ev.text);
      break;
    case "answer":
      hideTyping();
      if (ev.text) finishStreamedAnswer(ev.text);
      closeProgress();
      chatBusy = false;
      setBusy(false);
      setStatus(false);
      break;
    case "tool-call":
      hideWelcome();
      hideTyping();
      closeProgress();
      promoteStreamToProgress();
      toolCallCount++;
      updateToolSummary();
      if (ev.tool) addToolCard(ev.tool);
      break;
    case "tool-response":
      if (ev.tool) fillToolOutput(ev.tool);
      showTyping("AI 正在分析…");
      break;
    case "error":
      hideTyping();
      if (ev.text) addErrorCard(ev.text);
      chatBusy = false;
      setBusy(false);
      setStatus(false);
      break;
    case "choice-request":
      hideTyping();
      if (ev.choice) showApproval(ev.choice);
      setStatus(false);
      showTyping("等待审批…", true);
      break;
  }
}

/* ═══════════════════════════════════════════════════════
   Status & Typing
   ═══════════════════════════════════════════════════════ */
function setStatus(on) {
  const el = $("status");
  el.classList.toggle("on", on);
}

function showTyping(label, isApproval) {
  hideTyping();
  const t = document.createElement("div");
  t.className = "typing" + (isApproval ? " approval-wait" : "");
  t.innerHTML = '<div class="dots"><span></span><span></span><span></span></div><span class="label">' + escapeHtml(label || "AI 正在分析…") + '</span>';
  inner().appendChild(t);
  scroll();
}

function hideTyping() {
  const t = inner().querySelector(".typing");
  if (t) t.remove();
}

/* ═══════════════════════════════════════════════════════
   Messages
   ═══════════════════════════════════════════════════════ */
function addMsg(kind, text) {
  const msg = document.createElement("div");
  msg.className = "msg " + kind;
  const who = document.createElement("div");
  who.className = "who";
  who.textContent = kind === "user" ? "你" : kind === "error" ? "错误" : "AI 助手";
  const content = document.createElement("div");
  content.className = "content";
  if (kind === "agent") content.innerHTML = markdown(escapeHtml(text));
  else content.textContent = text;
  msg.appendChild(who);
  msg.appendChild(content);
  inner().appendChild(msg);
  scroll();
}

// 诊断报告卡片 — 最终 answer 视觉强调
function addReport(text) {
  const msg = document.createElement("div");
  msg.className = "msg report";
  const who = document.createElement("div");
  who.className = "who";
  who.textContent = "诊断报告";
  const content = document.createElement("div");
  content.className = "content";
  content.innerHTML = markdown(escapeHtml(text));
  msg.appendChild(who);
  msg.appendChild(content);
  inner().appendChild(msg);
  scroll();
}

// 错误卡片 — 可折叠
function addErrorCard(text) {
  const msg = document.createElement("div");
  msg.className = "msg error";
  const who = document.createElement("div");
  who.className = "who";
  who.textContent = "错误";
  const content = document.createElement("div");
  content.className = "content";
  // 长错误截断显示
  const isLong = text.length > 200;
  if (isLong) {
    content.innerHTML = '<div class="error-summary">' + escapeHtml(text.slice(0, 200)) + '…</div>' +
      '<details class="error-details"><summary>查看详情</summary><pre>' + escapeHtml(text) + '</pre></details>';
  } else {
    content.textContent = text;
  }
  msg.appendChild(who);
  msg.appendChild(content);
  inner().appendChild(msg);
  scroll();
}

function finishStreamedAnswer(text) {
  // 只找正在流式输出的 agent 消息
  const msgs = inner().querySelectorAll('.msg.agent[data-streaming="true"]');
  const last = msgs.length > 0 ? msgs[msgs.length - 1] : null;
  if (!last) {
    addReport(text);
    return;
  }
  if (last._renderTimer) clearTimeout(last._renderTimer);
  last.dataset.rawText = text;
  last.dataset.streaming = "false";
  // 转换为报告卡片样式
  last.classList.remove("agent");
  last.classList.add("report");
  const who = last.querySelector(".who");
  if (who) who.textContent = "诊断报告";
  const content = last.querySelector(".content");
  if (content) content.innerHTML = markdown(escapeHtml(text));
  scroll();
}

function promoteStreamToProgress() {
  const msgs = inner().querySelectorAll('.msg.agent[data-streaming="true"]');
  const last = msgs.length > 0 ? msgs[msgs.length - 1] : null;
  if (!last) return;
  if (last._renderTimer) clearTimeout(last._renderTimer);
  last.dataset.streaming = "false";
  last.classList.add("progress-message");
  const who = last.querySelector(".who");
  if (who) who.textContent = "中间分析";
}

/* ═══════════════════════════════════════════════════════
   分析过程时间线
   ═══════════════════════════════════════════════════════ */
function showProgress(text) {
  let panel = inner().querySelector(".phase-progress");
  if (!panel) {
    panel = document.createElement("details");
    panel.className = "phase-progress";
    panel.open = true;
    panel.innerHTML = '<summary><span class="mark"></span><span class="phase-label">分析过程</span><span class="phase-count">(0)</span></summary><div class="progress-list"></div>';
    inner().appendChild(panel);
  }
  const label = panel.querySelector(".phase-label");
  if (label) label.textContent = text;
  const list = panel.querySelector(".progress-list");
  const count = panel.querySelector(".phase-count");
  // 标记前一个为完成
  const prev = list.querySelector(".progress-item.active");
  if (prev) prev.classList.remove("active");
  if (list && (!list.lastElementChild || list.lastElementChild.textContent !== text)) {
    const item = document.createElement("div");
    item.className = "progress-item active";
    item.textContent = text;
    list.appendChild(item);
    if (count) count.textContent = "(" + list.children.length + ")";
  }
  scroll();
}

function closeProgress() {
  const panel = inner().querySelector(".phase-progress");
  if (panel) {
    panel.open = false;
    // 标记最后一项为完成
    const last = panel.querySelector(".progress-item.active");
    if (last) last.classList.remove("active");
  }
}

/* ═══════════════════════════════════════════════════════
   流式增量渲染（修复串扰 bug）
   ═══════════════════════════════════════════════════════ */
function appendDelta(text) {
  // 只找正在流式输出的 agent 消息，避免追加到已降级的进度消息
  const msgs = inner().querySelectorAll('.msg.agent[data-streaming="true"]');
  let last = msgs.length > 0 ? msgs[msgs.length - 1] : null;
  if (!last) {
    // 新建流式消息
    const msg = document.createElement("div");
    msg.className = "msg agent";
    msg.dataset.streaming = "true";
    const who = document.createElement("div");
    who.className = "who";
    who.textContent = "AI 助手";
    const content = document.createElement("div");
    content.className = "content";
    msg.appendChild(who);
    msg.appendChild(content);
    inner().appendChild(msg);
    last = msg;
  }
  let raw = last.dataset.rawText || "";
  raw += text;
  last.dataset.rawText = raw;
  // 防抖渲染：50ms 合并，避免高频 markdown 解析
  if (last._renderTimer) clearTimeout(last._renderTimer);
  last._renderTimer = setTimeout(() => {
    const c = last.querySelector(".content");
    if (c) c.innerHTML = markdown(escapeHtml(raw));
    scroll();
    last._renderTimer = null;
  }, 50);
}

/* ═══════════════════════════════════════════════════════
   工具卡片（统一工厂 + 摘要栏）
   ═══════════════════════════════════════════════════════ */
function updateToolSummary() {
  let bar = inner().querySelector(".tool-summary-bar");
  if (!bar) {
    bar = document.createElement("div");
    bar.className = "tool-summary-bar";
    // 插入到第一个 tool-card 之前
    const first = inner().querySelector(".tool-card");
    if (first) inner().insertBefore(bar, first);
    else inner().appendChild(bar);
  }
  const completed = inner().querySelectorAll(".tool-card.completed, .tool-card.error").length;
  const executing = inner().querySelectorAll(".tool-card.executing").length;
  bar.innerHTML = '<span>工具调用</span><span class="count">' + toolCallCount + '</span>' +
    '<span class="sep">·</span><span class="count">' + completed + '</span><span> 已完成</span>' +
    (executing > 0 ? '<span class="sep">·</span><span class="count" style="color:var(--accent)">' + executing + '</span><span> 执行中</span>' : '');
}

function buildToolCard(tool, isHistory) {
  const card = document.createElement("div");
  card.className = "tool-card " + (isHistory ? "completed" : "executing");
  card.dataset.name = tool.name || "";
  if (!isHistory) card.dataset.started = Date.now();
  card.dataset.toolId = "tool-" + Date.now() + "-" + Math.random().toString(36).slice(2, 6);

  const head = document.createElement("div");
  head.className = "tool-head";

  const status = document.createElement("div");
  status.className = "tool-status";
  status.innerHTML = '<span class="dot"></span><span>' + (isHistory ? "已完成" : "执行中") + '</span>';

  const cmd = document.createElement("div");
  cmd.className = "tool-command";
  cmd.textContent = isHistory ? (tool.name || "tool") : commandText(tool);

  const time = document.createElement("span");
  time.className = "tool-time";

  const copy = document.createElement("button");
  copy.className = "tool-copy";
  copy.textContent = "复制";
  copy.onclick = async () => {
    try {
      await navigator.clipboard.writeText(cmd.textContent);
      copy.textContent = "已复制";
      setTimeout(() => { copy.textContent = "复制"; }, 1200);
    } catch (e) { /* 剪贴板不可用时静默 */ }
  };

  const toggle = document.createElement("button");
  toggle.className = "tool-toggle";
  toggle.innerHTML = '<span>展开</span><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>';
  toggle.onclick = () => {
    card.classList.toggle("open");
    toggle.classList.toggle("open");
    toggle.querySelector("span").textContent = card.classList.contains("open") ? "收起" : "展开";
    scroll();
  };

  head.append(status, cmd, time, copy, toggle);
  const output = document.createElement("pre");
  output.className = "tool-output";
  if (isHistory) output.textContent = tool.content || "";
  card.appendChild(head);
  card.appendChild(output);
  return card;
}

function addToolCard(tool) {
  const card = buildToolCard(tool, false);
  inner().appendChild(card);
  pendingTools.push(card);
  scroll();
}

function fillToolOutput(tool) {
  // 修复错配：按 toolId 或 按名称+未filled 匹配
  const idx = pendingTools.findIndex((c) => !c.dataset.filled && (!tool.name || c.dataset.name === tool.name));
  if (idx < 0) return;
  const card = pendingTools[idx];
  card.dataset.filled = "1";
  card.classList.remove("executing");
  const text = tool.result || "";
  const isErr = /错误|error|not found|denied|invalid/i.test(text.slice(0, 200));
  card.classList.add(isErr ? "error" : "completed");
  const status = card.querySelector(".tool-status");
  status.innerHTML = isErr ? '<span class="dot"></span><span>执行出错</span>' : '<span class="dot"></span><span>已完成</span>';
  const time = card.querySelector(".tool-time");
  const ms = Date.now() - Number(card.dataset.started || Date.now());
  time.textContent = ms >= 0 ? (ms / 1000).toFixed(1) + "s" : "";
  const output = card.querySelector(".tool-output");
  output.textContent = text;
  if (tool.truncated) output.textContent += "\n…[TRUNCATED]";
  pendingTools.splice(idx, 1);
  updateToolSummary();
}

function addToolFromHistory(m) {
  const card = buildToolCard({ name: m.name, content: m.content }, true);
  inner().appendChild(card);
}

function commandText(tool) {
  if (tool.name === "kubectl") {
    const c = tool.arguments && tool.arguments.command;
    return c ? String(c) : "kubectl";
  }
  return "[" + (tool.name || "") + "] " + formatArgs(tool.arguments);
}

/* ═══════════════════════════════════════════════════════
   审批卡片
   ═══════════════════════════════════════════════════════ */
function showApproval(choice) {
  const existing = document.querySelector(".approval");
  if (existing) existing.remove();
  const card = document.createElement("div");
  card.className = "approval";
  const prompt = document.createElement("div");
  prompt.className = "prompt";
  prompt.textContent = choice.prompt || "是否执行此操作？";
  const btns = document.createElement("div");
  btns.className = "btns";
  const mk = (label, cls, value) => {
    const b = document.createElement("button");
    b.className = cls;
    b.textContent = label;
    b.onclick = async () => {
      await api("/api/sessions/" + encodeURIComponent(currentSession) + "/approve", { method: "POST", body: JSON.stringify({ choice: value }) });
      card.remove();
      setStatus(true);
      showTyping("AI 正在继续…");
    };
    return b;
  };
  btns.appendChild(mk("确认执行", "yes", "yes"));
  btns.appendChild(mk("确认，本次不再询问", "always", "yes_and_dont_ask_again"));
  btns.appendChild(mk("拒绝", "no", "no"));
  card.appendChild(prompt);
  card.appendChild(btns);
  inner().appendChild(card);
  scroll();
}

/* ═══════════════════════════════════════════════════════
   发送消息
   ═══════════════════════════════════════════════════════ */
async function send() {
  const input = $("input");
  const q = input.value.trim();
  if (!q || chatBusy) return;
  if (!currentSession) {
    try {
      const d = await api("/api/sessions", { method: "POST", body: JSON.stringify({}) });
      openSession(d.id);
    } catch (e) {
      addMsg("error", "创建会话失败: " + e.message);
      return;
    }
  }
  chatBusy = true;
  setBusy(true);
  hideWelcome();
  addMsg("user", q);
  input.value = "";
  input.style.height = "48px";
  showTyping("AI 正在分析…");
  try {
    await api("/api/sessions/" + encodeURIComponent(currentSession) + "/send-message", {
      method: "POST", body: JSON.stringify({ query: q, skipPermissions: false }),
    });
  } catch (e) {
    addErrorCard(e.message);
    chatBusy = false;
    setBusy(false);
    hideTyping();
  }
}

/* ═══════════════════════════════════════════════════════
   工具函数
   ═══════════════════════════════════════════════════════ */
function formatArgs(args) {
  if (!args) return "";
  return "(" + Object.entries(args).map(([k, v]) => k + "=" + v).join(" ") + ")";
}

function scroll() {
  const c = $("chat");
  if (c.scrollHeight - c.scrollTop - c.clientHeight > 100) return;
  c.scrollTop = c.scrollHeight;
}

function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

function formatTime(t) {
  try {
    const d = new Date(t);
    const now = new Date();
    const diff = (now - d) / 1000;
    if (diff < 60) return "刚刚";
    if (diff < 3600) return Math.floor(diff / 60) + " 分钟前";
    if (diff < 86400) return Math.floor(diff / 3600) + " 小时前";
    if (diff < 604800) return Math.floor(diff / 86400) + " 天前";
    return d.toLocaleDateString("zh-CN", { month:"short", day:"numeric" });
  } catch (e) { return ""; }
}

function setBusy(busy) {
  const input = $("input");
  const sendBtn = $("send");
  const spinner = $("sendSpinner");
  if (busy) {
    input.disabled = true;
    input.placeholder = "AI 正在处理…";
    sendBtn.disabled = true;
    spinner.style.display = "inline-block";
  } else {
    input.disabled = false;
    input.placeholder = "例如：检查下集群健康状态，或 为什么 payment-api 一直重启？";
    sendBtn.disabled = false;
    spinner.style.display = "none";
    input.focus();
  }
}

/* ═══════════════════════════════════════════════════════
   Markdown 渲染
   ═══════════════════════════════════════════════════════ */
function markdown(s) {
  const lines = s.split("\n");
  let html = "", inCode = false, codeBuf = [], list = null;
  const closeList = () => { if (list) { html += "</" + list + ">"; list = null; } };
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    if (line.startsWith("```")) {
      closeList();
      if (inCode) { html += "<pre><code>" + codeBuf.join("\n") + "</code></pre>"; codeBuf = []; }
      inCode = !inCode;
      continue;
    }
    if (inCode) { codeBuf.push(line); continue; }
    if (/^#{1,3} /.test(line)) {
      closeList();
      const level = line.indexOf(" ");
      html += "<h" + level + ">" + inline(line.slice(level + 1)) + "</h" + level + ">";
    } else if (/^\s*[-*] /.test(line)) {
      if (list !== "ul") { closeList(); list = "ul"; html += "<ul>"; }
      html += "<li>" + inline(line.replace(/^\s*[-*] /, "")) + "</li>";
    } else if (/^\s*\d+\. /.test(line)) {
      if (list !== "ol") { closeList(); list = "ol"; html += "<ol>"; }
      html += "<li>" + inline(line.replace(/^\s*\d+\. /, "")) + "</li>";
    } else if (/^\|/.test(line)) {
      closeList();
      html += "<table><tr>" + tableCells(line, "th") + "</tr>";
      i++;
      if (i < lines.length && /^[-|:\s]+$/.test(lines[i].replace(/^\|/, "").replace(/\|$/, ""))) {
        i++;
      }
      while (i < lines.length && lines[i].startsWith("|")) {
        html += "<tr>" + tableCells(lines[i], "td") + "</tr>";
        i++;
      }
      i--;
      html += "</table>";
    } else if (/^&gt; /.test(line)) {
      closeList();
      html += "<blockquote>" + inline(line.replace(/^&gt; /, "")) + "</blockquote>";
    } else if (line.trim() === "") {
      closeList();
    } else {
      closeList();
      html += "<p>" + inline(line) + "</p>";
    }
  }
  closeList();
  if (inCode) html += "<pre><code>" + codeBuf.join("\n") + "</code></pre>";
  return '<div class="markdown">' + html + "</div>";
}

function tableCells(line, tag) {
  return line.split("|").filter((c) => c.trim() !== "").map((c) => "<" + tag + ">" + inline(c.trim()) + "</" + tag + ">").join("");
}

function inline(s) {
  s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/\*([^*]+)\*/g, "<em>$1</em>");
  s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
  s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  return s;
}
