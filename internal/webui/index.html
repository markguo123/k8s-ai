<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>k8s-ai · Kubernetes AI 诊断助手</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>

/* ═══════════════════════════════════════════════════════
   Design System
   ═══════════════════════════════════════════════════════ */

:root {
  color-scheme: dark;
  --bg: #0a0d14;
  --panel: #131720;
  --panel-2: #1a1f2e;
  --sidebar: #0f1219;
  --sidebar-hover: rgba(255,255,255,.05);
  --sidebar-active: rgba(99,102,241,.18);
  --sidebar-text: #c9cdd4;
  --sidebar-muted: #6b7280;
  --text: #e5e7eb;
  --text-secondary: #d1d5db;
  --muted: #9ca3af;
  --accent: #6366f1;
  --accent-2: #8b5cf6;
  --accent-light: rgba(99,102,241,.12);
  --border: #232838;
  --border-light: #1a1f2e;
  --code-bg: #0d1017;
  --ok: #10b981;
  --ok-light: rgba(16,185,129,.12);
  --warn: #f59e0b;
  --warn-light: rgba(245,158,11,.12);
  --danger: #ef4444;
  --danger-light: rgba(239,68,68,.12);

  --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', 'Cascadia Code', Consolas, monospace;

  --space-xs: 4px;
  --space-sm: 8px;
  --space-md: 16px;
  --space-lg: 24px;
  --space-xl: 32px;

  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 14px;

  --shadow-sm: 0 1px 2px rgba(0,0,0,.22);
  --shadow-md: 0 4px 12px rgba(0,0,0,.3);
  --shadow-lg: 0 8px 24px rgba(0,0,0,.4);
}

@media (prefers-color-scheme: light) {
  :root {
    color-scheme: light;
    --bg: #f5f6f8;
    --panel: #ffffff;
    --panel-2: #f8fafc;
    --sidebar: #1a1f2e;
    --sidebar-hover: rgba(255,255,255,.06);
    --sidebar-active: rgba(99,102,241,.22);
    --sidebar-text: #c9cdd4;
    --sidebar-muted: #6b7280;
    --text: #111827;
    --text-secondary: #374151;
    --muted: #6b7280;
    --accent: #4f46e5;
    --accent-2: #7c3aed;
    --accent-light: #eef2ff;
    --border: #e5e7eb;
    --border-light: #f3f4f6;
    --code-bg: #f8f9fb;
    --ok: #059669;
    --ok-light: #ecfdf5;
    --warn: #d97706;
    --warn-light: #fffbeb;
    --danger: #dc2626;
    --danger-light: #fef2f2;
    --shadow-sm: 0 1px 2px rgba(0,0,0,.04);
    --shadow-md: 0 4px 12px rgba(0,0,0,.06);
    --shadow-lg: 0 8px 24px rgba(0,0,0,.08);
  }
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }

body {
  background:
    radial-gradient(circle at 15% 20%, var(--accent-light), transparent 38%),
    var(--bg);
  color: var(--text);
  font-family: var(--font-sans);
  font-size: 15px;
  line-height: 1.7;
  display: flex;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* ═══════════════════════════════════════════════════════
   Sidebar
   ═══════════════════════════════════════════════════════ */

#sidebar {
  width: 260px;
  background: var(--sidebar);
  color: var(--sidebar-text);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  z-index: 100;
  transition: width .28s ease, opacity .2s ease;
  overflow: hidden;
}

/* === 品牌区 === */

#sidebar header {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 16px 10px 16px 14px;
  border-bottom: 1px solid rgba(255,255,255,.06);
  flex-shrink: 0;
}

.brand {
  display: flex;
  align-items: center;
  gap: 11px;
  flex: 1;
  min-width: 0;
}

.brand-icon {
  position: relative;
  width: 38px;
  height: 38px;
  border-radius: 11px;
  background: linear-gradient(135deg, #6366f1, #8b5cf6, #ec4899, #6366f1);
  background-size: 300% 300%;
  display: grid;
  place-items: center;
  flex-shrink: 0;
  overflow: hidden;
  box-shadow:
    0 4px 14px rgba(99,102,241,.35),
    0 0 0 1px rgba(139,92,246,.3) inset;
  animation: brandGradient 8s ease infinite, brandGlow 3s ease-in-out infinite;
}

.brand-icon::before {
  content: "";
  position: absolute;
  top: 0; left: 0;
  width: 60%;
  height: 100%;
  background: linear-gradient(
    100deg,
    transparent 0%,
    rgba(255,255,255,0) 30%,
    rgba(255,255,255,.35) 50%,
    rgba(255,255,255,0) 70%,
    transparent 100%
  );
  transform: translateX(-150%);
  animation: brandShine 3.5s ease-in-out infinite;
  z-index: 1;
}

@keyframes brandGradient {
  0%, 100% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
}

@keyframes brandGlow {
  0%, 100% {
    box-shadow:
      0 4px 14px rgba(99,102,241,.35),
      0 0 0 1px rgba(139,92,246,.3) inset;
  }
  50% {
    box-shadow:
      0 4px 22px rgba(139,92,246,.6),
      0 0 0 1px rgba(139,92,246,.55) inset;
  }
}

@keyframes brandShine {
  0% { transform: translateX(-150%); }
  60%, 100% { transform: translateX(250%); }
}

.brand-icon svg {
  width: 20px;
  height: 20px;
  color: #fff;
  position: relative;
  z-index: 2;
  filter: drop-shadow(0 1px 2px rgba(0,0,0,.25));
}

.brand-text {
  min-width: 0;
  flex: 1;
}

#sidebar h1 {
  display: flex;
  align-items: baseline;
  font-size: 18px;
  line-height: 1.15;
  letter-spacing: -.5px;
  font-weight: 700;
  color: #fff;
  margin: 0;
  font-family: var(--font-sans);
}

.brand-k8s {
  color: #ffffff;
  font-weight: 700;
  letter-spacing: -.5px;
}

.brand-dash {
  color: var(--accent);
  font-weight: 400;
  margin: 0 1px;
  opacity: .9;
}

.brand-ai {
  background: linear-gradient(135deg, #a5b4fc, #e0e7ff 60%, #c4b5fd);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  font-weight: 800;
  letter-spacing: -.3px;
}

#sidebar .sub {
  color: var(--sidebar-muted);
  font-size: 9.5px;
  margin-top: 4px;
  font-weight: 600;
  letter-spacing: .16em;
  text-transform: uppercase;
  opacity: .85;
  white-space: nowrap;
}

/* === 侧栏收起按钮（仅桌面端显示） === */

.sidebar-collapse {
  width: 36px;
  height: 36px;
  border-radius: 9px;
  border: 1px solid transparent;
  background: transparent;
  color: var(--sidebar-muted);
  cursor: pointer;
  display: grid;
  place-items: center;
  flex-shrink: 0;
  transition: all .15s;
  padding: 0;
}

.sidebar-collapse:hover {
  color: #fff;
  background: rgba(255,255,255,.06);
  border-color: rgba(255,255,255,.12);
}

.sidebar-collapse svg {
  width: 16px;
  height: 16px;
}

/* === 桌面端收起态 === */

@media (min-width: 961px) {
  body.sidebar-collapsed #sidebar {
    width: 44px;
    opacity: 1;
  }
  body.sidebar-collapsed #sidebar .brand,
  body.sidebar-collapsed #sidebar #sessionList,
  body.sidebar-collapsed #sidebar #newSession {
    display: none;
  }
  body.sidebar-collapsed #sidebar header {
    padding: 0;
    justify-content: center;
    border-bottom-color: transparent;
  }
  body.sidebar-collapsed #sidebar .sidebar-collapse {
    width: 40px;
    height: 40px;
  }
}

/* === 移动端隐藏收起/展开按钮（移动端已有 drawer 逻辑） === */

@media (max-width: 960px) {
  .sidebar-collapse { display: none; }
}

/* === 品牌区结束 === */

#sessionList { flex: 1; overflow-y: auto; padding: 12px 10px; }

.session-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 12px; border-radius: var(--radius-md);
  cursor: pointer; margin-bottom: 2px; transition: background .15s;
}
.session-item:hover { background: var(--sidebar-hover); }
.session-item.active { background: var(--sidebar-active); }
.session-item .name-row { display: flex; align-items: center; gap: 6px; flex: 1; min-width: 0; }
.session-item .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; font-weight: 500; }

.session-item .del, .session-item .ren {
  color: var(--sidebar-muted); border: none; background: none;
  cursor: pointer; font-size: 12px; padding: 2px 4px; border-radius: 4px;
  opacity: 0; transition: opacity .15s, color .15s;
}
.session-item:hover .del, .session-item:hover .ren { opacity: 1; }
.session-item .del:hover { color: #f87171; }
.session-item .del svg { width: 12px; height: 12px; display: block; }
.session-item .ren svg { width: 12px; height: 12px; display: block; }
.session-item .ren:hover { color: #60a5fa; }
.session-item .time { color: var(--sidebar-muted); font-size: 11px; margin-top: 2px; }

#newSession {
  margin: 12px; padding: 11px; border: none; border-radius: var(--radius-md);
  background: var(--accent); color: #fff; cursor: pointer;
  font-size: 13px; font-weight: 600; transition: opacity .15s;
  flex-shrink: 0; display: flex; align-items: center; justify-content: center; gap: 6px;
}
#newSession:hover { opacity: .9; }
#newSession svg { width: 16px; height: 16px; flex-shrink: 0; }

/* ═══════════════════════════════════════════════════════
   Main Layout
   ═══════════════════════════════════════════════════════ */

#main { flex: 1; display: flex; flex-direction: column; min-width: 0; position: relative; }

#chat { flex: 1; overflow-y: auto; padding: var(--space-lg) var(--space-lg); scroll-behavior: smooth; }
.inner { max-width: 880px; margin: 0 auto; }

/* ═══════════════════════════════════════════════════════
   Session Status Bar — 方案 B
   ═══════════════════════════════════════════════════════ */

.session-status {
  display: flex;
  align-items: center;
  gap: 12px;
  width: calc(100% - 32px);
  max-width: 880px;
  margin: 16px auto 0;
  padding: 10px 16px 10px 16px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 12px;
  box-shadow: var(--shadow-sm);
  font-size: 12.5px;
  position: relative;
  overflow: hidden;
  transition: border-color .25s, background .25s;
  min-height: 44px;
}

.session-status::before {
  content: "";
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 3px;
  background: var(--accent);
  transition: background .25s;
}

.session-status.done::before { background: var(--ok); }
.session-status.waiting::before { background: var(--warn); }

.session-status .status-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
  background: var(--accent);
  position: relative;
  box-shadow: 0 0 0 3px rgba(99,102,241,.18);
  animation: pulse 1.4s ease-in-out infinite;
  transition: background .25s, box-shadow .25s;
}

.session-status.done .status-dot {
  background: var(--ok);
  box-shadow: 0 0 0 3px rgba(16,185,129,.16);
  animation: none;
}

.session-status.waiting .status-dot {
  background: var(--warn);
  box-shadow: 0 0 0 3px rgba(245,158,11,.16);
  animation: pulse 1.4s ease-in-out infinite;
}

.session-status.interrupted::before { background: var(--warn); }
.session-status.interrupted .status-dot {
  background: var(--warn);
  box-shadow: 0 0 0 3px rgba(245,158,11,.16);
  animation: none;
}
.session-status.interrupted .agent-name { color: var(--warn); }
.session-status.interrupted .counters .num { color: var(--warn); }

.session-status .agent-line {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.session-status .agent-name {
  color: var(--accent);
  font-weight: 700;
  font-size: 12.5px;
  margin-right: 6px;
  letter-spacing: .1px;
  transition: color .25s;
}

.session-status.done .agent-name { color: var(--ok); }
.session-status.waiting .agent-name { color: var(--warn); }

.session-status .agent-detail {
  color: var(--text-secondary);
  font-weight: 500;
  font-size: 12.5px;
}

.session-status .counters {
  flex: none;
  color: var(--muted);
  white-space: nowrap;
  font-family: var(--font-mono);
  font-size: 11px;
  display: flex;
  align-items: center;
  gap: 4px;
}

.session-status .counters .counter-key {
  color: var(--muted);
  font-size: 11px;
}

.session-status .counters .counter-sep {
  color: var(--border);
  margin: 0 2px;
}

.session-status .counters .num {
  color: var(--accent-2);
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  margin-left: 2px;
  margin-right: 4px;
}

.session-status.done .counters .num { color: var(--ok); }

/* ═══════════════════════════════════════════════════════
   Messages
   ═══════════════════════════════════════════════════════ */

.msg { margin-bottom: var(--space-lg); animation: slideUp .25s ease-out; }

@keyframes slideUp {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}

.msg .who {
  font-size: 12px; color: var(--muted); margin-bottom: 6px;
  font-weight: 600; text-transform: uppercase; letter-spacing: .5px;
}

.msg.user { text-align: right; }
.msg.user .content {
  display: inline-block; text-align: left;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  border: none; border-radius: 13px 13px 4px 13px;
  padding: 12px 16px; max-width: 85%; color: #fff;
  box-shadow: 0 4px 12px rgba(99, 102, 241, .25);
}

.msg.agent .content { width: 100%; }

.msg.error .content {
  background: var(--danger-light); border: 1px solid var(--danger);
  border-radius: var(--radius-md); padding: 12px 16px;
  color: var(--danger); font-size: 14px;
}

.msg.progress-message .who { color: var(--muted); font-size: 11px; }
.msg.progress-message .content { color: var(--muted); font-size: 13px; opacity: .7; }

/* ═══════════════════════════════════════════════════════
   诊断报告卡片
   ═══════════════════════════════════════════════════════ */

.msg.report { margin-top: var(--space-xl); margin-bottom: var(--space-xl); }

.msg.report .content {
  background: linear-gradient(135deg, var(--accent-light), rgba(139, 92, 246, .04));
  border: 1px solid var(--border); border-left: 3px solid var(--accent);
  border-radius: var(--radius-lg); padding: var(--space-lg) var(--space-xl);
  box-shadow: var(--shadow-md); font-size: 14.5px; line-height: 1.75;
}

.msg.report .who {
  color: var(--accent); font-size: 11px;
  display: flex; align-items: center; gap: 6px;
}

.msg.report .who::before {
  content: "诊断报告"; font-size: 10px; font-weight: 700;
  letter-spacing: .5px; color: var(--accent); background: var(--accent-light);
  border: 1px solid rgba(99, 102, 241, .22);
  border-radius: 999px; padding: 2px 9px;
}

/* ═══════════════════════════════════════════════════════
   Turn Timeline
   ═══════════════════════════════════════════════════════ */

.turn-timeline { margin: var(--space-md) 0; }
.turn-timeline > .process-step { margin: 0 0 16px; }
.turn-timeline > .process-step:last-child { margin-bottom: 0; }

.turn-stepper {
  display: flex; align-items: center; gap: 0;
  margin: 0 0 var(--space-md); padding: 10px 14px;
  background: var(--panel); border: 1px solid var(--border);
  border-radius: var(--radius-md); box-shadow: var(--shadow-sm);
}

.turn-stepper-title {
  flex: none; margin-right: 14px;
  font-size: 10px; font-weight: 700; letter-spacing: .08em;
  text-transform: uppercase; color: var(--muted); white-space: nowrap;
}

.turn-stepper .step {
  display: inline-flex; align-items: center; gap: 8px;
  white-space: nowrap; color: var(--muted);
  font-size: 12px; font-weight: 600; transition: color .2s;
}

.turn-stepper .step-dot {
  width: 24px; height: 24px; flex: none; border-radius: 50%;
  display: grid; place-items: center; font-size: 11px;
  border: 1px solid var(--border); background: var(--border-light);
  color: var(--muted); transition: all .2s;
}

.turn-stepper .step.done { color: var(--text-secondary); }
.turn-stepper .step.done .step-dot {
  color: var(--ok); border-color: var(--ok); background: var(--ok-light);
}
.turn-stepper .step.active { color: var(--text); }
.turn-stepper .step.active .step-dot {
  color: var(--accent); border-color: var(--accent);
  background: var(--accent-light); box-shadow: 0 0 0 4px var(--accent-light);
}

.turn-stepper .step-connector {
  height: 2px; flex: 1; min-width: 20px; margin: 0 10px;
  border-radius: 2px; background: var(--border); transition: background .2s;
}
.turn-stepper .step-connector.done { background: var(--ok); }

/* ═══════════════════════════════════════════════════════
   分析过程面板
   ═══════════════════════════════════════════════════════ */

.phase-progress {
  margin: var(--space-md) 0;
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  background:
    linear-gradient(135deg, rgba(99,102,241,.06), rgba(139,92,246,.02)),
    var(--panel-2);
  overflow: hidden;
  box-shadow: var(--shadow-sm);
  position: relative;
  transition: border-color .3s, background .3s;
}

.phase-progress::before {
  content: "";
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 3px;
  background: linear-gradient(180deg, var(--accent), var(--accent-2));
  transition: background .3s;
}

.phase-progress[data-done="true"] {
  background: var(--panel-2);
}
.phase-progress[data-done="true"]::before {
  background: var(--ok);
}

.phase-progress summary {
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
  list-style: none;
  padding: 12px 16px 12px 18px;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-secondary);
  transition: background .15s;
  user-select: none;
}

.phase-progress summary:hover { background: rgba(99,102,241,.04); }
.phase-progress summary::-webkit-details-marker { display: none; }

.phase-progress summary .phase-chevron {
  margin-left: 8px;
  width: 14px;
  height: 14px;
  color: var(--muted);
  transition: transform .2s;
  flex-shrink: 0;
}
.phase-progress[open] summary .phase-chevron { transform: rotate(180deg); }

.phase-progress .mark {
  width: 26px;
  height: 26px;
  border-radius: 8px;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  color: #fff;
  display: grid;
  place-items: center;
  flex-shrink: 0;
  font-size: 14px;
  box-shadow: 0 2px 8px rgba(99,102,241,.35);
  transition: background .3s, box-shadow .3s;
  line-height: 1;
}

.phase-progress .mark svg {
  width: 17px;
  height: 17px;
}

.phase-progress[data-done="true"] .mark {
  background: linear-gradient(135deg, var(--ok), #34d399);
  box-shadow: 0 2px 8px rgba(16,185,129,.3);
}

.phase-progress .phase-label {
  color: var(--text-secondary);
  font-weight: 600;
  letter-spacing: .2px;
  font-size: 13.5px;
}

.phase-progress[data-done="true"] .phase-label {
  color: var(--text-secondary);
}

.phase-progress .phase-count {
  color: var(--muted);
  font-weight: 400;
  font-size: 11.5px;
  font-family: var(--font-mono);
}

.phase-progress .phase-status {
  margin-left: auto;
  color: var(--accent);
  font-size: 11px;
  font-weight: 600;
  white-space: nowrap;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 9px;
  background: var(--accent-light);
  border-radius: 999px;
  font-family: var(--font-mono);
}

.phase-progress .phase-status::before {
  content: "";
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: currentColor;
  animation: pulse 1.2s infinite;
  flex-shrink: 0;
}

.phase-progress[data-done="true"] .phase-status {
  color: var(--ok);
  background: var(--ok-light);
}
.phase-progress[data-done="true"] .phase-status::before {
  animation: none;
}

.phase-progress .progress-list {
  border-top: 1px solid var(--border);
  padding: 12px 16px 14px;
  max-height: 320px;
  overflow-y: auto;
  overscroll-behavior: contain;
  background: rgba(13, 16, 23, .35);
}

.phase-progress .progress-item {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 6px 0;
  font-size: 13px;
  color: var(--text-secondary);
  line-height: 1.6;
}

.phase-progress .progress-text {
  flex: 1;
  min-width: 0;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  font-family: var(--font-mono);
  font-size: 12.5px;
  color: var(--text-secondary);
  border-radius: 4px;
}

.phase-progress .progress-item.active .progress-text {
  background: linear-gradient(90deg, var(--accent-light), rgba(99, 102, 241, 0));
  padding: 2px 6px;
}

.phase-progress .progress-item.active .progress-text::after {
  content: "▍";
  display: inline-block;
  margin-left: 2px;
  color: var(--accent);
  text-shadow: 0 0 8px var(--accent);
  animation: cursor-blink 1s steps(2, start) infinite;
}

.phase-progress .progress-item::before {
  content: "✓";
  color: var(--ok);
  font-weight: 700;
  font-size: 11px;
  margin-top: 3px;
  flex-shrink: 0;
}

.phase-progress .progress-item.active::before {
  content: "●";
  color: var(--accent);
  animation: pulse 1.2s ease-in-out infinite;
}

/* ═══════════════════════════════════════════════════════
   工具卡片
   ═══════════════════════════════════════════════════════ */

.tool-summary-bar {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 14px; margin: 8px 0;
  background: var(--code-bg); border-radius: var(--radius-sm);
  font-size: 12px; color: var(--muted); font-weight: 500;
}

.tool-summary-bar .count { color: var(--text); font-weight: 600; }
.tool-summary-bar .sep { color: var(--border); }

.tool-card {
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--panel-2);
  margin: 8px 0;
  overflow: hidden;
  position: relative;
  transition: border-color .2s, box-shadow .2s;
}

.tool-card.executing {
  border-color: rgba(99,102,241,.55);
  box-shadow: 0 0 0 3px rgba(99,102,241,.06);
}

.tool-card.completed {
  border-color: rgba(16,185,129,.25);
}

.tool-card.error {
  border-color: rgba(239,68,68,.45);
}

.tool-card::before {
  content: "";
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 3px;
  background: transparent;
  transition: background .25s;
}

.tool-card.executing::before { background: var(--accent); animation: pulse 1.5s infinite; }
.tool-card.completed::before { background: var(--ok); }
.tool-card.error::before { background: var(--danger); }

.tool-head {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 9px 12px 9px 14px;
  cursor: pointer;
  user-select: none;
  transition: background .15s;
  min-height: 40px;
}

.tool-head:hover { background: rgba(255,255,255,.02); }

.tool-status-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
  background: var(--muted);
  position: relative;
  transition: background .2s, box-shadow .2s;
}

.tool-card.executing .tool-status-dot {
  background: var(--accent);
  box-shadow: 0 0 0 3px rgba(99,102,241,.18);
  animation: pulse 1.2s ease-in-out infinite;
}

.tool-card.completed .tool-status-dot {
  background: var(--ok);
  box-shadow: 0 0 0 3px rgba(16,185,129,.14);
}

.tool-card.error .tool-status-dot {
  background: var(--danger);
  box-shadow: 0 0 0 3px rgba(239,68,68,.14);
}

.tool-verb {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 600;
  color: var(--accent);
  flex-shrink: 0;
  letter-spacing: -.2px;
  padding: 2px 7px;
  border-radius: 4px;
  background: var(--accent-light);
}

.tool-card.completed .tool-verb {
  color: var(--ok);
  background: var(--ok-light);
}

.tool-card.error .tool-verb {
  color: var(--danger);
  background: var(--danger-light);
}

.tool-command {
  flex: 1;
  min-width: 0;
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--text-secondary);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  line-height: 1.5;
}

.tool-risk {
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 700;
  padding: 2px 7px;
  border-radius: 4px;
  letter-spacing: .3px;
  flex-shrink: 0;
  text-transform: uppercase;
}

.tool-risk.risk-safe,
.tool-risk.risk-low {
  color: var(--muted);
  background: rgba(156,163,175,.1);
}

.tool-risk.risk-medium {
  color: var(--warn);
  background: var(--warn-light);
}

.tool-risk.risk-high,
.tool-risk.risk-critical {
  color: var(--danger);
  background: var(--danger-light);
}

.tool-time {
  color: var(--muted);
  font-size: 10.5px;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
  font-family: var(--font-mono);
  flex-shrink: 0;
  min-width: 34px;
  text-align: right;
}

.tool-copy {
  border: 1px solid transparent;
  background: none;
  color: var(--muted);
  cursor: pointer;
  font-size: 11px;
  padding: 3px 8px;
  border-radius: var(--radius-sm);
  white-space: nowrap;
  transition: color .15s, border-color .15s, background .15s;
  flex-shrink: 0;
  font-family: var(--font-sans);
}
.tool-copy:hover {
  color: var(--text);
  border-color: var(--border);
  background: var(--border-light);
}

.tool-toggle {
  display: flex;
  align-items: center;
  gap: 4px;
  border: 1px solid transparent;
  background: none;
  color: var(--muted);
  cursor: pointer;
  font-size: 11px;
  white-space: nowrap;
  padding: 3px 8px;
  border-radius: var(--radius-sm);
  transition: color .15s, background .15s, border-color .15s;
  flex-shrink: 0;
  font-family: var(--font-sans);
}

.tool-toggle:hover {
  color: var(--text);
  border-color: var(--border);
  background: var(--border-light);
}

.tool-toggle svg {
  width: 11px;
  height: 11px;
  transition: transform .2s;
}

.tool-toggle.open svg { transform: rotate(180deg); }

.tool-error-bar {
  display: none;
  padding: 7px 14px 7px 26px;
  border-top: 1px solid rgba(239,68,68,.2);
  background: rgba(239,68,68,.06);
  color: #fca5a5;
  font-family: var(--font-mono);
  font-size: 11px;
  line-height: 1.55;
  word-break: break-word;
}

.tool-card.error .tool-error-bar {
  display: block;
}

.tool-error-bar .err-label {
  display: inline-block;
  color: var(--danger);
  font-weight: 700;
  margin-right: 6px;
  letter-spacing: .3px;
}

.tool-output {
  display: none;
  border-top: 1px solid var(--border);
  margin: 0;
  padding: 12px 14px;
  font-family: var(--font-mono);
  font-size: 12px;
  line-height: 1.6;
  white-space: pre-wrap;
  word-break: break-word;
  max-height: 420px;
  overflow: auto;
  background: var(--code-bg);
  color: var(--text-secondary);
}

.tool-card.open .tool-output { display: block; }

.tool-card .tool-manifest {
  display: none;
  margin: 0 14px 10px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: rgba(0,0,0,.28);
}

.tool-card.open .tool-manifest { display: block; }

.tool-manifest summary {
  cursor: pointer;
  font-size: 11px;
  color: var(--muted);
  user-select: none;
  padding: 6px 12px;
}

.tool-manifest summary:hover { color: var(--text); }

.tool-manifest .mf-body { position: relative; border-top: 1px solid var(--border); }

.tool-manifest pre {
  margin: 0;
  padding: 10px 12px;
  max-height: 320px;
  overflow: auto;
  font-family: var(--font-mono);
  font-size: 12px;
  line-height: 1.6;
  white-space: pre;
  color: var(--text-secondary);
}

.tool-manifest .mf-copy {
  position: absolute;
  top: 6px;
  right: 8px;
  padding: 2px 8px;
  font-size: 11px;
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  background: var(--code-bg);
  color: var(--text-secondary);
  cursor: pointer;
}

/* ═══════════════════════════════════════════════════════
   审批卡片
   ═══════════════════════════════════════════════════════ */

.approval {
  border: 1px solid var(--accent);
  border-radius: var(--radius-lg);
  background: var(--panel);
  padding: var(--space-lg);
  margin: var(--space-md) 0;
  box-shadow: var(--shadow-md);
  position: relative;
  overflow: hidden;
}

.approval::before {
  content: "";
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 3px;
  background: var(--warn);
}

.approval .prompt {
  font-size: 14px;
  white-space: pre-wrap;
  margin-bottom: 16px;
  line-height: 1.7;
  color: var(--text-secondary);
  padding-left: 10px;
}

.approval .btns { display: flex; gap: 10px; flex-wrap: wrap; padding-left: 10px; }

.approval .secret-row { padding-left: 10px; margin-bottom: 10px; }
.approval .secret-input {
  width: 100%; box-sizing: border-box; padding: 9px 12px;
  border: 1px solid var(--border); border-radius: 8px;
  background: var(--code-bg); color: var(--text);
  font-family: inherit; font-size: 13px;
}
.approval .secret-input:focus { outline: none; border-color: var(--accent); }
.approval .secret-hint { padding-left: 10px; font-size: 11.5px; opacity: .7; margin: -4px 0 10px; }

.approval button {
  padding: 10px 20px;
  border: none;
  border-radius: var(--radius-md);
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
  transition: opacity .15s, transform .1s;
}

.approval button:active { transform: scale(.97); }
.approval .yes { background: var(--ok); color: #fff; box-shadow: 0 4px 12px rgba(16,185,129,.28); }
.approval .always { background: var(--accent); color: #fff; box-shadow: 0 4px 12px rgba(99,102,241,.28); }
.approval .no { background: var(--code-bg); color: var(--text); border: 1px solid var(--border); }

.approval.submitting button {
  opacity: .55;
  cursor: wait;
  transform: none;
}
.approval button:disabled { pointer-events: none; }

.approval.resolved { box-shadow: none; }
.approval.resolved::before { background: var(--ok); }
.approval.resolved.rejected::before { background: var(--danger); }

.approval .resolution {
  padding-left: 10px;
  font-size: 13px;
  font-weight: 700;
  color: var(--ok);
}

.approval .resolution.rejected { color: var(--danger); }

/* ═══════════════════════════════════════════════════════
   输入区域
   ═══════════════════════════════════════════════════════ */

#inputBar { border-top: 1px solid var(--border); padding: 16px var(--space-lg) 20px; background: var(--panel); }
#inputRow { max-width: 880px; margin: 0 auto; display: flex; gap: 12px; align-items: flex-end; }

#input {
  flex: 1; background: var(--bg); border: 1px solid var(--border);
  border-radius: var(--radius-md); color: var(--text);
  padding: 12px 16px; font-size: 14px; font-family: var(--font-sans);
  resize: none; height: 48px; max-height: 180px; line-height: 1.5;
  transition: border-color .15s, box-shadow .15s;
}

#input:focus {
  outline: none; border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-light);
}
#input:disabled { opacity: .5; cursor: not-allowed; }
#input:disabled:focus { outline: none; box-shadow: none; }

#send {
  width: 80px; height: 48px; border: none;
  border-radius: var(--radius-md); background: var(--accent);
  color: #fff; cursor: pointer; font-size: 14px; font-weight: 600;
  transition: opacity .15s;
}
#send:hover { opacity: .9; }
#send:disabled { opacity: .4; cursor: not-allowed; }

#stop {
  width: 48px; height: 48px; border: 1px solid var(--border);
  border-radius: var(--radius-md); background: var(--bg); color: var(--danger);
  cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
  transition: border-color .15s, color .15s, opacity .15s;
}
#stop:hover { border-color: var(--danger); color: var(--danger); }
#stop:disabled { opacity: .45; cursor: not-allowed; }
#stop svg { display: block; }

.hint { max-width: 880px; margin: 8px auto 0; text-align: center; color: var(--muted); font-size: 12px; }

/* ═══════════════════════════════════════════════════════
   Markdown
   ═══════════════════════════════════════════════════════ */

.markdown h1, .markdown h2, .markdown h3, .markdown h4, .markdown h5, .markdown h6 {
  margin: 20px 0 10px; line-height: 1.3; font-weight: 700; color: var(--text);
}
.markdown h1 { font-size: 22px; }
.markdown h2 {
  font-size: 18px;
  padding-left: 10px;
  border-left: 3px solid var(--accent);
}
.markdown h3 { font-size: 16px; }
.markdown h4 { font-size: 14px; }
.markdown h5, .markdown h6 { font-size: 13px; }
.markdown p { margin: 10px 0; }
.markdown ul, .markdown ol { padding-left: 24px; margin: 10px 0; }
.markdown li { margin: 4px 0; }
.markdown a { color: var(--accent); text-decoration: none; }
.markdown a:hover { text-decoration: underline; }

.markdown .table-wrap { overflow-x: auto; margin: 14px 0; }
.markdown table {
  border-collapse: collapse;
  width: 100%; font-size: 13px;
  border-radius: var(--radius-sm); overflow: hidden;
  margin: 0;
}
.markdown th, .markdown td { border: 1px solid var(--border); padding: 8px 12px; text-align: left; }
.markdown th { background: rgba(99,102,241,.14); font-weight: 700; }
.markdown tbody td:first-child { font-weight: 600; }
.markdown blockquote {
  border-left: 3px solid var(--accent); padding-left: 14px;
  color: var(--muted); margin: 12px 0; font-style: italic;
}

pre {
  background: var(--code-bg); border: 1px solid var(--border);
  border-radius: var(--radius-md); padding: 14px 16px;
  overflow-x: auto; font-size: 12.5px; line-height: 1.6; margin: 12px 0;
}

code {
  background: var(--code-bg); padding: 2px 6px;
  border-radius: 4px; font-family: var(--font-mono);
  font-size: 13px; color: var(--accent);
}
pre code { background: none; padding: 0; color: inherit; }

.code-block {
  margin: 12px 0;
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  background: var(--code-bg);
  overflow: hidden;
}
.code-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 5px 10px;
  background: rgba(99,102,241,.08);
  border-bottom: 1px solid var(--border);
}
.code-lang {
  font-family: var(--font-mono);
  font-size: 11px;
  color: #a5b4fc;
  text-transform: uppercase;
  letter-spacing: .04em;
}
.code-copy {
  border: 1px solid transparent;
  background: none;
  color: var(--muted);
  cursor: pointer;
  font-size: 11px;
  padding: 3px 8px;
  border-radius: var(--radius-sm);
  white-space: nowrap;
  transition: color .15s, border-color .15s, background .15s;
  font-family: var(--font-sans);
}
.code-copy:hover {
  color: var(--text);
  border-color: var(--border);
  background: var(--border-light);
}
.code-block pre {
  margin: 0;
  border: none;
  border-radius: 0;
  background: none;
  padding: 12px 14px;
}

/* ═══════════════════════════════════════════════════════
   欢迎页
   ═══════════════════════════════════════════════════════ */

.welcome {
  min-height: 100%; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 44px 20px 36px;
  animation: welcomeFadeIn .55s ease-out;
}

@keyframes welcomeFadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

.welcome-hero {
  width: 100%; max-width: 760px; min-height: 300px;
  display: grid; grid-template-columns: 340px 1fr;
  align-items: center; gap: 26px; margin-bottom: 28px;
}

.robot-stage {
  position: relative; height: 300px;
  display: flex; align-items: center; justify-content: center;
  overflow: visible;
}

.robot-stage::before {
  content: ""; position: absolute;
  width: 210px; height: 210px; border-radius: 50%;
  background: radial-gradient(circle, rgba(99,102,241,.13) 0%, rgba(99,102,241,.06) 42%, rgba(99,102,241,0) 72%);
  filter: blur(2px);
}

.robot-grid { position: absolute; inset: 30px 25px; opacity: .5; }
.robot-grid span {
  position: absolute; width: 5px; height: 5px; border-radius: 50%;
  background: var(--accent); opacity: .35;
  animation: nodeBlink 2.8s ease-in-out infinite;
}
.robot-grid span:nth-child(1) { left: 8%; top: 28%; }
.robot-grid span:nth-child(2) { left: 86%; top: 22%; animation-delay: .6s; }
.robot-grid span:nth-child(3) { left: 78%; top: 76%; animation-delay: 1.2s; }
.robot-grid span:nth-child(4) { left: 12%; top: 74%; animation-delay: 1.8s; }
.robot-grid span:nth-child(5) { left: 50%; top: 4%; animation-delay: 2.2s; }

@keyframes nodeBlink {
  0%,100% { opacity: .18; transform: scale(.8); }
  50% { opacity: .8; transform: scale(1.25); }
}

.robot-svg {
  width: 250px; height: 250px; position: relative; z-index: 2;
  overflow: visible; animation: robotFloat 4s ease-in-out infinite;
}

@keyframes robotFloat {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-7px); }
}

.robot-body { transform-origin: center; }
.robot-eye { animation: robotScan 2.8s ease-in-out infinite; }

@keyframes robotScan {
  0%,100% { transform: translateX(-4px); opacity: .75; }
  50% { transform: translateX(4px); opacity: 1; }
}

.robot-light { animation: robotLight 1.8s ease-in-out infinite; }

@keyframes robotLight { 0%,100% { opacity: .45; } 50% { opacity: 1; } }

.robot-antenna { transform-origin: 125px 29px; animation: antennaMove 2.4s ease-in-out infinite; }

@keyframes antennaMove {
  0%,100% { transform: rotate(-2deg); }
  50% { transform: rotate(2deg); }
}

.robot-ring {
  fill: none; stroke: var(--accent); stroke-width: 1;
  opacity: .15; animation: ringPulse 3s ease-in-out infinite;
}
.robot-ring:nth-child(2) { animation-delay: .7s; }
.robot-ring:nth-child(3) { animation-delay: 1.4s; }

@keyframes ringPulse {
  0%,100% { opacity: .08; transform: scale(.94); }
  50% { opacity: .25; transform: scale(1.02); }
}

.ai-intro { display: flex; flex-direction: column; align-items: flex-start; gap: 13px; }

.ai-badge {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 5px 10px; border: 1px solid var(--border);
  border-radius: 999px; background: var(--panel);
  color: var(--muted); font-size: 11px; font-weight: 600;
  letter-spacing: .2px; box-shadow: var(--shadow-sm);
}

.ai-badge-dot {
  width: 6px; height: 6px; border-radius: 50%; background: var(--ok);
  box-shadow: 0 0 0 3px var(--ok-light);
  animation: pulse 1.6s ease-in-out infinite;
}

.ai-intro h2 {
  font-size: 31px; line-height: 1.22;
  letter-spacing: -.8px; font-weight: 700; color: var(--text);
}

.ai-intro .gradient-text {
  background: linear-gradient(135deg, var(--accent), #7c3aed);
  -webkit-background-clip: text; background-clip: text; color: transparent;
}

.ai-description { color: var(--muted); font-size: 13.5px; line-height: 1.7; max-width: 400px; }

.ai-bubble {
  position: relative; width: 100%; max-width: 430px; min-height: 66px;
  display: flex; align-items: center; gap: 12px;
  padding: 13px 16px; border: 1px solid var(--border);
  border-radius: 14px; background: var(--panel);
  box-shadow: var(--shadow-md); animation: bubbleFloat 3.5s ease-in-out infinite;
}

@keyframes bubbleFloat {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-3px); }
}

.ai-bubble::before {
  content: ""; position: absolute; left: -8px; top: 24px;
  width: 15px; height: 15px; background: var(--panel);
  border-left: 1px solid var(--border); border-bottom: 1px solid var(--border);
  transform: rotate(45deg);
}

.ai-bubble-icon {
  position: relative; z-index: 1;
  width: 34px; height: 34px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  background: var(--accent-light); color: var(--accent); flex-shrink: 0;
}

.ai-bubble-icon svg { width: 18px; height: 18px; }
.ai-bubble-content { min-width: 0; flex: 1; }
.ai-bubble-label { font-size: 10px; color: var(--muted); margin-bottom: 2px; font-weight: 600; letter-spacing: .3px; }
.ai-bubble-text { min-height: 24px; color: var(--text-secondary); font-size: 13px; font-weight: 500; line-height: 1.7; }

.ai-cursor {
  display: inline-block; width: 1px; height: 14px;
  margin-left: 2px; vertical-align: -2px;
  background: var(--accent);
  animation: cursorBlink .8s steps(1) infinite;
}

@keyframes cursorBlink { 50% { opacity: 0; } }

.welcome-caption {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  color: var(--muted); font-size: 12px; margin-bottom: 17px;
}

.welcome-caption .line { width: 30px; height: 1px; background: var(--border); }

.welcome-cards {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
  gap: 12px; width: 100%; max-width: 860px;
}

.welcome-card {
  position: relative; min-height: 116px; padding: 16px 17px;
  border: 1px solid var(--border); border-radius: 13px;
  background: var(--panel); cursor: pointer;
  transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease, background .18s ease;
  text-align: left; overflow: hidden;
}

.welcome-card::after {
  content: ""; position: absolute; right: -30px; bottom: -45px;
  width: 90px; height: 90px; border-radius: 50%;

.typing {

/* ═══════════════════════════════════════════════════════
   侧栏收起/展开（仅桌面端）
   ═══════════════════════════════════════════════════════ */

function setSidebarCollapsed(collapsed) {
  document.body.classList.toggle("sidebar-collapsed", collapsed);
  const toggle = $("sidebarCollapse");
  if (toggle) toggle.setAttribute("aria-expanded", String(!collapsed));
  try {
    localStorage.setItem(sidebarCollapsedKey, collapsed ? "1" : "0");
  } catch (e) { /* localStorage 不可用时静默 */ }
}

try {
  if (localStorage.getItem(sidebarCollapsedKey) === "1") {
    setSidebarCollapsed(true);
  }
} catch (e) { /* 静默 */ }

if ($("sidebarCollapse")) {
  $("sidebarCollapse").onclick = (e) => {
    e.stopPropagation();
    setSidebarCollapsed(!document.body.classList.contains("sidebar-collapsed"));
  };
}

/* ═══════════════════════════════════════════════════════
   processRoot — 不再生成 stepper
   ═══════════════════════════════════════════════════════ */

function processRoot(create) {
  if (!currentTimeline && create) {
    currentTimeline = document.createElement("div");
    currentTimeline.className = "turn-timeline";
    inner().appendChild(currentTimeline);
  }
  return currentTimeline || inner();
}

function resetTimeline() { currentTimeline = null; }

/* ═══════════════════════════════════════════════════════
   setRunStatus
   ═══════════════════════════════════════════════════════ */

function setRunStatus(label, state) {
  const bar = $("sessionStatus");
  if (!bar) return;

  const labelEl = $("sessionStatusLabel");
  if (labelEl) labelEl.textContent = label;

  bar.classList.toggle("done", state === "done");
  bar.classList.toggle("waiting", state === "waiting");
  bar.classList.toggle("running", state === "running");
  bar.classList.toggle("interrupted", state === "interrupted");
}

/* ═══════════════════════════════════════════════════════
   保留函数（不再被主流程调用）
   ═══════════════════════════════════════════════════════ */

function uiLang() {
  return /^zh/i.test(document.documentElement.lang || "") ? "zh" : "en";
}

function stageLabel(key) {
  const labels = {
    reasoning: { zh: "推理", en: "Reasoning" },
    tools: { zh: "工具", en: "Tools" },
    result: { zh: "结果", en: "Result" }
  };
  return labels[key][uiLang()];
}

function buildStepper() {
  const stepper = document.createElement("div");
  stepper.className = "turn-stepper";
  stepper.setAttribute("role", "list");
  stepper.dataset.stage = "0";

  const title = document.createElement("span");
  title.className = "turn-stepper-title";
  title.textContent = uiLang() === "zh" ? "执行阶段" : "Run";
  stepper.appendChild(title);

  ["reasoning", "tools", "result"].forEach((key, index) => {
    if (index > 0) {
      const connector = document.createElement("div");
      connector.className = "step-connector";
      stepper.appendChild(connector);
    }
    const step = document.createElement("div");
    step.className = "step";
    step.setAttribute("role", "listitem");

    const dot = document.createElement("span");
    dot.className = "step-dot";
    dot.textContent = String(index + 1);

    const label = document.createElement("span");
    label.className = "step-label";
    label.textContent = stageLabel(key);

    step.appendChild(dot);
    step.appendChild(label);
    stepper.appendChild(step);
  });

  return stepper;
}
