/* ═══════════════════════════════════════════════════════
   API & Session Management
   ═══════════════════════════════════════════════════════ */

async function api(path, options) {
  const resp = await fetch(path, Object.assign(
    { headers: { "Content-Type": "application/json" } },
    options
  ));
  const data = await resp.json().catch(() => ({}));
  if (!resp.ok) throw new Error(data.error || ("HTTP " + resp.status));
  return data;
}

async function loadSessions() {
  const list = await api("/api/sessions");
  const box = $("sessionList");
  box.innerHTML = "";

  list.forEach((s) => {
    const item = document.createElement("div");
    item.className = "session-item" + (s.id === currentSession ? " active" : "");

    const nameRow = document.createElement("div");
    nameRow.className = "name-row";

    const name = document.createElement("span");
    name.className = "name";
    name.textContent = s.name || s.id;
    name.title = s.id;

    const del = document.createElement("button");
    del.className = "del";
    del.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18"/><path d="M6 6l12 12"/></svg>';
    del.onclick = async (e) => {
      e.stopPropagation();
      if (!confirm("确定删除会话「" + (s.name || s.id) + "」？")) return;
      if (s.id === currentSession) closeStream();
      await api("/api/sessions/" + encodeURIComponent(s.id), { method: "DELETE" });
      loadSessions();
    };

    const ren = document.createElement("button");
    ren.className = "ren";
    ren.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';
    ren.title = "重命名";
    ren.onclick = async (e) => {
      e.stopPropagation();
      const newName = window.prompt("重命名会话", s.name || s.id);
      if (newName === null) return;
      const trimmed = newName.trim();
      if (!trimmed || trimmed === (s.name || s.id)) return;
      try {
        await api("/api/sessions/" + encodeURIComponent(s.id) + "/rename", {
          method: "POST",
          body: JSON.stringify({ name: trimmed })
        });
        loadSessions();
      } catch (err) {
        addMsg("error", "重命名失败: " + err.message);
      }
    };

    item.onclick = () => openSession(s.id);
    nameRow.appendChild(name);
    nameRow.appendChild(ren);
    nameRow.appendChild(del);
    item.appendChild(nameRow);

    if (s.lastModified) {
      const time = document.createElement("div");
      time.className = "time";
      time.textContent = formatTime(s.lastModified);
      item.appendChild(time);
    }

    box.appendChild(item);
  });

  if (!currentSession) {
    const savedSession = sessionStorage.getItem(currentSessionStorageKey);
    if (savedSession && list.some((s) => s.id === savedSession)) {
      openSession(savedSession);
    } else {
      sessionStorage.removeItem(currentSessionStorageKey);
    }
  }
}

function closeStream() {
  if (eventSource) {
    eventSource.close();
    eventSource = null;
  }
}

function openSession(id) {
  closeStream();
  currentSession = id;

  if (id) sessionStorage.setItem(currentSessionStorageKey, id);
  else sessionStorage.removeItem(currentSessionStorageKey);

  pendingTools = [];
  toolCallCount = 0;
  resetStopControl();
  inner().innerHTML = "";
  hideTyping();
  setBusy(false);
  showWelcome();
  loadSessions();
  closeSidebar();

  if (!id) return;

  eventSource = new EventSource("/api/sessions/" + encodeURIComponent(id) + "/stream");

  eventSource.onmessage = (ev) => {
    handleEvent(JSON.parse(ev.data));
  };

  eventSource.onerror = () => {
    chatBusy = false;
    resetStopControl();
    setBusy(false);
    closeProgress("已中断");
    collapseCompletedToolCards();
    resetTimeline();
    stopRunStatus("interrupted", "连接中断，可重新提问");
  };
}

/* ═══════════════════════════════════════════════════════
   Event Handling
   ═══════════════════════════════════════════════════════ */

function handleEvent(ev) {
  switch (ev.type) {

    case "history":
      resetStopControl();
      stopRunStatus("done", "已就绪，等待你的指令");
      resetRunCounters();
      inner().innerHTML = "";
      pendingTools = [];
      toolCallCount = 0;
      resetTimeline();
      hideTyping();

      if (!ev.messages || ev.messages.length === 0) {
        showWelcome();
        setBusy(false);
        break;
      }

      hideWelcome();
      (ev.messages || []).forEach((m) => {
        try {
          if (m.role === "user") {
            resetTimeline();
            addMsg("user", m.content);
          } else if (m.role === "tool") {
            addToolFromHistory(m);
          } else if (m.type === "reasoning") {
            showProgress(m.content);
            closeProgress();
          } else {
            addReport(m.content);
          }
        } catch (err) {
          console.warn("history render skipped:", err && err.message || err);
        }
      });

      resetTimeline();
      scroll();
      chatBusy = false;
      setBusy(false);
      break;

    case "delta":
      hideWelcome();
      hideTyping();
      if (ev.text) appendDelta(ev.text);
      break;

    case "answer-delta":
      hideWelcome();
      hideTyping();
      if (ev.text) appendDelta(ev.text);
      break;

    case "progress":
      hideWelcome();
      hideTyping();
      if (ev.text) {
        showProgress(ev.text);
        setRunStatus("正在思考推理…", "running");
      }
      break;

    case "reasoning-delta":
      hideWelcome();
      hideTyping();
      if (ev.text) {
        showProgress(ev.text);
        setRunStatus("正在思考推理…", "running");
      }
      break;

    case "text":
      hideWelcome();
      hideTyping();
      if (ev.text) addMsg("agent", ev.text);
      break;

    case "answer": {
      const userStopped = stopRequested || stopAcknowledged;
      hideTyping();
      if (ev.text) finishStreamedAnswer(ev.text);
      if (userStopped) {
        closeProgress("已停止");
        stopAcknowledged = true;
      } else {
        closeProgress();
      }
      collapseCompletedToolCards();
      resetTimeline();
      chatBusy = false;
      setBusy(false);
      stopRunStatus(userStopped ? "interrupted" : "done", userStopped ? "已停止本轮分析" : "分析完成");
      if (!userStopped) resetStopControl();
      break;
    }

    case "tool-call":
      hideWelcome();
      hideTyping();
      processRoot(true);
      promoteStreamToProgress();
      toolCallCount++;
      runToolCount++;
      updateRunCounters();
      setRunStatus(
        ev.tool ? "正在执行 · " + commandText(ev.tool) : "正在执行工具",
        "running"
      );
      updateToolSummary();
      if (ev.tool) addToolCard(ev.tool);
      break;

    case "tool-response":
      if (ev.tool) fillToolOutput(ev.tool);
      setRunStatus("正在解读工具结果", "running");
      showTyping("Agent 正在分析…");
      break;

    case "error": {
      const wasStopped = stopRequested || stopAcknowledged;
      hideTyping();
      if (ev.text && !wasStopped) addErrorCard(ev.text);
      closeProgress("已中断");
      collapseCompletedToolCards();
      resetTimeline();
      chatBusy = false;
      resetStopControl();
      setBusy(false);
      stopRunStatus("interrupted", wasStopped ? "本轮已停止" : "本轮结束，可继续提问");
      break;
    }

    case "choice-request":
      hideTyping();
      if (ev.choice) showApproval(ev.choice);
      if (ev.choice && ev.choice.secret) {
        setRunStatus("等待 Secret 值输入", "waiting");
        showTyping("等待 Secret 输入…", true);
        break;
      }
      setRunStatus("等待你的审批", "waiting");
      showTyping("等待审批…", true);
      break;
  }
}

/* ═══════════════════════════════════════════════════════
   Status & Typing
   ═══════════════════════════════════════════════════════ */

function setStatus(on) {
  setRunStatus(on ? "正在分析…" : "已就绪，等待你的指令", on ? "running" : "done");
}

function resetRunCounters() {
  runThinkCount = 0;
  runToolCount = 0;
  runElapsed = 0;

  updateRunCounters();

  const elapsed = $("sessionElapsed");
  if (elapsed) elapsed.textContent = "0.0s";
}

function updateRunCounters() {
  const think = $("sessionThinkCount");
  const tool = $("sessionToolCount");
  if (think) think.textContent = String(runThinkCount);
  if (tool) tool.textContent = String(runToolCount);
}

function startRunStatus(label) {
  resetRunCounters();
  runStartAt = Date.now();
  setRunStatus(label || "正在分析…", "running");

  if (runStatusTimer) clearInterval(runStatusTimer);

  runStatusTimer = setInterval(() => {
    runElapsed = (Date.now() - runStartAt) / 1000;
    const elapsed = $("sessionElapsed");
    if (elapsed) elapsed.textContent = runElapsed.toFixed(1) + "s";
  }, 100);
}

function stopRunStatus(state, label) {
  if (runStatusTimer) {
    clearInterval(runStatusTimer);
    runStatusTimer = null;
  }
  if (runStartAt) {
    runElapsed = (Date.now() - runStartAt) / 1000;
    const elapsed = $("sessionElapsed");
    if (elapsed) elapsed.textContent = runElapsed.toFixed(1) + "s";
  }
  setRunStatus(
    label || (state === "done" ? "已就绪，等待你的指令" : "正在分析…"),
    state || "done"
  );
}

function showTyping(label, isApproval) {
  hideTyping();
  const t = document.createElement("div");
  t.className = "typing" + (isApproval ? " approval-wait" : "");
  t.innerHTML =
    '<div class="dots"><span></span><span></span><span></span></div>' +
    '<span class="label">' + escapeHtml(label || "Agent 正在分析…") + '</span>';
  inner().appendChild(t);
  scroll();
}

function hideTyping() {
  const t = inner().querySelector(".typing");
  if (t) t.remove();
}

/* ═══════════════════════════════════════════════════════
   Messages
   ═══════════════════════════════════════════════════════ */

function addMsg(kind, text) {
  const msg = document.createElement("div");
  msg.className = "msg " + kind;

  const who = document.createElement("div");
  who.className = "who";
  who.textContent = kind === "user" ? "你" : kind === "error" ? "错误" : "AI 助手";

  const content = document.createElement("div");
  content.className = "content";

  if (kind === "agent") content.innerHTML = markdown(escapeHtml(text));
  else content.textContent = text;

  msg.appendChild(who);
  msg.appendChild(content);
  inner().appendChild(msg);
  scroll();
}

function addReport(text) {
  const root = processRoot(true);
  const msg = document.createElement("div");
  msg.className = "msg report process-step final-step";

  const who = document.createElement("div");
  who.className = "who";
  who.textContent = "";

  const content = document.createElement("div");
  content.className = "content";
  content.innerHTML = markdown(escapeHtml(text));

  msg.appendChild(who);
  msg.appendChild(content);
  root.appendChild(msg);
  scroll();
}

function addErrorCard(text) {
  const msg = document.createElement("div");
  msg.className = "msg error";

  const who = document.createElement("div");
  who.className = "who";
  who.textContent = "错误";

  const content = document.createElement("div");
  content.className = "content";

  const isLong = text.length > 200;
  if (isLong) {
    content.innerHTML =
      '<div class="error-summary">' + escapeHtml(text.slice(0, 200)) + '…</div>' +
      '<details class="error-details"><summary>查看详情</summary>' +
      '<pre>' + escapeHtml(text) + '</pre></details>';
  } else {
    content.textContent = text;
  }

  msg.appendChild(who);
  msg.appendChild(content);
  inner().appendChild(msg);
  scroll();
}

function finishStreamedAnswer(text) {
  const root = processRoot(false);
  const msgs = root.querySelectorAll('.msg.agent[data-streaming="true"]');
  const last = msgs.length > 0 ? msgs[msgs.length - 1] : null;

  if (!last) {
    addReport(text);
    return;
  }

  if (last._renderTimer) clearTimeout(last._renderTimer);

  last.dataset.rawText = text;
  last.dataset.streaming = "false";
  last.classList.remove("agent");
  last.classList.add("report");
  last.classList.add("process-step");
  last.classList.add("final-step");

  const who = last.querySelector(".who");
  if (who) who.textContent = "";

  const content = last.querySelector(".content");
  if (content) content.innerHTML = markdown(escapeHtml(text));

  scroll();
}

function promoteStreamToProgress() {
  const root = processRoot(false);
  const msgs = root.querySelectorAll('.msg.agent[data-streaming="true"]');
  const last = msgs.length > 0 ? msgs[msgs.length - 1] : null;
  if (!last) return;
  if (last._renderTimer) clearTimeout(last._renderTimer);

  last.dataset.streaming = "false";
  last.classList.add("progress-message");
  last.classList.remove("final-step");
  last.classList.add("intermediate-step");

  const who = last.querySelector(".who");
  if (who) who.textContent = "中间分析";
}

/* ═══════════════════════════════════════════════════════
   分析过程时间线
   ═══════════════════════════════════════════════════════ */

function ensureProgressPanel() {
  const root = processRoot(true);
  let panel = root.querySelector(".phase-progress");

  if (!panel) {
    panel = document.createElement("details");
    panel.className = "phase-progress process-step reasoning-step";
    panel.open = true;
    panel.innerHTML =
      '<summary>' +
      '<span class="mark">' +
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.2" y="6.8" width="17.6" height="11.4" rx="2.8"/><path d="M12 6.8V3.6"/><circle cx="12" cy="2.9" r="1.05" fill="currentColor" stroke="none"/><path d="M1.6 11.6h2.4"/><path d="M20 11.6h2.4"/><circle cx="9" cy="12.6" r="1.3" fill="currentColor" stroke="none"/><circle cx="15" cy="12.6" r="1.3" fill="currentColor" stroke="none"/><path d="M9.3 16h5.4"/></svg>' +
      '</span>' +
      '<span class="phase-label"></span>' +
      '<span class="phase-status">分析中</span>' +
      '<span class="phase-count"></span>' +
      '<svg class="phase-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>' +
      '</summary>' +
      '<div class="progress-list"></div>';

    root.appendChild(panel);
  }

  return { root, panel };
}

function showProgress(text) {
  const { root, panel } = ensureProgressPanel();

  panel.open = true;
  delete panel.dataset.done;

  const label = panel.querySelector(".phase-label");
  if (label) label.textContent = "AI 分析过程";

  const status = panel.querySelector(".phase-status");
  if (status) status.textContent = "分析中";

  const list = panel.querySelector(".progress-list");
  const count = panel.querySelector(".phase-count");

  let item = list.querySelector(".progress-item.active");

  if (!item) {
    item = document.createElement("div");
    item.className = "progress-item active";

    const textEl = document.createElement("span");
    textEl.className = "progress-text";

    item.appendChild(textEl);
    list.appendChild(item);

    if (runStatusTimer) {
      runThinkCount++;
      updateRunCounters();
    }
  }

  const textEl = item.querySelector(".progress-text");
  if (textEl) textEl.textContent += text;

  if (count) {
    const total = list.children.length;
    count.textContent = total > 1 ? "(" + total + " 步)" : "";
  }

  scroll();
}

function closeProgress(finalText) {
  const root = processRoot(false);
  const panel = root.querySelector(".phase-progress");

  if (panel) {
    panel.open = false;
    panel.dataset.done = "true";

    const status = panel.querySelector(".phase-status");
    if (status) status.textContent = finalText || "已完成";

    const last = panel.querySelector(".progress-item.active");
    if (last) last.classList.remove("active");
  }
}

/* ═══════════════════════════════════════════════════════
   流式增量渲染
   ═══════════════════════════════════════════════════════ */

function appendDelta(text) {
  const root = processRoot(true);
  const msgs = root.querySelectorAll('.msg.agent[data-streaming="true"]');
  let last = msgs.length > 0 ? msgs[msgs.length - 1] : null;

  if (!last) {
    const msg = document.createElement("div");
    msg.className = "msg agent process-step final-step";
    msg.dataset.streaming = "true";

    const who = document.createElement("div");
    who.className = "who";
    who.textContent = "AI 助手";

    const content = document.createElement("div");
    content.className = "content";

    msg.appendChild(who);
    msg.appendChild(content);
    root.appendChild(msg);
    last = msg;
  }

  let raw = last.dataset.rawText || "";
  raw += text;
  last.dataset.rawText = raw;

  if (last._renderTimer) clearTimeout(last._renderTimer);

  last._renderTimer = setTimeout(() => {
    const c = last.querySelector(".content");
    if (c) c.innerHTML = markdown(escapeHtml(raw));
    scroll();
    last._renderTimer = null;
  }, 50);
}

/* ═══════════════════════════════════════════════════════
   工具卡片
   ═══════════════════════════════════════════════════════ */

function updateToolSummary() {
  const { root } = ensureProgressPanel();
  let bar = root.querySelector(".tool-summary-bar");

  if (!bar) {
    bar = document.createElement("div");
    bar.className = "tool-summary-bar";
    const first = root.querySelector(".tool-card");
    if (first) root.insertBefore(bar, first);
    else root.appendChild(bar);
  }

  const completed = root.querySelectorAll(".tool-card.completed, .tool-card.error").length;
  const executing = root.querySelectorAll(".tool-card.executing").length;

  bar.innerHTML =
    '<span>工具调用</span>' +
    '<span class="count">' + toolCallCount + '</span>' +
    '<span class="sep">·</span>' +
    '<span class="count">' + completed + '</span>' +
    '<span> 已完成</span>' +
    (executing > 0
      ? '<span class="sep">·</span>' +
        '<span class="count" style="color:var(--accent)">' + executing + '</span>' +
        '<span> 执行中</span>'
      : "");
}

/* ═══════════════════════════════════════════════════════
   工具输出结构化渲染
   ═══════════════════════════════════════════════════════ */

const TL_COLUMN_LABELS = {
  name: "名称", namespace: "命名空间", phase: "阶段", nodeName: "节点",
  restartCount: "重启", readyContainers: "就绪", totalContainers: "容器",
  podIP: "Pod IP", qosClass: "QoS", status: "状态", state: "状态",
  type: "类型", reason: "原因", message: "信息", count: "次数",
  ready: "就绪", image: "镜像", lastTimestamp: "时间", firstTimestamp: "时间",
  kind: "类型", unschedulable: "不可调度", storageClass: "存储类", capacity: "容量",
  accessModes: "访问模式", provisioner: "供给者", reclaimPolicy: "回收策略",
  volumeBindingMode: "绑定模式", containername: "容器名", address: "地址",
  value: "值", key: "键", effect: "效果", lastExitCode: "上次退出码",
  startTime: "启动时间", conditions: "条件", containerstate: "容器状态"
};

const TL_LIST_COLUMNS = {
  PodList: ["name", "namespace", "phase", "restartCount", "readyContainers", "totalContainers"],
  PodCandidates: ["namespace", "name", "phase"],
  NodeList: ["name", "unschedulable"],
  NodeUsageList: ["nodeName", "cpu", "memory", "pods"],
  EventList: ["lastTimestamp", "type", "reason", "message", "count"],
  EndpointSliceList: ["namespace", "name"],
  PersistentVolumeClaimList: ["namespace", "name", "phase", "status", "storageClass"],
  ServiceList: ["namespace", "name", "type", "clusterIP", "ports"],
  NamespaceList: ["name", "phase"]
};

const TL_KV_FIELDS = [
  "name", "namespace", "phase", "nodeName", "podIP", "restartCount",
  "readyContainers", "totalContainers", "qosClass", "status", "state",
  "storageClass", "unschedulable", "startTime"
];

function statusPillClass(v) {
  const s = String(v || "").toLowerCase();
  if (/running|ready|active|bound|succeeded|available/i.test(s)) return "running";
  if (/pending|waiting|terminated|unknown/i.test(s)) return "pending";
  if (/error|fail|crash|denied|notready|unhealthy|imagepull/i.test(s)) return "error";
  if (/warning|degraded/i.test(s)) return "warning";
  return "normal";
}

function tlCell(k, v) {
  if (v === null || v === undefined || v === "") return '<span class="tl-muted">-</span>';
  if (typeof v === "object") {
    try { return '<span class="tl-muted">' + escapeHtml(JSON.stringify(v).slice(0, 120)) + '</span>'; }
    catch (e) { return '<span class="tl-muted">…</span>'; }
  }
  const str = String(v);
  if (k === "phase" || k === "status" || k === "state") {
    return '<span class="tool-status-pill ' + statusPillClass(str) + '">' + escapeHtml(str) + '</span>';
  }
  if (k === "ready" && (v === true || v === false)) {
    return '<span class="tool-status-pill ' + (v ? "running" : "pending") + '">' + (v ? "True" : "False") + '</span>';
  }
  return escapeHtml(str);
}

function tlLabel(k) { return TL_COLUMN_LABELS[k] || k; }

function renderToolDataTable(kind, items) {
  let keys = TL_LIST_COLUMNS[kind];
  if (!keys) {
    const pool = Object.create(null);
    items.slice(0, 6).forEach((o) => {
      if (o && typeof o === "object") Object.keys(o).forEach((kk) => { pool[kk] = (pool[kk] || 0) + 1; });
    });
    keys = ["kind", "name", "namespace", "phase", "status", "state", "type", "reason", "count", "restartCount"]
      .filter((k) => pool[k] >= items.length * 0.5);
    if (keys.length === 0) keys = Object.keys(pool).slice(0, 5);
  }
  if (keys.length === 0) return "";

  const th = keys.map((k) => '<th>' + escapeHtml(tlLabel(k)) + '</th>').join("");
  const tr = items.map((o) => {
    return '<tr>' + keys.map((k) => {
      const v = (o && typeof o === "object") ? o[k] : o;
      return '<td>' + tlCell(k, v) + '</td>';
    }).join("") + '</tr>';
  }).join("");

  return '<table class="tl-table"><thead><tr>' + th + '</tr></thead><tbody>' + tr + '</tbody></table>';
}

function renderToolKv(data) {
  const keys = TL_KV_FIELDS.filter((k) => data[k] !== undefined && data[k] !== null && typeof data[k] !== "object");
  if (keys.length === 0) return "";
  const rows = keys.map((k) => '<tr><th>' + escapeHtml(tlLabel(k)) + '</th><td>' + tlCell(k, data[k]) + '</td></tr>').join("");
  return '<table class="tl-kv"><tbody>' + rows + '</tbody></table>';
}

function renderToolEvents(events, label) {
  if (!Array.isArray(events) || events.length === 0) return "";
  const keys = ["lastTimestamp", "type", "reason", "message"].filter((k) => events.some((o) => o[k] !== undefined && o[k] !== null));
  const th = keys.map((k) => '<th>' + escapeHtml(tlLabel(k)) + '</th>').join("");
  const tr = events.map((o) => '<tr>' + keys.map((k) => '<td>' + tlCell(k, o[k]) + '</td>').join("") + '</tr>').join("");
  const sub = label ? '<div class="tl-sub">' + escapeHtml(label) + '</div>' : "";
  return sub + '<table class="tl-table"><thead><tr>' + th + '</tr></thead><tbody>' + tr + '</tbody></table>';
}

function renderToolStructured(data) {
  if (!data || typeof data !== "object") return "";
  const kind = data.kind || "";
  const meta = [
    data.namespace ? 'ns=' + escapeHtml(String(data.namespace)) : "",
    kind ? kind : "",
    data.count != null ? 'count=' + escapeHtml(String(data.count)) : ""
  ].filter(Boolean).join(" · ");

  let html = meta ? '<div class="tl-meta">' + escapeHtml(meta) + '</div>' : "";

  if (Array.isArray(data.items)) {
    html += renderToolDataTable(kind, data.items);
  } else if (Array.isArray(data.names)) {
    html += data.names.map((nm) => '<div class="tl-name">' + escapeHtml(String(nm)) + '</div>').join("");
  } else {
    html += renderToolKv(data);
    if (Array.isArray(data.containers) && data.containers.length) {
      html += '<div class="tl-sub">containers</div>' + renderToolDataTable("", data.containers);
    }
    if (Array.isArray(data.conditions) && data.conditions.length) {
      html += renderToolEvents(data.conditions, "conditions");
    }
  }
  if (Array.isArray(data.events) && data.events.length) {
    html += renderToolEvents(data.events, "events");
  }
  return html;
}

function renderYamlBlock(text) {
  return text.split("\n").map((line, i) => {
    const esc = escapeHtml(line);
    let inner = esc;
    if (/^\s*#/.test(line)) {
      inner = esc.replace(/^([\s]*)(#.*)$/, '$1<span class="ycom">$2</span>');
    } else {
      inner = esc
        .replace(/^(\s*)([a-zA-Z][\w.-]*)(:)/, '$1<span class="ykey">$2</span><span class="ypunct">$3</span>')
        .replace(/(:[\s]*)(["'].*?["'])/g, '$1<span class="ystr">$2</span>')
        .replace(/(:[\s]*)(\d+)([\s]*)$/g, '$1<span class="ynum">$2</span>$3');
    }
    return '<div class="tl-line tl-yaml"><span class="lno">' + (i + 1) + '</span>' + inner + '</div>';
  }).join("");
}

function renderLogsBlock(text) {
  return text.split("\n").map((line, i) => {
    const hl = /panic|fatal|FATAL/i.test(line);
    const m = line.match(/^(\d{4}-\d{2}-\d{2}[T\s]\d{2}:\d{2}:\d{2}[^\s]*\s+)?(INFO|WARN|WARNING|ERROR|PANIC|FATAL|DEBUG)?\s*(.*)$/i);
    const ts = m && m[1] ? '<span class="tl-ts">' + escapeHtml(m[1].trim()) + '</span>' : "";
    const lvl = m && m[2] ? '<span class="tl-lvl ' + m[2].toUpperCase() + '">' + m[2].toUpperCase() + '</span>' : "";
    const msg = m ? escapeHtml(m[3] || "") : escapeHtml(line);
    return '<div class="tl-line' + (hl ? ' highlight' : '') + '"><span class="lno">' + (i + 1) + '</span>' + ts + lvl + '<span class="tl-msg">' + msg + '</span></div>';
  }).join("");
}

function renderToolFreeText(text) {
  const head = text.slice(0, 500);
  if (/^apiVersion:/.test(text) || /^\s*apiVersion:/.test(text) || (/\n\s{2,}[a-z]/.test(text) && /^[a-zA-Z][\w.-]*:/m.test(head))) {
    return renderYamlBlock(text);
  }
  if (/^\d{4}-\d{2}-\d{2}[T\s]/.test(head) || /\bpanic:|\bFATAL\b/i.test(head)) {
    return renderLogsBlock(text);
  }
  return '<div class="tl-text">' + escapeHtml(text) + '</div>';
}

function parseJsonLoose(v) {
  if (typeof v === "string") {
    try { return JSON.parse(v); }
    catch (e) { return v; }
  }
  return v;
}

function stripUntrusted(text) {
  return String(text || "")
    .replace(/^\s*<untrusted_k8s_data>\s*/i, "")
    .replace(/\s*<\/untrusted_k8s_data>\s*$/i, "")
    .trim();
}

function crStatusPill(status) {
  const st = String(status || "pending");
  let cls = "warning";
  if (st === "validated" || st === "applied" || st === "ready") cls = "running";
  if (st === "partial" || st === "pending") cls = "pending";
  if (st === "rejected" || st === "failed" || st === "error" || st === "notready") cls = "error";
  return '<span class="tool-status-pill ' + cls + '">' + escapeHtml(st) + '</span>';
}

function crRiskClass(risk) {
  return riskLevel({ risk: risk }).toLowerCase();
}

function crSecretsBlock(item) {
  let keys = [];
  if (Array.isArray(item.secretKeys)) keys = keys.concat(item.secretKeys);
  if (Array.isArray(item.generatedKeys)) keys = keys.concat(item.generatedKeys);
  if (keys.length === 0) return "";
  const rows = keys.map(function(k) {
    if (k && typeof k === "object") {
      const name = String(k.key || k.name || "");
      const meta = [];
      if (k.length != null) meta.push("len=" + String(k.length));
      if (k.sha256) meta.push("sha256=" + String(k.sha256).slice(0, 16) + "...");
      if (meta.length) return '<div class="tl-line"><span class="tl-msg"><b>' + escapeHtml(name) + '</b> ' + escapeHtml(meta.join(" · ")) + '</span></div>';
      return '<div class="tl-line"><span class="tl-msg">' + escapeHtml(name) + '</span></div>';
    }
    return '<div class="tl-line"><span class="tl-msg">' + escapeHtml(String(k)) + '</span></div>';
  }).join("");
  return '<div class="tl-sub">Secret 键指纹</div>' +
    '<div class="cr-secrets"><div class="secret-note">值不会回显；仅显示键名与长度/sha256 指纹</div>' + rows + '</div>';
}

function crFindings(items) {
  const blocks = items.map(function(item) {
    const rows = [];
    if (Array.isArray(item.skills) && item.skills.length) {
      item.skills.forEach(function(f) {
        const risk = f && f.risk ? '<span class="tool-status-pill warning">' + escapeHtml(String(f.risk)) + '</span> ' : "";
        rows.push('<div class="cr-find"><span class="cr-tag">' +
          escapeHtml(String(f.skill || "")) + ":" + escapeHtml(String(f.rule || "")) +
          '</span> ' + risk + '<span class="cr-msg">' + escapeHtml(String(f.message || "")) + '</span></div>');
      });
    }
    if (Array.isArray(item.findings) && item.findings.length) {
      item.findings.forEach(function(w) {
        rows.push('<div class="cr-find muted"><span class="cr-tag">check</span> ' + escapeHtml(String(w)) + '</div>');
      });
    }
    if (rows.length === 0) return "";
    return '<div class="cr-obj"><div class="cr-obj-ref">' +
      escapeHtml(String(item.kind || "")) + " " + escapeHtml(String(item.name || "")) +
      '</div>' + rows.join("") + '</div>';
  }).join("");
  return blocks ? '<div class="tl-sub">Skill 校验与风险升档</div>' + blocks : "";
}

function crVerify(verify) {
  if (!verify || typeof verify !== "object") return "";
  const ready = verify.ready === true;
  const pill = '<span class="tool-status-pill ' + (ready ? "running" : "pending") + '">' + (ready ? "Ready" : "NotReady") + '</span>';
  let html = '<div>' + pill + (verify.timedOut ? ' <span class="tool-status-pill warning">timed out</span>' : "") + '</div>';
  if (verify.reason) html += '<div class="tl-line"><span class="tl-msg">' + escapeHtml(String(verify.reason)) + '</span></div>';
  if (verify.observations && typeof verify.observations === "object") {
    html += '<div class="tl-line"><span class="tl-msg"><b>observations</b>: ' + escapeHtml(JSON.stringify(verify.observations)) + '</span></div>';
  }
  if (Array.isArray(verify.events) && verify.events.length) {
    html += '<div class="tl-sub">Events</div>' + verify.events.map(function(e) {
      return '<div class="tl-line"><span class="tl-msg">' + escapeHtml(String(e)) + '</span></div>';
    }).join("");
    if (verify.truncated) html += '<div class="tl-muted">(events 已截断)</div>';
  }
  return '<div class="cr-sec"><div class="tl-sub">就绪校验</div>' + html + '</div>';
}

function crFlow(data, tool) {
  const args = tool && tool.arguments ? parseJsonLoose(tool.arguments) : {};
  const mode = (data && data.mode) || args.mode || "dry_run";
  const status = data && data.status ? String(data.status) : (mode === "apply" ? "applied" : "validated");
  const objs = data && Array.isArray(data.objects) ? data.objects.filter(Boolean) : [];
  const hasVerify = objs.some(function(o) { return o && o.verify; });
  const notReady = objs.some(function(o) { return o && o.verify && o.verify.ready === false; });
  const steps = ["预演", "待确认", "执行", "校验", "完成"];
  const cls = ["pending", "pending", "pending", "pending", "pending"];
  let note = "";
  if (data && mode === "dry_run") {
    if (status === "validated") {
      cls[0] = "done"; cls[1] = "active"; note = "服务端校验通过，等待用户确认后 apply";
    } else if (status === "rejected" || data.error) {
      cls[0] = "error"; note = String(data.error || "dry_run 未通过，异常态可见");
    } else {
      cls[0] = "active"; note = "进行服务端校验";
    }
  } else if (data && mode === "apply") {
    if (status === "applied" || status === "partial") {
      cls[0] = "done"; cls[1] = "done"; cls[2] = "done";
      if (hasVerify) {
        cls[3] = "done";
        cls[4] = notReady ? "active" : "done";
        note = notReady ? "存在对象未就绪，请查看校验摘要" : "创建完成，校验通过";
      } else {
        cls[3] = "pending";
        cls[4] = "done";
        note = "创建完成（未启用就绪校验）";
      }
      if (status === "partial" && data.refused) note = note + "，部分对象未成功";
    } else if (status === "rejected" || status === "failed") {
      cls[0] = "done"; cls[1] = "done"; cls[2] = "error";
      note = String(data.error || "apply 未成功，异常态可见");
    } else {
      cls[0] = "done"; cls[1] = "done"; cls[2] = "active";
      note = "正在执行并等待结果";
    }
  } else if (!data && mode === "apply") {
    cls[0] = "done"; cls[1] = "done"; cls[2] = "active";
    note = "正在执行并等待结果";
  } else if (!data) {
    cls[0] = "active"; note = "进行服务端校验";
  }
  return '<div class="cr-flow">' + steps.map(function(label, i) {
    return '<span class="cr-flow-step ' + cls[i] + '">' + escapeHtml(label) + '</span>';
  }).join("") + (note ? '<div class="cr-flow-note">' + escapeHtml(note) + '</div>' : "") + '</div>';
}

function renderCreateResource(data, tool) {
  if (!data || typeof data !== "object") return "";
  const mode = data.mode ? String(data.mode) : "dry_run";
  const status = data.status ? String(data.status) : (mode === "apply" ? "applied" : "validated");
  const meta = [];
  meta.push("mode=" + escapeHtml(mode));
  meta.push(crStatusPill(status));
  if (data.applied != null) meta.push("applied=" + escapeHtml(String(data.applied)));
  if (data.refused != null) meta.push("refused=" + escapeHtml(String(data.refused)));
  if (data.proposalId) meta.push("proposal=" + escapeHtml(String(data.proposalId)));
  let html = crFlow(data, tool) + '<div class="tl-meta">' + meta.join(" · ") + '</div>';

  if (data.risk) {
    html += '<div class="cr-risk"><span class="tool-risk risk-' + crRiskClass(data.risk) + '">' +
      escapeHtml(String(data.risk)) + '</span>' +
      (Array.isArray(data.riskReasons) && data.riskReasons.length ?
        '<ul class="cr-reasons">' + data.riskReasons.map(function(r) { return "<li>" + escapeHtml(String(r)) + "</li>"; }).join("") + '</ul>' : "") +
      '</div>';
  }

  if (Array.isArray(data.objects) && data.objects.length) {
    const rows = data.objects.map(function(o) {
      const ref = [o.kind, o.name, o.namespace ? "(" + o.namespace + ")" : ""].filter(Boolean).join(" ");
      const st = o.status ? o.status : (o.existed ? "exists" : "pending");
      const det = o.error || o.note || (o.uid ? "uid=" + o.uid : "") || "";
      return "<tr><td>" + escapeHtml(ref) + "</td><td>" + crStatusPill(st) + "</td><td>" + escapeHtml(String(det)) + "</td></tr>";
    }).join("");
    html += '<div class="tl-sub">对象清单</div>' +
      '<table class="tl-table"><thead><tr><th>Object</th><th>Status</th><th>Detail</th></tr></thead><tbody>' + rows + '</tbody></table>';
    html += crFindings(data.objects);
    html += data.objects.map(crSecretsBlock).join("");
    const verify = data.objects.map(function(o) { return o.verify; }).filter(Boolean);
    if (verify.length) html += verify.map(crVerify).join("");
  }

  if (data.secretValuesNote) html += '<div class="tool-summary">' + escapeHtml(String(data.secretValuesNote)) + '</div>';
  if (data.note) html += '<div class="tool-summary">' + escapeHtml(String(data.note)) + '</div>';
  return html;
}


function renderToolOutput(tool) {
  const src = tool || {};
  const text = String(src.result || src.content || "").trim();
  const summary = src.summary ? String(src.summary).trim() : "";
  const data = parseJsonLoose(src.data);
  const hasData = data && typeof data === "object" && !Array.isArray(data);
  let html = "";

  if (hasData) {
    if (src.name === "create_resource") html = renderCreateResource(data, src);
    if (!html) html = renderToolStructured(data);
  }

  if (html) {
    if (summary) {
      html += '<div class="tool-sep"></div><div class="tool-summary">' + escapeHtml(summary) + '</div>';
    }
    html += '<details class="tool-raw"><summary>查看原始</summary><pre class="raw-json">' +
      escapeHtml(JSON.stringify(data, null, 2)) +
      '</pre></details>';
    return html;
  }

  if (summary) return '<div class="tool-summary">' + escapeHtml(summary) + '</div>';

  const stripped = stripUntrusted(text);
  if (!stripped) return '<div class="tool-muted">（无输出）</div>';
  return renderToolFreeText(stripped);
}

function toolIsError(tool) {
  if (!tool) return false;
  if (tool.ok !== undefined && tool.ok !== null) return tool.ok === false;
  const data = parseJsonLoose(tool.data);
  if (data && typeof data === "object") {
    if (data["error"] !== undefined) return true;
    if (String(data.kind || "") === "kubectl_binary_missing") return true;
    if (String(data.status || "") === "SYSTEM_UNAVAILABLE") return true;
  }
  const head = String(tool.result || tool.content || "").slice(0, 160);
  if (/^(错误|error|not found|denied|invalid|failed|failure)/i.test(head)) return true;
  if (/SYSTEM_UNAVAILABLE|kubectl_binary_missing/i.test(head)) return true;
  return false;
}

function shortToolName(tool) {
  const name = tool.name || "tool";
  if (name === "kubectl") {
    const args = parseJsonLoose(tool.arguments);
    const cmd = args && args.command;
    if (cmd) {
      const m = String(cmd).match(/kubectl\s+(\w+)(?:\s+(\w+))?/);
      if (m) return m[1] + (m[2] ? " " + m[2] : "");
    }
    return "kubectl";
  }
  return name;
}

function riskLevel(tool) {
  const r = String((tool && tool.risk) || "SAFE").toUpperCase();
  if (r === "LOW") return "LOW";
  if (r === "MEDIUM") return "MEDIUM";
  if (r === "HIGH") return "HIGH";
  if (r === "CRITICAL") return "CRITICAL";
  return "SAFE";
}

function buildToolCard(tool, isHistory) {
  const card = document.createElement("div");
  const isErr = isHistory ? toolIsError(tool) : false;

  card.className =
    "tool-card process-step tool-step " +
    (isHistory ? (isErr ? "error" : "completed") : "executing");

  card.dataset.name = tool.name || "";

  if (!isHistory) card.dataset.started = Date.now();

  card.dataset.toolId = "tool-" + Date.now() + "-" + Math.random().toString(36).slice(2, 6);

  const head = document.createElement("div");
  head.className = "tool-head";

  const dot = document.createElement("span");
  dot.className = "tool-status-dot";

  const verb = document.createElement("span");
  verb.className = "tool-verb";
  verb.textContent = shortToolName(tool);

  const cmd = document.createElement("span");
  cmd.className = "tool-command";
  cmd.textContent = commandText(tool);
  cmd.title = commandText(tool);

  const risk = document.createElement("span");
  const rl = riskLevel(tool);
  risk.className = "tool-risk risk-" + rl.toLowerCase();
  risk.textContent = rl;

  const time = document.createElement("span");
  time.className = "tool-time";
  if (isHistory) {
    time.textContent = tool.duration ? tool.duration.toFixed(1) + "s" : "";
  } else {
    time.textContent = "…";
  }

  const copy = document.createElement("button");
  copy.className = "tool-copy";
  copy.textContent = "复制";
  copy.onclick = async (e) => {
    e.stopPropagation();
    try {
      await navigator.clipboard.writeText(commandText(tool));
      copy.textContent = "已复制";
      setTimeout(() => { copy.textContent = "复制"; }, 1200);
    } catch (err) { /* 静默 */ }
  };

  const toggle = document.createElement("button");
  toggle.className = "tool-toggle";
  toggle.innerHTML =
    '<span>展开</span>' +
    '<svg fill="none" stroke="currentColor" viewBox="0 0 24 24">' +
    '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>' +
    '</svg>';

  toggle.onclick = (e) => {
    e.stopPropagation();
    card.classList.toggle("open");
    toggle.classList.toggle("open");
    toggle.querySelector("span").textContent = card.classList.contains("open") ? "收起" : "展开";
    scroll();
  };

  head.onclick = () => {
    card.classList.toggle("open");
    toggle.classList.toggle("open");
    toggle.querySelector("span").textContent = card.classList.contains("open") ? "收起" : "展开";
    scroll();
  };

  head.append(dot, verb, cmd, risk, time, copy, toggle);

  const errBar = document.createElement("div");
  errBar.className = "tool-error-bar";
  if (isErr) {
    const errMsg = String(
      tool.summary || stripUntrusted(tool.content || tool.result) || tool.content || ""
    ).slice(0, 240);
    errBar.innerHTML = '<span class="err-label">错误</span>' + escapeHtml(errMsg);
  }

  const output = document.createElement("pre");
  output.className = "tool-output";
  if (isHistory) output.innerHTML = renderToolOutput(tool);
  else if (tool && tool.name === "create_resource") output.innerHTML = crFlow(null, tool);

  card.appendChild(head);
  card.appendChild(errBar);

  // create_resource 专属：YAML 取工具调用入参原文，与实际提交内容一致，随会话历史保留
  const manifest = buildManifestBlock(tool);
  if (manifest) card.appendChild(manifest);

  card.appendChild(output);

  return card;
}

function buildManifestBlock(tool) {
  if (!tool || tool.name !== "create_resource") return null;
  const data = parseJsonLoose(tool.data);
  const args = parseJsonLoose(tool.arguments);
  const mf =
    (data && typeof data.proposalManifest === "string" ? data.proposalManifest.trim() : "") ||
    (args && typeof args.manifest === "string" ? args.manifest.trim() : "");
  if (!mf) return null;

  const det = document.createElement("details");
  det.className = "tool-manifest";
  det.open = true;

  const sum = document.createElement("summary");
  sum.textContent = "创建清单 YAML（与本次实际提交的原文一致）";

  const body = document.createElement("div");
  body.className = "mf-body";

  const pre = document.createElement("pre");
  pre.textContent = mf;

  const copy = document.createElement("button");
  copy.className = "mf-copy";
  copy.textContent = "复制";
  copy.onclick = async (e) => {
    e.stopPropagation();
    try {
      await navigator.clipboard.writeText(mf);
      copy.textContent = "已复制";
      setTimeout(() => { copy.textContent = "复制"; }, 1200);
    } catch (err) { /* 静默 */ }
  };

  body.append(pre, copy);
  det.append(sum, body);
  return det;
}

function addToolCard(tool) {
  const { root } = ensureProgressPanel();
  const card = buildToolCard(tool, false);
  root.appendChild(card);
  pendingTools.push(card);
  scroll();
}

function fillToolOutput(tool) {
  const idx = pendingTools.findIndex(
    (c) => !c.dataset.filled && (!tool.name || c.dataset.name === tool.name)
  );
  if (idx < 0) return;

  const card = pendingTools[idx];
  card.dataset.filled = "1";
  card.classList.remove("executing");

  const text = tool.result || "";
  const isErr = toolIsError(tool);

  card.classList.add(isErr ? "error" : "completed");

  const time = card.querySelector(".tool-time");
  const ms = Date.now() - Number(card.dataset.started || Date.now());
  time.textContent = ms >= 0 ? (ms / 1000).toFixed(1) + "s" : "";

  if (isErr) {
    const errBar = card.querySelector(".tool-error-bar");
    if (errBar) {
      const errMsg = String(
        tool.summary || stripUntrusted(text) || text
      ).slice(0, 240);
      errBar.innerHTML = '<span class="err-label">错误</span>' + escapeHtml(errMsg);
    }
  }

  const output = card.querySelector(".tool-output");
  output.innerHTML = renderToolOutput({
    name: tool.name,
    result: text,
    data: tool.data,
    summary: tool.summary
  });

  if (tool.truncated) output.innerHTML += "\n…[TRUNCATED]";

  const toggle = card.querySelector(".tool-toggle");
  if (toggle) {
    const setOpen = (open) => {
      card.classList.toggle("open", open);
      toggle.classList.toggle("open", open);
      toggle.querySelector("span").textContent = open ? "收起" : "展开";
    };
    setOpen(true);
  }

  pendingTools.splice(idx, 1);
  updateToolSummary();
}

function collapseCompletedToolCards() {
  document.querySelectorAll(".tool-card.open:not(.error)").forEach((card) => {
    const toggle = card.querySelector(".tool-toggle");
    card.classList.remove("open");
    if (toggle) {
      toggle.classList.remove("open");
      const label = toggle.querySelector("span");
      if (label) label.textContent = "展开";
    }
  });
}

function addToolFromHistory(m) {
  const root = processRoot(true);
  const card = buildToolCard(
    {
      name: m.name,
      content: m.content,
      arguments: m.arguments,
      data: m.data,
      ok: m.ok,
      risk: m.risk,
      duration: m.duration,
      summary: m.summary
    },
    true
  );
  root.appendChild(card);
}

function commandText(tool) {
  const args = parseJsonLoose(tool && tool.arguments);
  if (tool.name === "kubectl") {
    const c = args && args.command;
    return c ? String(c) : "kubectl";
  }
  if (tool.name === "create_resource") {
    const mf = args && typeof args.manifest === "string" ? args.manifest : "";
    const n = (mf.match(/^\s*kind\s*:/gm) || []).length;
    const mode = args && args.mode ? String(args.mode) : "dry_run";
    return "[create_resource] mode=" + mode + (n ? " · " + n + " 个对象" : "");
  }
  return "[" + (tool.name || "") + "] " + formatArgs(args);
}

/* ═══════════════════════════════════════════════════════
   审批卡片
   ═══════════════════════════════════════════════════════ */

function showApproval(choice) {
  const existing = document.querySelector(".approval");
  if (existing) existing.remove();

  const card = document.createElement("div");
  card.className = "approval";

  // Secret 值请求：密码框收集，值只提交一次，不进对话历史与会话文件。
  if (choice.secret) {
    appendSecretApproval(card, choice.prompt);
    inner().appendChild(card);
    scroll();
    return;
  }

  const prompt = document.createElement("div");
  prompt.className = "prompt";
  prompt.textContent = choice.prompt || "是否执行此操作？";

  const btns = document.createElement("div");
  btns.className = "btns";

  const mk = (label, cls, value) => {
    const b = document.createElement("button");
    b.className = cls;
    b.textContent = label;
    b.onclick = async () => {
      if (card.dataset.submitting === "true") return;
      card.dataset.submitting = "true";
      card.classList.add("submitting");
      btns.querySelectorAll("button").forEach((btn) => { btn.disabled = true; });
      try {
        await api(
          "/api/sessions/" + encodeURIComponent(currentSession) + "/approve",
          { method: "POST", body: JSON.stringify({ choice: value }) }
        );
        resolveApproval(card, value);
        setStatus(true);
        showTyping("等待 Agent 继续…", true);
      } catch (err) {
        card.dataset.submitting = "false";
        card.classList.remove("submitting");
        btns.querySelectorAll("button").forEach((btn) => { btn.disabled = false; });
        addMsg("error", "审批提交失败: " + err.message);
      }
    };
    return b;
  };

  btns.appendChild(mk("确认执行", "yes", "yes"));
  btns.appendChild(mk("确认，本次不再询问", "always", "yes_and_dont_ask_again"));
  btns.appendChild(mk("拒绝", "no", "no"));

  card.appendChild(prompt);
  card.appendChild(btns);
  inner().appendChild(card);
  scroll();
}

/* Secret 值卡片：值提交后立即清空输入框，不进消息列表、不进会话文件。 */
function appendSecretApproval(card, promptText) {
  const prompt = document.createElement("div");
  prompt.className = "prompt";
  prompt.textContent = promptText || "请输入 Secret 值：";

  const row = document.createElement("div");
  row.className = "secret-row";
  const field = document.createElement("input");
  field.type = "password";
  field.className = "secret-input";
  field.autocomplete = "new-password";
  field.spellcheck = false;
  field.placeholder = "Secret 值";
  row.appendChild(field);

  const hint = document.createElement("div");
  hint.className = "secret-hint";
  hint.textContent = "值只用于本次创建，不会写入对话、会话文件或审计日志";

  const btns = document.createElement("div");
  btns.className = "btns";

  const submit = (cancelled) => {
    if (card.dataset.submitting === "true") return;
    const value = cancelled ? "" : field.value;
    field.value = "";
    if (value === "") cancelled = true;
    card.dataset.submitting = "true";
    card.classList.add("submitting");
    btns.querySelectorAll("button").forEach((b) => { b.disabled = true; });
    api("/api/sessions/" + encodeURIComponent(currentSession) + "/approve",
      { method: "POST", body: JSON.stringify({ choice: cancelled ? "no" : value }) })
      .then(() => {
        resolveSecretApproval(card, cancelled);
        if (!cancelled) {
          setStatus(true);
          showTyping("等待 Agent 继续…", true);
        }
      })
      .catch((err) => {
        card.dataset.submitting = "false";
        card.classList.remove("submitting");
        btns.querySelectorAll("button").forEach((b) => { b.disabled = false; });
        addMsg("error", "Secret 提交失败: " + err.message);
      });
  };

  const mk = (label, cls, onClick) => {
    const b = document.createElement("button");
    b.className = cls;
    b.textContent = label;
    b.onclick = onClick;
    return b;
  };

  btns.appendChild(mk("提交", "yes", () => submit(false)));
  btns.appendChild(mk("取消", "no", () => submit(true)));

  field.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      e.preventDefault();
      submit(false);
    }
  });

  card.appendChild(prompt);
  card.appendChild(row);
  card.appendChild(hint);
  card.appendChild(btns);
  setTimeout(() => field.focus(), 0);
}

function resolveSecretApproval(card, cancelled) {
  card.classList.add("resolved");
  card.classList.remove("submitting");
  if (cancelled) card.classList.add("rejected");
  ["secret-row", "secret-hint", "btns"].forEach((sel) => {
    const el = card.querySelector("." + sel);
    if (el) el.remove();
  });
  const stamp = document.createElement("div");
  stamp.className = "resolution" + (cancelled ? " rejected" : "");
  stamp.textContent = cancelled ? "已取消，未提交 Secret 值" : "已提交（值不显示、不记录）";
  card.appendChild(stamp);
}

function resolveApproval(card, value) {
  const rejected = value === "no";
  card.classList.add("resolved");
  card.classList.remove("submitting");
  if (rejected) card.classList.add("rejected");
  const btns = card.querySelector(".btns");
  if (btns) btns.remove();
  const stamp = document.createElement("div");
  stamp.className = "resolution" + (rejected ? " rejected" : "");
  stamp.textContent = rejected
    ? "已拒绝，操作未执行"
    : value === "yes_and_dont_ask_again"
      ? "已批准执行（同类操作本会话内不再询问）"
      : "已批准执行";
  card.appendChild(stamp);
}

/* ═══════════════════════════════════════════════════════
   发送消息
   ═══════════════════════════════════════════════════════ */

async function send() {
  const input = $("input");
  const q = input.value.trim();
  if (!q || chatBusy) return;

  if (!currentSession) {
    try {
      const d = await api("/api/sessions", { method: "POST", body: JSON.stringify({}) });
      openSession(d.id);
    } catch (e) {
      addMsg("error", "创建会话失败: " + e.message);
      return;
    }
  }

  chatBusy = true;
  resetStopControl();
  setBusy(true);
  hideWelcome();
  addMsg("user", q);
  input.value = "";
  input.style.height = "48px";
  resetTimeline();
  pendingTools = [];
  toolCallCount = 0;
  startRunStatus("正在分析…");
  showTyping("Agent 正在分析…");

  try {
    await api(
      "/api/sessions/" + encodeURIComponent(currentSession) + "/send-message",
      { method: "POST", body: JSON.stringify({ query: q, skipPermissions: false }) }
    );
  } catch (e) {
    addErrorCard(e.message);
    chatBusy = false;
    resetStopControl();
    setBusy(false);
    hideTyping();
    closeProgress("已中断");
    collapseCompletedToolCards();
    resetTimeline();
    stopRunStatus("interrupted", "发送失败");
  }
}

/* ═══════════════════════════════════════════════════════
   工具函数
   ═══════════════════════════════════════════════════════ */

function formatArgs(args) {
  if (!args || typeof args !== "object" || Array.isArray(args)) return "";
  return "(" + Object.entries(args).map(([k, v]) =>
    k + "=" + (typeof v === "object" ? JSON.stringify(v) : String(v))
  ).join(" ") + ")";
}

function scroll() {
  const c = $("chat");
  if (c.scrollHeight - c.scrollTop - c.clientHeight > 100) return;
  c.scrollTop = c.scrollHeight;
}

function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

function formatTime(t) {
  try {
    const d = new Date(t);
    const now = new Date();
    const diff = (now - d) / 1000;
    if (diff < 60) return "刚刚";
    if (diff < 3600) return Math.floor(diff / 60) + " 分钟前";
    if (diff < 86400) return Math.floor(diff / 3600) + " 小时前";
    if (diff < 604800) return Math.floor(diff / 86400) + " 天前";
    return d.toLocaleDateString("zh-CN", { month: "short", day: "numeric" });
  } catch (e) { return ""; }
}

function resetStopControl() {
  stopRequested = false;
  stopAcknowledged = false;
  const stopBtn = $("stop");
  if (!stopBtn) return;
  stopBtn.disabled = false;
  stopBtn.title = "停止本轮分析";
  stopBtn.setAttribute("aria-label", "停止本轮分析");
}

async function stopCurrentRun() {
  if (stopRequested || !chatBusy || !currentSession) return;
  stopRequested = true;
  const stopBtn = $("stop");
  if (stopBtn) {
    stopBtn.disabled = true;
    stopBtn.title = "正在停止…";
    stopBtn.setAttribute("aria-label", "正在停止…");
  }
  try {
    await api("/api/sessions/" + encodeURIComponent(currentSession) + "/cancel", { method: "POST", body: "{}" });
  } catch (e) {
    const msg = (e && e.message) || String(e);
    if (!/no active run|no pending approval|already/i.test(msg)) {
      addErrorCard("停止失败: " + msg);
    }
    stopRequested = false;
    stopAcknowledged = false;
    if (stopBtn) {
      stopBtn.disabled = false;
      stopBtn.title = "停止本轮分析";
      stopBtn.setAttribute("aria-label", "停止本轮分析");
    }
  }
}

function setBusy(busy) {
  const input = $("input");
  const sendBtn = $("send");
  const stopBtn = $("stop");

  if (busy) {
    input.disabled = true;
    input.placeholder = "Agent 正在处理…";
    sendBtn.disabled = true;
    if (stopBtn) {
      stopBtn.style.display = "inline-flex";
      stopBtn.disabled = stopRequested;
    }
  } else {
    input.disabled = false;
    input.placeholder = "例如：检查下集群健康状态，或 为什么 payment-api 一直重启？";
    sendBtn.disabled = false;
    if (stopBtn) {
      stopBtn.style.display = "none";
      stopBtn.disabled = false;
    }
    input.focus();
  }
}

/* ═══════════════════════════════════════════════════════
   Markdown 渲染
   ═══════════════════════════════════════════════════════ */

function markdown(s) {
  const lines = s.split("\n");
  let html = "";
  let inCode = false;
  let codeBuf = [];
  let codeLang = "";
  let list = null;

  const closeList = () => {
    if (list) {
      html += "</" + list + ">";
      list = null;
    }
  };

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];

    if (line.startsWith("```")) {
      closeList();
      if (inCode) {
        html += codeBlockHtml(codeLang, codeBuf.join("\n"));
        codeBuf = [];
        codeLang = "";
      } else {
        codeLang = line.slice(3).trim().replace(/[^\w.+#-]/g, "");
      }
      inCode = !inCode;
      continue;
    }

    if (inCode) { codeBuf.push(line); continue; }

    if (/^#{1,6} /.test(line)) {
      closeList();
      const level = line.indexOf(" ");
      html += "<h" + level + ">" + inline(line.slice(level + 1)) + "</h" + level + ">";
    } else if (/^\s*[-*] /.test(line)) {
      if (list !== "ul") { closeList(); list = "ul"; html += "<ul>"; }
      html += "<li>" + inline(line.replace(/^\s*[-*] /, "")) + "</li>";
    } else if (/^\s*\d+\.\s/.test(line)) {
      if (list !== "ol") { closeList(); list = "ol"; html += "<ol>"; }
      html += "<li>" + inline(line.replace(/^\s*\d+\.\s/, "")) + "</li>";
    } else if (/^\|/.test(line)) {
      closeList();
      html += '<div class="table-wrap"><table><tr>' + tableCells(line, "th") + "</tr>";
      i++;
      if (i < lines.length && /^[-|:\s]+$/.test(lines[i].replace(/^\|/, "").replace(/\|$/, ""))) {
        i++;
      }
      while (i < lines.length && lines[i].startsWith("|")) {
        html += "<tr>" + tableCells(lines[i], "td") + "</tr>";
        i++;
      }
      i--;
      html += "</table></div>";
    } else if (/^&gt; /.test(line)) {
      closeList();
      html += "<blockquote>" + inline(line.replace(/^&gt; /, "")) + "</blockquote>";
    } else if (line.trim() === "") {
      closeList();
    } else {
      closeList();
      html += "<p>" + inline(line) + "</p>";
    }
  }

  closeList();
  if (inCode) html += codeBlockHtml(codeLang, codeBuf.join("\n"));
  return '<div class="markdown">' + html + "</div>";
}

function codeBlockHtml(lang, code) {
  return (
    '<div class="code-block"><div class="code-meta">' +
    '<span class="code-lang">' + (lang || "text") + '</span>' +
    '<button type="button" class="code-copy">复制</button>' +
    '</div><pre><code>' + code + '</code></pre></div>'
  );
}

function tableCells(line, tag) {
  return line.split("|").filter((c) => c.trim() !== "")
    .map((c) => "<" + tag + ">" + inline(c.trim()) + "</" + tag + ">").join("");
}

function inline(s) {
  s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/\*([^*]+)\*/g, "<em>$1</em>");
  s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
  s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  return s;
}

/* ═══════════════════════════════════════════════════════
   移动端侧栏
   ═══════════════════════════════════════════════════════ */

function toggleSidebar() {
  const open = $("sidebar").classList.toggle("open");
  $("sidebarOverlay").classList.toggle("open");
  $("sidebarToggle").setAttribute("aria-expanded", String(open));
}

function closeSidebar() {
  $("sidebar").classList.remove("open");
  $("sidebarOverlay").classList.remove("open");
  $("sidebarToggle").setAttribute("aria-expanded", "false");
}

/* ═══════════════════════════════════════════════════════
   事件绑定
   ═══════════════════════════════════════════════════════ */

$("newSession").onclick = async () => {
  const data = await api("/api/sessions", { method: "POST", body: JSON.stringify({}) });
  openSession(data.id);
};

$("send").onclick = send;
$("stop").onclick = stopCurrentRun;

function copyTextFallback(text) {
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.setAttribute("readonly", "");
  ta.style.position = "fixed";
  ta.style.top = "0";
  ta.style.left = "0";
  ta.style.opacity = "0";
  document.body.appendChild(ta);
  ta.select();
  let ok = false;
  try { ok = document.execCommand("copy"); } catch (err) { ok = false; }
  ta.remove();
  return ok;
}

const chatRoot = $("chat");
if (chatRoot) {
  chatRoot.addEventListener("click", (e) => {
    const btn = e.target.closest(".code-copy");
    if (!btn) return;
    const block = btn.closest(".code-block");
    const codeEl = block ? block.querySelector("pre code") : null;
    if (!codeEl) return;
    const text = codeEl.innerText.replace(/\n$/, "");
    const flash = (ok) => {
      if (btn._copyTimer) clearTimeout(btn._copyTimer);
      btn.textContent = ok ? "已复制" : "复制失败";
      btn._copyTimer = setTimeout(() => {
        btn.textContent = "复制";
        btn._copyTimer = null;
      }, 1200);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => flash(true), () => flash(copyTextFallback(text)));
    } else {
      flash(copyTextFallback(text));
    }
  });
}

$("input").addEventListener("keydown", (e) => {
  if (e.isComposing || e.keyCode === 229) return;
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});

$("input").addEventListener("input", function () {
  this.style.height = "48px";
  this.style.height = Math.min(this.scrollHeight, 180) + "px";
});

$("sidebarToggle").onclick = toggleSidebar;
$("sidebarOverlay").onclick = closeSidebar;

showWelcome();

loadSessions().catch((e) => addMsg("error", "加载会话失败: " + e.message));

</script>

</body>
</html>
